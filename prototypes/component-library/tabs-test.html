<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>tek-tabs — verification harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Archivo:wdth,wght@75..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../packages/tokens/dist/tek.complete.css">
<script type="module" src="../../packages/ui/dist/tek-ui.js"></script>
<style>
  body { background: var(--tek-colors-neutral-800, #1e1e1e); padding: 40px; font-family: var(--tek-fonts-family-geist, sans-serif); }
</style>
</head>
<body>
<tek-stack gap="s11" align="start">
  <tek-tabs id="sub" orientation="horizontal" aria-label="Report views">
    <tek-tab value="config" active>Configuration</tek-tab>
    <tek-tab value="view">View Settings</tek-tab>
    <tek-tab value="export" disabled>Export</tek-tab>
  </tek-tabs>

  <tek-tabs id="nav" orientation="vertical" aria-label="Application">
    <tek-tab value="setup" active>Setup</tek-tab>
    <tek-tab value="status">Status</tek-tab>
    <tek-tab value="results">Results</tek-tab>
    <tek-tab value="reports">Reports</tek-tab>
  </tek-tabs>
</tek-stack>
</body>
</html>
