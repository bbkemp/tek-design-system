document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

efault: #7b7b7b;\n  --tek-color-modal-text-default: #ffffff;\n  --tek-color-modal-shadow-default: #00000033;\n  --tek-color-footer-background-default: #252525;\n  --tek-color-footer-text-default: #cccccc;\n  --tek-color-canvas-background-default: #1e1e1e;\n}\n<\u002Fstyle>\n\n<style>\n/* ════════════════════════════════════════════════════════════════════════\n   New semantic tokens proposed for the TekExpress redesign.\n   Documented in tek-express-redesign-additions.md. Each binds to an existing\n   primitive (or a proposed primitive) and carries a hex fallback. Light/dark\n   parity confirmed — UI-state colours are constant primitives.\n════════════════════════════════════════════════════════════════════════ */\n:root {\n  /* surface the UI-state primitives as semantic aliases (the DS only ships\n     these as primitives today — see audit) */\n  --tek-color-success: var(--tek-colors-ui-success-green, #42b54c);\n  --tek-color-warning: var(--tek-colors-ui-warning-yellow, #e0b732);\n  --tek-color-error:   var(--tek-colors-ui-error-red, #e74848);\n\n  /* pressed/active shades — proposed new primitives */\n  --tek-colors-brand-tek-blue-pressed: #1ea3d4;\n  --tek-colors-ui-success-green-pressed: #379a40;\n\n  /* single-shadow alias (matches DS modal shadow) */\n  --shadow-modal: 0px 2px 6px 0px rgba(0,0,0,0.2);\n\n  /* container-breakpoint tokens (proposed) — see additions audit.\n     @container queries can't read custom props in the condition, so the px\n     below are duplicated literally in the @container rules and kept in sync\n     with these names. */\n  --tek-container-breakpoint-sm: 640px;\n  --tek-container-breakpoint-md: 900px;\n  --tek-container-breakpoint-lg: 1200px;\n\n  /* chrome surface — app shell sits one step above canvas (light parity below) */\n  --app-chrome-bg: var(--tek-colors-neutral-900, #181818);\n\n  /* AA: disabled text/icons use neutral-300 (was #454545, failed contrast on dark) */\n  --tek-color-input-text-disabled: var(--tek-colors-neutral-300, #979797);\n  --tek-color-button-text-inactive: var(--tek-colors-neutral-300, #979797);\n}\n[data-theme=\"light\"] { --app-chrome-bg: var(--tek-colors-neutral-white, #ffffff); }\n\n/* Safe reset per DS guide — box-sizing only + scoped element reset.\n   Never `* { padding:0 }` — it zeroes tek-* host padding through the shadow boundary. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body, h1, h2, h3, p, fieldset, legend, ul, figure { margin: 0; padding: 0; }\n\n/* themed scrollbars — follow the app's dark/light mode */\n* { scrollbar-width: thin; }\n[data-theme=\"dark\"] * { scrollbar-color: var(--tek-colors-neutral-500, #5a5a5a) transparent; }\n[data-theme=\"light\"] * { scrollbar-color: var(--tek-colors-neutral-300, #979797) transparent; }\n::-webkit-scrollbar { width: 12px; height: 12px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { border-radius: var(--tek-borders-radius-full, 9999px); border: 3px solid transparent; background-clip: padding-box; }\n[data-theme=\"dark\"] ::-webkit-scrollbar-thumb { background-color: var(--tek-colors-neutral-500, #5a5a5a); }\n[data-theme=\"dark\"] ::-webkit-scrollbar-thumb:hover { background-color: var(--tek-colors-neutral-400, #6f6f6f); }\n[data-theme=\"light\"] ::-webkit-scrollbar-thumb { background-color: var(--tek-colors-neutral-300, #979797); }\n[data-theme=\"light\"] ::-webkit-scrollbar-thumb:hover { background-color: var(--tek-colors-neutral-450, #5e5e5e); }\n::-webkit-scrollbar-corner { background: transparent; }\n\nhtml, body { height: 100%; }\nbody {\n  background: var(--tek-colors-neutral-900, #181818);\n  color: var(--tek-colors-neutral-100, #cccccc);\n  font-family: var(--tek-fonts-family-geist, system-ui, sans-serif);\n  font-size: var(--tek-fonts-text-size-lg, 14px);\n  line-height: var(--tek-fonts-text-line-height-lg, 20px);\n  -webkit-font-smoothing: antialiased;\n  min-height: 100vh;\n  display: flex; align-items: flex-start; justify-content: center;\n  padding: var(--tek-spacing-s11, 24px);\n}\n[data-theme=\"light\"] body { background: var(--tek-colors-neutral-200, #b3b3b3); }\n\n/* ── Window frame — the real TekExpress content area: 875 × 773 ──────────────\n   Resizable so the live @container breakpoints can still be demonstrated by\n   dragging the bottom-right handle. */\n.frame {\n  width: 995px; height: 773px;\n  max-width: 100%;\n  resize: both; overflow: hidden; position: relative;\n  display: flex; flex-direction: column;\n  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);\n  border-radius: var(--tek-borders-radius-05, 11px);\n  box-shadow: var(--shadow-modal);\n  background: var(--tek-color-canvas-background-default, #1e1e1e);\n}\n.frame.maximized { position: fixed; inset: 0; width: auto !important; height: auto !important; max-width: none; border-radius: 0; border: none; resize: none; z-index: 100; }\n.frame.minimized { display: none; }\n\n/* ── Windows 11-style window chrome (host-OS; not a DS component). The bar is\n   INVERTED from the app theme: light bar over a dark app, dark bar over a light app. */\n.titlebar { display: flex; align-items: stretch; height: 32px; flex-shrink: 0; border-bottom: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); user-select: none; -webkit-user-select: none; }\n.tb-drag { display: flex; align-items: center; gap: var(--tek-spacing-s05, 8px); flex: 1 1 auto; padding-left: var(--tek-spacing-s06, 10px); min-width: 0; }\n.tb-icon { width: 15px; height: 13px; display: inline-flex; flex-shrink: 0; }\n.tb-title { font-family: var(--tek-fonts-family-geist, sans-serif); font-size: var(--tek-fonts-text-size-sm, 12px); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.tb-caption { display: flex; align-items: stretch; flex-shrink: 0; }\n.cap { width: 46px; align-self: stretch; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: background .12s, color .12s; }\n.cap svg { display: block; }\n.cap.close:hover { background: #c42b1c; color: #fff; }\n.cap:focus-visible { box-shadow: inset 0 0 0 2px var(--tek-color-text-link-default, #33baea); }\n\n/* dark app → LIGHT bar */\n[data-theme=\"dark\"] .titlebar { background: var(--tek-colors-neutral-100, #cccccc); }\n[data-theme=\"dark\"] .tb-icon svg path { fill: var(--tek-colors-neutral-900, #181818); }\n[data-theme=\"dark\"] .tb-title { color: var(--tek-colors-neutral-700, #252525); }\n[data-theme=\"dark\"] .cap { color: var(--tek-colors-neutral-800, #1e1e1e); }\n[data-theme=\"dark\"] .cap:hover { background: color-mix(in srgb, var(--tek-colors-neutral-black, #000) 8%, transparent); }\n\n/* light app → DARK bar */\n[data-theme=\"light\"] .titlebar { background: var(--tek-colors-neutral-900, #181818); }\n[data-theme=\"light\"] .tb-icon svg path { fill: var(--tek-colors-neutral-white, #ffffff); }\n[data-theme=\"light\"] .tb-title { color: var(--tek-colors-neutral-300, #979797); }\n[data-theme=\"light\"] .cap { color: var(--tek-colors-neutral-100, #cccccc); }\n[data-theme=\"light\"] .cap:hover { background: color-mix(in srgb, var(--tek-colors-neutral-white, #fff) 9%, transparent); }\n\n/* minimized taskbar chip + closed card */\n.taskchip { position: fixed; left: var(--tek-spacing-s11, 24px); bottom: var(--tek-spacing-s11, 24px); z-index: 120; display: none; align-items: center; gap: var(--tek-spacing-s05, 8px); padding: var(--tek-spacing-s05, 8px) var(--tek-spacing-s09, 16px); background: var(--app-chrome-bg); border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); border-bottom: var(--tek-borders-width-04, 2px) solid var(--tek-color-text-link-default, #33baea); border-radius: var(--tek-borders-radius-03, 5px); box-shadow: var(--shadow-modal); cursor: pointer; color: var(--tek-color-input-text-filled, #cccccc); font-family: var(--tek-fonts-family-geist, sans-serif); font-size: var(--tek-fonts-text-size-md, 13px); }\n.taskchip.open { display: inline-flex; }\n.taskchip .tb-icon { width: 16px; height: 14px; }\n/* Chip bg is inverted from the titlebar, so the icon must flip too (else dark-on-dark = invisible). */\n[data-theme=\"dark\"] .taskchip .tb-icon svg path { fill: var(--tek-colors-neutral-100, #cccccc); }\n[data-theme=\"light\"] .taskchip .tb-icon svg path { fill: var(--tek-colors-neutral-900, #181818); }\n.closed-card { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; }\n.closed-card.open { display: flex; }\n.app {\n  display: flex; flex-direction: column;\n  flex: 1 1 auto; min-height: 0; width: 100%;\n  container-type: inline-size;     /* ← the responsiveness anchor */\n  container-name: app;\n  overflow: hidden;\n}\n\n/* ── Top navigation (chrome) ─────────────────────────────────────────────── */\n.topnav {\n  display: flex; align-items: center; gap: var(--tek-spacing-s09, 16px);\n  height: 48px; flex-shrink: 0;\n  padding: 0 var(--tek-spacing-s09, 16px);\n  background: var(--app-chrome-bg);\n  border-bottom: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);\n}\n.brand { display: inline-flex; align-items: center; gap: var(--tek-spacing-s05, 8px); flex-shrink: 0; }\n.brand .mark {\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.brand .mark svg { height: 28px; width: auto; }\n.brand .mark svg path { fill: var(--tek-color-icons-default, #ffffff); }\n.brand .wordmark {\n  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600;\n  font-size: var(--tek-fonts-heading-size-xs, 16px); line-height: 1; letter-spacing: -0.02em;\n  color: var(--tek-color-modal-text-default, #ffffff);\n}\n.brand-sep-removed { display: none; }\n.brand .filename {\n  margin-left: var(--tek-spacing-s05, 8px);\n  font-family: var(--tek-fonts-family-geist, system-ui, sans-serif);\n  font-size: var(--tek-fonts-text-size-sm, 12px); font-weight: 400; line-height: 1;\n  color: var(--tek-color-selector-label-unchecked, #afafaf); white-space: nowrap;\n}\n.brand .filename .unsaved { color: var(--tek-color-text-link-default, #33baea); }\n.nav-spacer { flex: 1 1 auto; }\n\n/* ════════════════════════════════════════════════════════════════════════\n   SINGLE LAYOUT — left nav + content stage + right run-rail.\n   ITERATION KNOBS: tune the --nav-* / --rail-* / --run-* dials below; structure\n   rules reference them so spacing/size changes never touch markup.\n   ════════════════════════════════════════════════════════════════════════ */\n:root {\n  --nav-width: var(--tek-spacing-s25, 160px);           /* left nav width (s25 · 160px) */\n  --nav-width-compact: var(--tek-spacing-s21, 96px);    /* compact nav width (s21 · 96px) */\n  --nav-pad-y: var(--tek-spacing-s07, 12px);            /* nav top padding (s07 · 12px) */\n  --nav-icon: 18px;             /* nav-item icon size (icon dim, not spacing) */\n  --rail-width: var(--tek-spacing-s23, 128px);          /* run-rail width (snapped 124→s23 · 128px) */\n  --rail-pad-x: var(--tek-spacing-s07, 12px);           /* rail horizontal padding (s07 · 12px) */\n  --rail-pad-y: var(--tek-spacing-s10, 20px);           /* rail vertical padding (s10 · 20px) */\n  --run-gap: var(--tek-spacing-s09, 16px);              /* gap between Start / Pause (s09 · 16px) */\n  --btn-pad-y: var(--tek-spacing-s06, 10px);            /* run-button vertical padding (compact rounded-rect) */\n  --btn-pad-x: var(--tek-spacing-s09, 16px);            /* run-button horizontal padding (s09 · 16px) */\n}\n\n/* ── Body: left nav + stage + right rail ───────────────────────────────── */\n.body { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0;\n  overflow: hidden; position: relative; }\n\n/* left nav — sticky full-height so it stays put while the stage scrolls */\n.sidenav {\n  flex: 0 0 var(--nav-width); display: flex; flex-direction: column;\n  padding: var(--nav-pad-y) 0 0;\n  background: var(--app-chrome-bg);\n  border-right: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);\n  overflow-x: hidden;\n}\n.sidenav tek-tabs, .sidenav tek-tab { width: 100%; box-sizing: border-box; }\n.sidenav .tkx-tab { width: 100%; box-sizing: border-box; min-width: 0; }\n.sidenav .tkx-tab svg { width: var(--nav-icon); height: var(--nav-icon); }\n.sidenav .tkx-lbl { overflow: hidden; text-overflow: ellipsis; }\n.sidenav-spacer { flex: 1 1 auto; min-height: var(--tek-spacing-s11, 24px); }\n\n/* right run-control rail — sticky full-height, no border, same bg as content */\n.runrail {\n  flex: 0 0 var(--rail-width); display: flex; flex-direction: column; justify-content: flex-start;\n  padding: var(--rail-pad-y) var(--rail-pad-x);\n  background: var(--tek-color-canvas-background-default, #1e1e1e);\n  position: absolute; top: 0; right: 12px; width: var(--rail-width); height: 100%; z-index: 5;\n}\n.runrail .run-group { display: flex; flex-direction: column; gap: var(--run-gap); }\n.run-group tek-button { display: block; width: 100%; padding: var(--btn-pad-y) var(--btn-pad-x); border-radius: var(--tek-borders-radius-05, 11px) !important; }\n.run-group .bc { display: flex; flex-direction: column-reverse; align-items: center; justify-content: center; line-height: 1; font-weight: 600; gap: var(--tek-spacing-s04, 6px); font-family: var(--tek-fonts-family-mono, monospace); }\n.run-group .bc svg { display: block; flex-shrink: 0; width: 18px; height: 18px; }\n\n.stage { overflow: visible; }\n\n/* Nav Style = Compact (Tweaks) — hide nav icons, narrow the nav */\n.nav-compact { --nav-width: var(--nav-width-compact); }\n.nav-compact .sidenav .tkx-tab svg { display: none; }\n\n.chrome-right { display: inline-flex; align-items: center; gap: var(--tek-spacing-s09, 16px); flex-shrink: 0; }\n.theme-toggle { display: inline-flex; align-items: center; gap: var(--tek-spacing-s04, 6px); }\n.theme-toggle span { font-size: 12px; line-height: 1; }\n.statusbar .theme-toggle { transform: scale(0.85); transform-origin: right center; }\n\n/* Options menu button */\n.options { position: relative; }\n.options-btn {\n  display: inline-flex; align-items: center; gap: var(--tek-spacing-s04, 6px);\n  padding: var(--tek-spacing-s03, 4px) var(--tek-spacing-s06, 10px) var(--tek-spacing-s03, 4px) var(--tek-spacing-s07, 12px);\n  background: var(--tek-color-button-background-default, #1e1e1e);\n  border: var(--tek-borders-width-02, 1px) solid var(--tek-color-button-border-default, #33baea);\n  border-radius: var(--tek-borders-radius-full, 9999px);\n  color: var(--tek-color-button-text-default, #cccccc);\n  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 106; font-weight: 600;\n  font-size: var(--tek-fonts-text-size-lg, 14px); letter-spacing: 0.02em;\n  cursor: pointer; outline: none; transition: background .15s, color .15s, border-color .15s;\n}\n.options-btn:hover { background: var(--tek-color-button-background-hover, #000); color: var(--tek-color-button-text-hover, #fff); }\n.options-btn:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-button-border-default, #33baea); }\n.options-btn .chev { display: inline-flex; align-items: center; justify-content: center; margin-left: 0; }\n.options-btn .chev svg { display: block; transition: transform .15s; transform-box: fill-box; transform-origin: center; }\n.options-btn[aria-expanded=\"true\"] .chev svg { transform: rotate(180deg); }\n.options-menu {\n  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; min-width: 232px;\n  background: var(--tek-color-input-background-default, #252525);\n  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-filled, #afafaf);\n  border-radius: var(--tek-borders-radius-05, 11px);\n  box-shadow: var(--shadow-modal);\n  padding: var(--tek-spacing-s03, 4px); display: none;\n}\n.options-menu.open { display: block; }\n.options-menu button {\n  display: flex; align-items: center; justify-content: space-between; gap: var(--tek-spacing-s09, 16px);\n  width: 100%; text-align: left; background: none; border: none; cursor: pointer;\n  padding: var(--tek-spacing-s05, 8px) var(--tek-spacing-s07, 12px);\n  border-radius: var(--tek-borders-radius-02, 3px);\n  font-family: var(--tek-fonts-family-geist, sans-serif);\n  font-size: var(--tek-fonts-text-size-lg, 14px); line-height: var(--tek-fonts-text-line-height-lg, 20px);\n  color: var(--tek-color-input-text-filled, #cccccc); outline: none;\n}\n.options-menu button:hover, .options-menu button:focus-visible { background: var(--tek-color-selector-background-unchecked, #454545); color: var(--tek-color-modal-text-default, #fff); }\n.options-menu .sub { font-family: var(--tek-fonts-family-mono, monospace); font-size: var(--tek-fonts-text-size-sm, 12px); color: var(--tek-color-input-text-default, #979797); display: inline-flex; align-items: center; }\n.options-menu .sub svg { display: block; }\n.options-menu .check { width: 14px; display: inline-flex; color: var(--tek-color-text-link-default, #33baea); }\n.options-menu button[aria-checked=\"true\"] .check::before { content: \"\\2713\"; font-size: 13px; }\n.options-menu hr { border: none; border-top: 0.5px solid var(--tek-color-input-border-default, #7b7b7b); margin: var(--tek-spacing-s03, 4px) 0; }\n\n/* ── Stage / content ─────────────────────────────────────────────────────── */\n.stage { flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior: none; padding: var(--tek-spacing-s09, 16px); padding-right: var(--rail-width, 128px); padding-bottom: var(--tek-spacing-s13, 32px); display: flex; flex-direction: column; gap: var(--tek-spacing-s09, 16px); }\n/* Left padding: nav screens (Status/Results/Plots/Reports) get 24px; the Setup wizard view (with the side progress rail) stays at 16px. */\n.stage:has(#navView:not([hidden])) { padding-left: var(--tek-spacing-s11, 24px); }\n.title-row { display: flex; align-items: center; gap: var(--tek-spacing-s07, 12px); flex-wrap: wrap; }\n.title {\n  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600;\n  font-size: var(--tek-fonts-heading-size-sm, 20px); line-height: var(--tek-fonts-heading-line-height-sm, 26px);\n  letter-spacing: -0.02em; color: var(--tek-color-modal-text-default, #ffffff);\n}\n.title .unsaved { color: var(--tek-color-text-link-default, #33baea); }\n\n/* work area: wizard rail + panel */\n.work { display: grid; grid-template-columns: 164px 1fr; gap: var(--tek-spacing-s11, 24px); align-items: start; min-width: 0; }\n.rail {\n  position: sticky; top: 0; align-self: start;\n  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);\n  border-radius: var(--tek-borders-radius-05, 11px);\n  background: var(--app-chrome-bg);\n  padding: var(--tek-spacing-s09, 16px);\n}\n.panel { min-width: 0; display: flex; flex-direction: column; gap: var(--tek-spacing-s09, 16px); }\n\n/* section cards (acquisition + identity use the group-box card look directly) */\n.card {\n  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);\n  border-radius: var(--tek-borders-radius-05, 11px);\n  background: var(--app-chrome-bg);\n  padding: var(--tek-spacing-s09, 16px);\n}\n\n/* generic 2-col field grid */\n.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tek-spacing-s07, 12px) var(--tek-spacing-s11, 24px); align-items: start; }\n.acq { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--tek-spacing-s11, 24px); align-items: center; }\n.radio-stack { display: flex; flex-direction: column; gap: var(--tek-spacing-s06, 10px); }\n\n.card-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tek-spacing-s07, 12px) var(--tek-spacing-s11, 24px); align-items: center; }\n\n.section-heading {\n  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600;\n  font-size: var(--tek-fonts-heading-size-xs, 16px); line-height: var(--tek-fonts-heading-line-height-xs, 24px);\n  letter-spacing: -0.02em; color: var(--tek-color-modal-text-default, #ffffff);\n  margin-bottom: var(--tek-spacing-s07, 12px);\n}\n.subhead {\n  font-family: var(--tek-fonts-family-geist, sans-serif); font-weight: 500;\n  font-size: var(--tek-fonts-text-size-xl, 16px); line-height: var(--tek-fonts-text-line-height-xl, 24px);\n  color: var(--tek-color-modal-text-default, #ffffff);\n}\n.hr { border: none; border-top: 0.5px solid var(--tek-color-input-border-default, #7b7b7b); margin: var(--tek-spacing-s09, 16px) 0; }\n.hr-v { border: none; border-left: 0.5px solid var(--tek-color-input-border-default, #7b7b7b); align-self: stretch; margin: 0; }\n.probe-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tek-spacing-s07, 12px) var(--tek-spacing-s11, 24px); align-items: end; }\n.probe-row .subhead { grid-column: 1 / -1; }\n.inline-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--tek-spacing-s09, 16px) var(--tek-spacing-s11, 24px); align-items: end; }\n\n/* DUT ID field with inline edit affordance */\n.dutid { display: flex; align-items: stretch; gap: var(--tek-spacing-s05, 8px); }\n.dutid tek-input { flex: 1 1 auto; }\n.dutid .icon-btn { width: 37px; height: 37px; align-self: center; }   /* match form-field height, square */\n.icon-btn {\n  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;\n  width: 30px; height: 30px; cursor: pointer;\n  background: var(--tek-color-input-background-default, #252525);\n  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);\n  border-radius: var(--tek-borders-radius-03, 5px);\n  color: var(--tek-color-icons-default, #ffffff); outline: none; transition: border-color .1s, color .1s;\n}\n.icon-btn:hover { border-color: var(--tek-color-input-border-filled, #afafaf); }\n.icon-btn:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-text-link-default, #33baea); }\n.icon-btn svg { display: block; }\n\n/* button content (icon + label) inside slotted tek-button */\n.bc { display: inline-flex; align-items: center; justify-content: center; gap: var(--tek-spacing-s05, 8px); }\n.bc svg { display: block; }\n\n/* tek-button host defaults to width:100% — make buttons size to content by default;\n   only full-width where we explicitly opt in (.run-group buttons). */\ntek-button { width: auto; }\n/* dialog buttons: match the Start/Stop (secondary) size, never huge */\n#dlgScrim tek-button, #modalScrim tek-button { padding: var(--tek-spacing-s04, 6px) var(--tek-spacing-s08, 14px); width: auto; }\n/* compact dialog buttons that must fit several per row */\n#modalScrim tek-button.btn-cmp { padding: var(--tek-spacing-s04, 6px) var(--tek-spacing-s06, 10px); }\n\n/* solid + success button tones — token rebinding (proposed additions) */\n/* solid + success button tones — token rebinding (proposed additions).\n   Text + icons stay BLACK in every state; hover uses a more-vibrant shade. */\ntek-button.btn-solid {\n  --tek-color-button-background-default: var(--tek-colors-brand-tek-blue, #33baea);\n  --tek-color-button-text-default: var(--tek-colors-neutral-900, #181818);\n  --tek-color-button-background-hover: #4ccbf7;\n  --tek-color-button-text-hover: var(--tek-colors-neutral-900, #181818);\n  --tek-color-button-border-default: var(--tek-colors-brand-tek-blue, #33baea);\n  --tek-color-button-border-hover: #4ccbf7;\n}\ntek-button.btn-success {\n  --tek-color-button-background-default: var(--tek-color-success, #42b54c);\n  --tek-color-button-text-default: var(--tek-colors-neutral-900, #181818);\n  --tek-color-button-background-hover: #4fd35a;\n  --tek-color-button-text-hover: var(--tek-colors-neutral-900, #181818);\n  --tek-color-button-border-default: var(--tek-color-success, #42b54c);\n  --tek-color-button-border-hover: #4fd35a;\n}\ntek-button.btn-danger {\n  --tek-color-button-background-default: var(--tek-color-error, #e74848);\n  --tek-color-button-text-default: var(--tek-colors-neutral-white, #fff);\n  --tek-color-button-background-hover: #ff5a5a;\n  --tek-color-button-text-hover: var(--tek-colors-neutral-white, #fff);\n  --tek-color-button-border-default: var(--tek-color-error, #e74848);\n  --tek-color-button-border-hover: #ff5a5a;\n}\ntek-button.btn-danger {\n  --tek-color-button-background-default: var(--tek-color-error, #e74848);\n  --tek-color-button-text-default: var(--tek-colors-neutral-900, #181818);\n  --tek-color-button-background-hover: #ff5a5a;\n  --tek-color-button-text-hover: var(--tek-colors-neutral-900, #181818);\n  --tek-color-button-border-default: var(--tek-color-error, #e74848);\n  --tek-color-button-border-hover: #ff5a5a;\n}\n/* Deterministic fills — a direct light-DOM background reliably wins over the DS\n   component's :host { background: var(...) }, which can lose the cascade race at\n   web-component upgrade time (the var is set but :host paints transparent). */\ntek-button.btn-solid:not([inactive]) { background: var(--tek-colors-brand-tek-blue, #33baea) !important; border-color: var(--tek-colors-brand-tek-blue, #33baea) !important; }\ntek-button.btn-success:not([inactive]) { background: var(--tek-color-success, #42b54c) !important; border-color: var(--tek-color-success, #42b54c) !important; }\ntek-button.btn-danger:not([inactive]) { background: var(--tek-color-error, #e74848) !important; border-color: var(--tek-color-error, #e74848) !important; }\ntek-button.btn-solid:not([inactive]):hover { background: #4ccbf7 !important; border-color: #4ccbf7 !important; }\ntek-button.btn-success:not([inactive]):hover { background: #4fd35a !important; border-color: #4fd35a !important; }\ntek-button.btn-danger:not([inactive]):hover { background: #ff5a5a !important; border-color: #ff5a5a !important; }\n/* ghost run button — no border, no fill; icon + label only, centered to match Start/Stop */\ntek-button.btn-ghost {\n  --tek-color-button-background-default: color-mix(in srgb, var(--tek-colors-neutral-white, #fff) 6%, transparent);\n  --tek-color-button-background-hover: color-mix(in srgb, var(--tek-colors-neutral-white, #fff) 10%, transparent);\n  --tek-color-button-background-inactive: color-mix(in srgb, var(--tek-colors-neutral-white, #fff) 5%, transparent);\n  --tek-color-button-border-default: transparent;\n  --tek-color-button-border-hover: transparent;\n  --tek-color-button-border-inactive: transparent;\n  --tek-color-button-text-inactive: var(--tek-colors-neutral-300, #979797);\n}\n/* run-control CTAs (side-nav foot): semibold label + leading Phosphor icon, centered */\n.sidenav-foot .bc { display: flex; align-items: center; justify-content: center; line-height: 1; font-weight: 600; gap: var(--tek-spacing-s05, 8px); }\n.sidenav-foot .bc svg { display: block; flex-shrink: 0; }\n\n/* action cluster */\n.actions {\n  display: flex; align-items: center; justify-content: flex-end; gap: var(--tek-spacing-s07, 12px);\n  flex-wrap: wrap; padding-top: var(--tek-spacing-s02, 2px);\n}\n.actions .run-group { display: inline-flex; gap: var(--tek-spacing-s07, 12px); margin-right: auto; }\n.actions tek-button { width: auto; }\n/* Back/Next: vertically centered, tight caret-to-text and caret-to-border spacing */\n.actions #backBtn .bc, .actions #nextBtn .bc { display: flex; align-items: center; justify-content: center; gap: 0; line-height: 1; }\n.actions #backBtn .bc svg, .actions #nextBtn .bc svg { display: block; }\n.actions #nextBtn { padding-right: var(--tek-spacing-s03, 4px); }\n.actions #backBtn { padding-left: var(--tek-spacing-s03, 4px); }\n/* last-step Start Test (green, play icon) matches the run-rail Start: 8px icon gap, symmetric pill padding */\n.actions #nextBtn.btn-success .bc { gap: var(--tek-spacing-s03, 4px); font-weight: 600; }\n.actions #nextBtn.btn-success { padding-left: var(--tek-spacing-s07, 12px); padding-right: var(--tek-spacing-s07, 12px); }\n\n/* running state: form becomes read-only */\n.panel.is-running .card, .panel.is-running tek-group-box { opacity: .55; pointer-events: none; }\n.panel.is-running .actions { opacity: 1; pointer-events: auto; }\n\n/* nav/wizard panel swap */\n.placeholder { display: none; }\n[hidden] { display: none !important; }\n\n/* ── Multi-screen: nav view, sub-tabs, context header, panels ─────────────── */\n#navView { min-width: 0; display: flex; flex-direction: column; gap: var(--tek-spacing-s09, 16px); }\n.panel-head { display: flex; align-items: flex-start; gap: var(--tek-spacing-s09, 16px); flex-wrap: wrap; min-height: 26px; }\n.panel-head > *:not(.panel-title):not(.title) { align-self: center; }\n.panel-title { font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600; font-size: var(--tek-fonts-heading-size-sm, 20px); line-height: var(--tek-fonts-heading-line-height-sm, 28px); letter-spacing: -0.02em; color: var(--tek-color-modal-text-default, #fff); }\n.panel-head .spacer { flex: 1 1 auto; }\n/* Bryan: vertically center title with its sibling controls (subtabs/dropdowns/toolbars)\n   + uniform min-height so the title sits at the same Y on every nav screen (Results has only\n   short text-links, which otherwise let its header collapse 11px shorter than the others) */\n#navView > .panel-head, #panel-step > .panel-head { align-items: center; }\n/* panel-step is a size container so the Configuration split can stack based on the\n   ACTUAL content-area width (nav + wizard rail + run rail eat horizontal space the\n   app-level breakpoint can't see). The stacking rule lives in app.js CSS so it wins\n   on source order over the .cfg-split base rule. */\n#panel-step { container-type: inline-size; }\n#navView > .panel-head { min-height: 37px; }\n/* Configuration title row: keep the Global/Measurements tabs on the title line (narrow\n   wizard rap; border-radius: var(--tek-borders-radius-full, 9999px); padding: var(--tek-spacing-s04, 6px) var(--tek-spacing-s09, 16px); font-family: var(--tek-fonts-family-geist, sans-serif); font-size: var(--tek-fonts-text-size-lg, 14px); line-height: var(--tek-fonts-text-line-height-lg, 20px); color: var(--tek-color-input-text-default, #979797); outline: none; transition: background .15s, color .15s; }\n.subtab:hover { color: var(--tek-color-input-text-filled, #cccccc); }\n.subtab[aria-selected=\"true\"] { background: var(--tek-color-text-link-default, #33baea); color: var(--tek-colors-neutral-900, #181818); font-weight: 500; }\n.subtab:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-text-link-default, #33baea); }\n\n/* context header (Device : Suite : Version) */\n.context-header { font-family: var(--tek-fonts-family-mono, monospace); font-size: var(--tek-fonts-text-size-md, 13px); line-height: var(--tek-fonts-text-line-height-md, 16px); color: var(--tek-color-input-text-default, #979797); padding: var(--tek-spacing-s04, 6px) var(--tek-spacing-s07, 12px); border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); border-radius: var(--tek-borders-radius-full, 9999px); background: var(--tek-color-footer-background-default, #252525); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }\n\n/* tertiary action button (subtle, for in-panel actions like Show MOI / Refresh) */\n.btn-row { display: inline-flex; gap: var(--tek-spacing-s07, 12px); flex-wrap: wrap; }\n\n/* bottom action button group — side-by-side, right-aligned; full-width stack only when skinny */\n.action-bar { display: flex; flex-direction: row; justify-content: flex-end; align-items: center; gap: var(--tek-spacing-s07, 12px); flex-wrap: wrap; }\n.action-bar tek-button { flex: 0 0 auto; width: auto; }\n/* blue text-link button group (bulk select on Test Selection & similar) — no underline */\n.link-bar { display: flex f); margin-bottom: var(--tek-spacing-s04, 6px); }\n\n/* split layout used by Test Selection (tree | description) */\n.split-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--tek-spacing-s11, 24px); align-items: stretch; min-width: 0; }\n.ts-desc-col { display: flex; flex-direction: column; min-width: 0; }\n.ts-desc-col .readonly-box { flex: 1 1 auto; }\n/* Test Selection tree: pull the tree content 12px tighter to the left (tree 8→0, node 8→4) */\n#testTree .tkx-tree { padding-left: 0; }\n#testTree .tkx-tnode { padding-left: var(--tek-spacing-s03, 4px); }\n/* sub-items (child rows) one step smaller than their parent groups */\n#testTree .tkx-tnode.child { font-size: var(--tek-fonts-text-size-md, 13px); }\n/* Reports View Settings: Contents (left) + User logo / Group Report By stacked (right) */\n.vs-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--tek-spacing-s09, 16px); align-items: start; min-width: 0; }\n.vs-side { display: flex; flex-direction: column; gap: var(--tek-spacing-s09, 16px); min-width: 0; }\n@container app (max-width: 699px) { .vs-grid { grid-template-columns: 1fr; } }\n\n/* log / message-history mono pane */\n.log-pane { font-family: var(--tek-fonts-family-mono, monospace); font-size: var(--tek-fonts-text-size-sm, 12px); line-height: 1.7; color: var(--tek-color-input-text-filled, #cccccc); background: var(--tek-colors-neutral-900, #181818); border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); border-radius: var(--tek-borders-radius-05, 11px); padding: var(--tek-spacing-s09, 16px); overflow-y: auto; min-height: 200px; max-height: 340px; white-space: pre-wrap; }\n.log-pane .ts { color: var(--tek-color-input-text-default, #979797); }\n\n/* inline status pill cell helpers for tables */\n.cell-status { display: inline-flex; align-items: center; gap: var(--tek-spacing-s05, 8px); white-space: nowrap; }\n.tkx-dt td .cell-status { white-space: nowrap; }\n.cell-dot { width: 7px; height: 7px; border-radius: 9999px; flex-shrink: 0; }\n.dot-idle { background: var(--tek-color-input-text-default, #979797); }\n.dot-run { background: var(--tek-color-text-link-default, #33baea); }\n.dot-ok { background: var(--tek-color-success, #42b54c); }\n.dot-warn { background: var(--tek-color-warning, #e0b732); }\n.dot-err { background: var(--tek-color-error, #e74848); }\n.row-active { background: color-mix(in srgb, var(--tek-color-text-link-default,#33baea) 12%, transparent); }\n\n/* dialogs (generic) */\n.scrim { position: absolute; inset: 0; z-index: 200; background: var(--tek-color-modal-background-default, #181818cc); display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); padding: var(--tek-spacing-s11, 24px); }\n.scrim.open { display: flex; }\n.dialog { width: min(640px, 100%); max-height: calc(100% - 48px); display: flex; flex-direction: column; background: var(--tek-color-modal-background-default, #1e1e1e); border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-filled, #afafaf); border-radius: var(--tek-borders-radius-05, 11px); box-shadow: var(--shadow-modal); }\n.dialog.wide { width: min(820px, 100%); }\n.dialog-head { display: flex; align-items: center; gap: var(--tek-spacing-s07, 12px); padding: var(--tek-spacing-s09, 16px) var(--tek-spacing-s11, 24px); border-bottom: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); }\n.dialog-title { flex: 1 1 auto; font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600; font-size: var(--tek-fonts-heading-size-sm, 20px); letter-spacing: -0.02em; color: var(--tek-color-modal-text-default, #fff); }\n.dialog-x { width: 28px; height: 28px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; background: none; border: none; color: var(--tek-color-input-text-default, #979797); border-radius: var(--tek-borders-radius-02, 3px); outline: none; }\n.dialog-x:hover { color: var(--tek-color-modal-text-default, #fff); background: var(--tek-color-selector-background-unchecked, #454545); }\n.dialog-x:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-text-link-default, #33baea); }\n.dialog-body { padding: var(--tek-spacing-s11, 24px); overflow-y: auto; display: flex; flex-direction: column; gap: var(--tek-spacing-s11, 24px); }\n.dialog-foot { display: flex; align-items: center; gap: var(--tek-spacing-s07, 12px); justify-content: flex-end; flex-wrap: wrap; padding: var(--tek-spacing-s09, 16px) var(--tek-spacing-s11, 24px); border-top: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); }\n.dialog-foot .spacer { flex: 1 1 auto; }\n.help-text { font-size: var(--tek-fonts-text-size-md, 13px); line-height: var(--tek-fonts-text-line-height-md, 16px); color: var(--tek-color-input-text-default, #979797); }\n\n.check-list { display: flex; flex-direction: column; gap: var(--tek-spacing-s05, 8px); }\n.check-inline { display: block; line-height: 26px; }\n.check-inline .pref-num { white-space: nowrap; }\n.check-inline .pref-head { display: block; }\n.check-inline .pref-sub { display: block; }\n.check-inline tek-input { display: inline-block; vertical-align: middle; position: relative; top: -1px; width: 40px; margin: 0 1px; line-height: 1;\n  /* compact inline field — shrink the DS input's token-driven padding & font so it sits proportional to the text line */\n  --tek-spacing-s05: 3px; --tek-spacing-s06: 7px; --tek-spacing-s02: 7px;\n  --tek-fonts-text-size-lg: 12px; --tek-fonts-text-line-height-lg: 14px; }\n.muted { color: var(--tek-color-input-text-default, #979797); }\n.sub-indent { margin-left: var(--tek-spacing-s13, 32px); }\n\n/* running minimised window */\n.run-win { position: fixed; right: var(--tek-spacing-s11, 24px); bottom: var(--tek-spacing-s11, 24px); z-index: 240; width: 420px; max-width: calc(100vw - 48px); display: none; flex-direction: column; background: var(--tek-color-modal-background-default, #1e1e1e); border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-filled, #afafaf); border-radius: var(--tek-borders-radius-05, 11px); box-shadow: var(--shadow-modal); overflow: hidden; }\n.run-win.open { display: flex; }\n.run-win-head { display: flex; align-items: center; gap: var(--tek-spacing-s07, 12px); padding: var(--tek-spacing-s06, 10px) var(--tek-spacing-s09, 16px); background: var(--app-chrome-bg); border-bottom: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); }\n.run-win-title { flex: 1 1 auto; font-family: var(--tek-fonts-family-mono, monospace); font-size: var(--tek-fonts-text-size-sm, 12px); color: var(--tek-color-input-text-filled, #cccccc); }\n.run-win .log-pane { border: none; border-radius: 0; max-height: 220px; min-height: 160px; }\n.run-win-foot { display: flex; align-items: center; gap: var(--tek-spacing-s07, 12px); padding: var(--tek-spacing-s06, 10px) var(--tek-spacing-s09, 16px); border-top: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); }\n.run-win-foot .spacer { flex: 1 1 auto; }\n.run-dot { width: 12px; height: 12px; border-radius: var(--tek-borders-radius-02, 3px); }\n\n/* outlined (non-teal) pill — Results Debug / Preferences (corpus: only outlined buttons) */\n.pill-outline { appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: var(--tek-spacing-s05, 8px); background: transparent; border: var(--tek-borders-width-02, 1px) solid var(--tek-color-input-border-filled, #afafaf); border-radius: var(--tek-borders-radius-full, 9999px); padding: var(--tek-spacing-s04, 6px) var(--tek-spacing-s09, 16px); font-family: var(--tek-fonts-family-geist, sans-serif); font-size: var(--tek-fonts-text-size-md, 13px); color: var(--tek-color-input-text-filled, #cccccc); outline: none; transition: border-color .15s, color .15s; }\n.pill-outline:hover { border-color: var(--tek-color-modal-text-default, #fff); color: var(--tek-color-modal-text-default, #fff); }\n.pill-outline:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-text-link-default, #33baea); }\n\n/* icon-btn small for table cells / toolbars */\n.icon-btn.sm { width: 26px; height: 26px; }\n.plot-placeholder { border: var(--tek-borders-width-03, 1.5px) dashed var(--tek-color-input-border-default, #7b7b7b); border-radius: var(--tek-borders-radius-05, 11px); background: var(--tek-colors-neutral-900, #181818); min-height: 240px; display: flex; align-items: center; justify-content: center; }\n\n/* status bar */\n.statusbar { flex-shrink: 0; }\n.statusbar tek-status-pill { cursor: default; }\n\n/* ════════════════════════════════════════════════════════════════════════\n   CONTAINER BREAKPOINTS  (live @container queries on .app)\n   Recalibrated for the compact 875px content frame. Drag the frame's resize\n   handle to fire them live. Names map to --tek-container-breakpoint-* tokens.\n     ≥760  cb-md/lg : two-column work (184px rail + panel), full layout\n     600–759 cb-sm  : rail stacks above content, wizard goes horizontal\n     <600  cb-xs    : single column, nav → icons, actions stack\n════════════════════════════════════════════════════════════════════════ */\n\n/* ════════════════════════════════════════════════════════════════\n   CONTAINER BREAKPOINTS  (live @container queries on .app)\n   The 168px side-nav permanently consumes width, so thresholds reflect the\n   remaining content column. Drag the frame's resize handle to fire them live.\n     ≥700  cb-md/lg : side-nav + wizard rail + panel, two-column form\n     560–699 cb-sm  : wizard rail stacks above content, goes horizontal\n     <560  cb-xs    : side-nav → icons, single-column form, actions stack\n════════════════════════════════════════════════════════════════ */\n\n/* cb-sm (560–699): wizard rail moves above content and goes horizontal */\n@container app (max-width: 699px) {\n  .work { grid-template-columns: 1fr; gap: var(--tek-spacing-s09, 16px); }\n  .cfg-split { grid-template-columns: 1fr; }\n  .rail { padding: var(--tek-spacing-s07, 12px) var(--tek-spacing-s09, 16px); }\n  .rail .tkx-wiz { flex-direction: row; }\n  .rail .tkx-step { flex-direction: column; align-items: center; flex: 1; text-align: center; gap: var(--tek-spacing-s04, 6px); }\n  .rail .tkx-rail { flex-direction: row; width: 100%; }\n  .rail .tkx-guide { height: var(--tek-borders-width-04, 2px); width: auto; min-height: 0; flex: 1; margin: 0 var(--tek-spacing-s04, 6px); }\n  .rail .tkx-step-lbl { padding-top: 0; }\n}\n\n/* cb-xs (<560): side-nav condenses to icons, single column, actions stack */\n@container app (max-width: 559px) {\n  .brand .wordmark, .brand .filename { display: none; }\n  .sidenav { flex-basis: 52px; padding-left: var(--tek-spacing-s03, 4px); padding-right: var(--tek-spacing-s03, 4px); }\n  .sidenav .tkx-lbl { display: none; }\n  .sidenav .tkx-tab { justify-content: center; padding-left: var(--tek-spacing-s05, 8px); padding-right: var(--tek-spacing-s05, 8px); }\n  .acq, .grid-2, .card-split, .probe-row { grid-template-columns: 1fr; }\n  .rail .tkx-step-lbl { font-size: var(--tek-fonts-text-size-sm, 12px); line-height: var(--tek-fonts-text-line-height-md, 16px); }\n  .actions { justify-content: stretch; }\n  .actions .run-group { width: 100%; }\n  .actions tek-button { flex: 1 1 auto; }\n}\n<\u002Fstyle>\n<style id=\"__chrome-merge\">\n/* Bryan: merge the Windows title bar into the top nav (the top nav IS the window bar).\n   Keep the nav's dark background + font colour; window controls move into it, right. */\n/* Bryan: 2px gap between the stage scrollbar and the window's right edge */\n.body { padding-right: var(--tek-borders-width-04, 2px); }\n.brand .mark svg { height: 24px; }                 /* logo 24px, scales proportionally */\n.chrome-right { gap: 0; height: 100%; align-items: stretch; }\n.chrome-right .options { height: 100%; display: flex; align-items: stretch; }\n/* Options: lose the
