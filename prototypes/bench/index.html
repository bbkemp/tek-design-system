  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--bg-4: #2e2e2e;\n    --fg: #ffffff;\n    --fg-2: #cccccc;\n    --fg-3: #afafaf;\n    --fg-4: #7b7b7b;\n    --fg-5: #454545;\n    --border: #454545;\n    --border-2: #7b7b7b;\n    --tek-blue: #33baea;\n\n    /* channels (from figma metadata) */\n    --ch1: #fff53b;       /* yellow */\n    --ch2: #20cfd3;       /* cyan */\n    --ch3: #ea2d56;       /* red/pink */\n    --ch4: #7ac323;       /* green */\n    --ch5: #fb8b28;       /* orange */\n    --ch6: #8a38f5;       /* purple */\n\n    --ch1-dim: rgba(255,245,59,.12);\n    --ch2-dim: rgba(32,207,211,.12);\n    --ch3-dim: rgba(234,45,86,.12);\n    --ch4-dim: rgba(122,195,35,.12);\n    --ch5-dim: rgba(251,139,40,.12);\n    --ch6-dim: rgba(138,56,245,.14);\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n\n  /* ── Touchscreen optimization ─────────────────────────────── */\n  html { -webkit-text-size-adjust: 100%; }\n  body { overscroll-behavior: none; }\n  button, [role=\"button\"], select, input, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }\n  button, select { min-height: 44px; }\n  /* Small decorative buttons opt out with .btn-sm */\n  button.btn-sm, select.btn-sm { min-height: 0; }\n  input[type=\"range\"] { height: 44px; }\n  input[type=\"range\"]::-webkit-slider-thumb { width: 22px; height: 22px; }\n  /* Scrollable regions: momentum + no rubber band chrome */\n  .scroll { -webkit-overflow-scrolling: touch; }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: #0b0b0b;\n    color: var(--fg);\n    font-family: \"Geist\", system-ui, sans-serif;\n    font-size: 14px;\n    line-height: 1.4;\n    -webkit-font-smoothing: antialiased;\n    overflow: hidden;\n    height: 100%;\n  }\n\n  h1, h2, h3, h4, p { margin: 0; }\n  button { font-family: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }\n\n  /* ── Shell: host the fixed-size stage on a centered viewport ─── */\n  .viewport {\n    position: fixed;\n    inset: 0;\n    display: block;   /* HARD CONSTRAINT: block layout; stage is absolutely positioned */\n    background: var(--bg); /* excess area shows as the app's canvas color (#181818) */\n    overflow: hidden;\n  }\n  .stage {\n    width: 1600px;\n    height: 900px;\n    background: var(--bg);\n    position: absolute;\n    left: 50%;\n    top: 50%;\n    transform-origin: center center;\n    transform: translate(-50%, -50%);\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n  }\n\n  /* ── Top app bar ──────────────────────────────────────────── */\n  .app-bar {\n    height: 44px;\n    background: var(--bg-2);\n    border-bottom: 0.5px solid var(--border);\n    display: flex;\n    align-items: center;\n    padding: 0 16px;\n    gap: 16px;\n    flex-shrink: 0;\n  }\n  .brand {\n    font-family: \"Archivo\", sans-serif;\n    font-weight: 600;\n    font-stretch: 120%;\n    font-size: 14px;\n    letter-spacing: -0.02em;\n    color: var(--fg);\n  }\n  .brand .dot { color: var(--tek-blue); }\n  .crumbs {\n    font-family: \"Geist Mono\", monospace;\n    font-size: 11px;\n    color: var(--fg-3);\n    display: flex;\n    gap: 10px;\n    align-items: center;\n  }\n  .crumbs b { color: var(--fg-2); font-weight: 500; }\n  .crumbs span.sep { color: var(--fg-5); }\n  .app-bar .spacer { flex: 1; }\n  .app-bar-actions { display: flex; gap: 8px; align-items: center; }\n  .pill-btn {\n    height: 26px;\n    padding: 0 12px;\n    border-radius: 999px;\n    border: 1px solid var(--border);\n    color: var(--fg-2);\n    font-family: \"Geist\", sans-serif;\n    font-size: 12px;\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    transition: background 120ms, border-color 120ms, color 120ms;\n  }\n  .pill-btn:hover { border-color: var(--fg-3); color: var(--fg); }\n  .pill-btn[aria-pressed=\"true\"] {\n    background: var(--fg);\n    color: #000;\n    border-color: var(--fg);\n  }\n  .run-dot {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: #42b54c;\n    box-shadow: 0 0 6px #42b54c;\n  }\n  .run-dot.paused { background: #e0b732; box-shadow: 0 0 6px #e0b732; }\n\n  /* Rail \"Running\" button — pulsing dot when running, steady amber when paused */\n  .rail-run { position: relative; }\n  .rail-run-dot {\n    width: 8px; height: 8px; border-radius: 50%;\n    background: #42b54c; box-shadow: 0 0 8px #42b54c;\n    transition: background 120ms, box-shadow 120ms;\n  }\n  .rail-run[aria-pressed=\"true\"] .rail-run-dot {\n    animation: rail-run-pulse 1.6s ease-in-out infinite;\n  }\n  .rail-run[aria-pressed=\"false\"] .rail-run-dot {\n    background: #e0b732; box-shadow: 0 0 8px #e0b732;\n    animation: none;\n  }\n  @keyframes rail-run-pulse {\n    0%, 100% { box-shadow: 0 0 6px #42b54c; }\n    50%      { box-shadow: 0 0 14px #42b54c, 0 0 4px #42b54c inset; }\n  }\n\n  /* ── Main grid: left rail + workspace ───────────────────── */\n  .main {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 56px 1fr;\n    min-height: 0;\n  }\n  .rail {\n    background: var(--bg-2);\n    border-right: 0.5px solid var(--border);\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    padding: 12px 0;\n    gap: 6px;\n  }\n  .rail-btn {\n    width: 40px; height: 40px;\n    border-radius: 7px;\n    display: grid; place-items: center;\n    color: var(--fg-3);\n    transition: background 120ms, color 120ms;\n  }\n  .rail-btn:hover { background: var(--bg-3); color: var(--fg); }\n  .rail-btn[aria-pressed=\"true\"] { background: var(--bg-4); color: var(--fg); }\n  .rail .spacer { flex: 1; }\n  .rail-label {\n    font-family: \"Geist Mono\", monospace;\n    font-size: 9px;\n    color: var(--fg-4);\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    margin-top: 4px;\n    margin-bottom: 2px;\n  }\n\n  .workspace {\n    display: grid;\n    grid-template-rows: 0px 1fr 62px 24px;\n    min-height: 0;\n    min-width: 0;\n    transition: grid-template-rows 260ms cubic-bezier(.2,.8,.2,1);\n  }\n  .workspace.has-scrubber { grid-template-rows: 96px 1fr 62px 24px; }\n\n  /* ── Scrubber pane ────────────────────────────────────────── */\n  .scrubber {\n    position: relative;\n    overflow: hidden;\n    padding: 10px 14px 8px;\n    background: var(--bg);\n    border-bottom: 0.5px solid var(--border);\n    min-height: 0;\n    display: flex;\n    flex-direction: column;\n    opacity: 0;\n    pointer-events: none;\n    transition: opacity 220ms cubic-bezier(.2,.8,.2,1);\n  }\n  .workspace.has-scrubber .scrubber { opacity: 1; pointer-events: auto; }\n  .scrubber-head {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    margin-bottom: 4px;\n    font-family: \"Geist Mono\", monospace;\n    font-size: 10px;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--fg-4);\n    flex-shrink: 0;\n  }\n  .scrubber-head .title { color: var(--fg-3); }\n  .scrubber-head .sep { opacity: 0.4; }\n  .scrubber-head .spacer { flex: 1; }\n  .scrubber-head .range-text { color: var(--fg-3); font-variant-numeric: tabular-nums; }\n  .scrubber-head .range-text b { color: var(--fg); font-weight: 500; }\n  .scrubber-head .ch-pill {\n    display: inline-flex;\n    align-items: center;\n    gap: 4px;\n    padding: 1px 5px;\n    border-radius: 3px;\n    background: var(--bg-3);\n    border: 0.5px solid var(--border);\n    color: var(--fg-3);\n    font-size: 9px;\n  }\n  .scrubber-head .ch-pill .sw {\n    width: 6px; height: 6px; border-radius: 50%;\n  }\n  /* Scrubber chips — interactive toggles. Size matches the original\n     read-only pills exactly: 9px Geist Mono, 1px 5px padding, 3px radius. */\n  button.ch-pill.sc-chip {\n    cursor: pointer;\n    font-family: \"Geist Mono\", monospace;\n    font-size: 9px;\n    font-weight: 400;\n    letter-spacing: 0;\n    text-transform: none;\n    padding: 4px 5px;\n    gap: 4px;\n    border-radius: 3px;\n    line-height: 1;\n    white-space: nowrap;\n    color: var(--fg-3);\n    min-height: 0;\n    min-width: 0;\n    transition: opacity 120ms, background 120ms, border-color 120ms, color 120ms;\n  }\n  button.ch-pill.sc-chip:hover { background: var(--bg-4); border-color: var(--border-2); color: var(--fg-2); }\n  button.ch-pill.sc-chip[aria-pressed=\"false\"] { background: var(--bg-2); }\n\n  /* Output toggle — same chip style as scrubber chips, Tek blue dot.\n     When paused, the chip is dimmed and the dot fades. */\n  .sc-output .sw {\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--tek-blue);\n    box-shadow: 0 0 4px var(--tek-blue);\n  }\n  .sc-output[aria-pressed=\"true\"] .sw {\n    animation: sc-output-pulse 1.6s ease-in-out infinite;\n  }\n  .sc-output[aria-pressed=\"false\"] {\n    opacity: 0.55;\n  }\n  .sc-output[aria-pressed=\"false\"] .sw {\n    background: var(--fg-4);\n    box-shadow: none;\n    animation: none;\n  }\n  @keyframes sc-output-pulse {\n    0%, 100% { box-shadow: 0 0 4px var(--tek-blue); }\n    50%      { box-shadow: 0 0 10px var(--tek-blue); }\n  }\n  .scrubber-viz {\n    position: relative;\n    flex: 1;\n    min-height: 0;\n    border-radius: 5px;\n    background: linear-gradient(to bottom, #0a0a0a, #0e0e0e);\n    border: 0.5px solid var(--border);\n    overflow: hidden;\n  }\n  .scrubber-viz svg {\n    position: absolute;\n    inset: 0;\n    width: 100%; height: 100%;\n    display: block;\n  }\n  .scrubber-viz .sc-trace {\n    fill: none;\n    stroke-width: 0.8;\n    vector-effect: non-scaling-stroke;\n    opacity: 0.9;\n  }\n  .scrubber-viz .sc-grid {\n    stroke: #1a1a1a;\n    stroke-width: 0.5;\n    vector-effect: non-scaling-stroke;\n  }\n  /* Dim overlay — everything outside the zoom window */\n  .sc-dim {\n    position: absolute;\n    top: 0; bottom: 0;\n    background: #181818cc;\n    pointer-events: none;\n    z-index: 1;\n  }\n  .sc-dim-left  { left: 0; }\n  .sc-dim-right { right: 0; }\n  /* Draggable window (zoom selection) */\n  .sc-window {\n    position: absolute;\n    top: 0; bottom: 0;\n    background: rgba(255,255,255,0.04);\n    border-left: 1px solid var(--fg-2);\n    border-right: 1px solid var(--fg-2);\n    cursor: grab;\n    z-index: 2;\n  }\n  .sc-window:active { cursor: grabbing; }\n  .sc-window::before, .sc-window::after {\n    content: '';\n    position: absolute;\n    top: 0; bottom: 0;\n    width: 6px;\n    cursor: ew-resize;\n    background: transparent;\n  }\n  .sc-window::before { left: -3px; }\n  .sc-window::after  { right: -3px; }\n  /* Handle grips on the edges */\n  .sc-window .sc-handle {\n    position: absolute;\n    top: 50%; transform: translateY(-50%);\n    width: 3px; height: 22px;\n    background: var(--fg-3);\n    border-radius: 1px;\n    pointer-events: none;\n  }\n  .sc-window .sc-handle.left  { left: -1px; }\n  .sc-window .sc-handle.right { right: -1px; }\n  /* Tag at top-left of window */\n  .sc-window .sc-tag {\n    position: absolute;\n    top: 2px; left: 4px;\n    font-family: \"Geist Mono\", monospace;\n    font-size: 9px;\n    color: var(--fg);\n    background: var(--bg-3);\n    padding: 1px 4px;\n    border-radius: 2px;\n    letter-spacing: 0.04em;\n    pointer-events: none;\n  }\n  /* Playhead line */\n  .sc-playhead {\n    position: absolute;\n    top: 0; bottom: 0;\n    width: 1px;\n    background: var(--tek-blue);\n    box-shadow: 0 0 4px var(--tek-blue);\n    pointer-events: none;\n    z-index: 3;\n  }\n  /* Minor ticks (x-axis) */\n  .sc-ticks {\n    position: absolute;\n    left: 0; right: 0; bottom: 2px;\n    height: 10px;\n    display: flex;\n    justify-content: space-between;\n    padding: 0 4px;\n    font-family: \"Geist Mono\", monospace;\n    font-size: 8px;\n    color: var(--fg-4);\n    letter-spacing: 0.04em;\n    pointer-events: none;\n  }\n\n  /* ── Channel grid area ───────────────────────────────────── */\n  .canvas-area {\n    padding: 14px;\n    min-height: 0;\n    min-width: 0;\n    position: relative;\n  }\n  .layout-grid {\n    width: 100%;\n    height: 100%;\n    display: grid;\n    gap: 14px;\n    min-height: 0;\n    min-width: 0;\n  }\n\n  /* ── Empty state ──────────────────────────────────────────── */\n  .empty-state {\n    grid-column: 1 / -1;\n    grid-row: 1 / -1;\n    display: grid;\n    place-items: center;\n    color: var(--fg-4);\n    animation: empty-fade 320ms cubic-bezier(.2,.8,.2,1) both;\n  }\n  .empty-mark {\n    width: 96px;\n    height: auto;\n    color: #6b6b6b; /* neutral-400-ish */\n    opacity: 0.9;\n  }\n  @keyframes empty-fade {\n    from { opacity: 0; transform: scale(0.96); }\n    to   { opacity: 1; transform: scale(1); }\n  }\n\n  /* ── Slot entrance + FLIP transitions ────────────────────── */\n  .slot {\n    animation-fill-mode: both;\n    animation-delay: var(--enter-delay, 0ms);\n    animation-duration: var(--enter-dur, 280ms);\n    animation-timing-function: var(--enter-ease, cubic-bezier(.2,.8,.2,1));\n  }\n  /* \"Entering\" — scale up, no fade (content is immediately solid) */\n  .slot[data-enter=\"new\"] { animation-name: sl-enterScale; }\n  /* Already existed — FLIP handles it via inline transform */\n  .slot[data-enter=\"flip\"] { animation: none; }\n  .slot[data-enter=\"none\"] { animation: none; }\n\n  @keyframes sl-enterScale {\n    from { transform: scale(0.5); transform-origin: center center; }\n    to   { transform: scale(1); }\n  }\n\n  /* Exiting ghost — scale down + fade; rendered in a sibling layer */\n  .exit-ghost {\n    position: absolute;\n    pointer-events: none;\n    z-index: 2;\n    animation: sl-exitFade var(--enter-dur, 280ms) var(--enter-ease, cubic-bezier(.2,.8,.2,1)) forwards;\n    transform-origin: center center;\n  }\n  @keyframes sl-exitFade {\n    from { opacity: 1; transform: scale(1); }\n    to   { opacity: 0; transform: scale(0.6); }\n  }\n\n  /* Layout templates — use CSS vars so they can be resized at runtime */\n  .layout-grid { --c1: 1fr; --c2: 1fr; --c3: 1fr; --c4: 1fr; --c5: 1fr; --c6: 1fr; }\n  .layout-1 { grid-template-columns: var(--c1); grid-template-rows: 1fr; }\n  .layout-2 { grid-template-columns: var(--c1) var(--c2); grid-template-rows: 1fr; }\n  .layout-3 { grid-template-columns: var(--c1) var(--c2) var(--c3); grid-template-rows: 1fr; }\n  .layout-4 { grid-template-columns: var(--c1) var(--c2) var(--c3) var(--c4); grid-template-rows: 1fr; }\n  .layout-5 {\n    grid-template-columns: 2fr 2fr 1.4fr;\n    grid-template-rows: 1fr 1fr;\n  }\n  .layout-5 .slot[data-pos=\"0\"] { grid-column: 1 / 3; grid-row: 1 / 2; }\n  .layout-5 .slot[data-pos=\"1\"] { grid-column: 3 / 4; grid-row: 1 / 2; }\n  .layout-5 .slot[data-pos=\"2\"] { grid-column: 1 / 2; grid-row: 2 / 3; }\n  .layout-5 .slot[data-pos=\"3\"] { grid-column: 2 / 3; grid-row: 2 / 3; }\n  .layout-5 .slot[data-pos=\"4\"] { grid-column: 3 / 4; grid-row: 2 / 3; }\n  .layout-6 {\n    grid-template-columns: 1fr 1fr 1fr;\n    grid-template-rows: 1fr 1fr;\n  }\n\n  /* ── Resizer gutters ─────────────────────────────────────── */\n  .resizer {\n    position: absolute;\n    z-index: 4;\n    display: grid;\n    place-items: center;\n    touch-action: none;\n    user-select: none;\n    -webkit-user-select: none;\n    /* Invisible wider hit target, grip sits centered */\n    width: 36px;\n    transform: translateX(-50%);\n    cursor: col-resize;\n  }\n  .resizer .grip {\n    position: relative;\n    z-index: 1;\n    width: 28px;\n    height: 28px;\n    border-radius: 999px;\n    background: var(--bg-3);\n    border: 0.5px solid var(--border);\n    display: grid;\n    place-items: center;\n    color: var(--fg-3);\n    transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;\n  }\n  .resizer:hover .grip,\n  .resizer[data-dragging=\"true\"] .grip {\n    background: var(--bg-4);\n    border-color: var(--border-2);\n    color: var(--fg);\n    transform: scale(1.08);\n  }\n  .resizer[data-dragging=\"true\"] .grip { transform: scale(1.15); }\n  .resizer .grip svg { width: 10px; height: 14px; }\n  /* While dragging, disable slot transitions globally */\n  body[data-resizing=\"true\"] .slot { transition: none !important; animation: none !important; }\n\n  /* ── Slot (channel card) ─────────────────────────────────── */\n  .slot {\n    --c: var(--ch1);\n    --c-dim: var(--ch1-dim);\n    position: relative;\n    border: 0.5px solid var(--border);\n    border-radius: 7px;\n    background: var(--bg-2);\n    display: flex;\n    overflow: hidden;\n    min-width: 0; min-height: 0;\n    transition: border-color 200ms, box-shadow 200ms;\n  }\n  .slot.focused { border-color: var(--fg-3); }\n  .slot.focused::after {\n    content: '';\n    position: absolute;\n    left: 0;\n    top: 8px;\n    bottom: 8px;\n    width: 2px;\n    border-radius: 0 2px 2px 0;\n    background: var(--c);\n    pointer-events: none;\n    z-index: 3;\n  }\n  .slot[data-ch=\"1\"] { --c: var(--ch1); --c-dim: var(--ch1-dim); }\n  .slot[data-ch=\"2\"] { --c: var(--ch2); --c-dim: var(--ch2-dim); }\n  .slot[data-ch=\"3\"] { --c: var(--ch3); --c-dim: var(--ch3-dim); }\n  .slot[data-ch=\"4\"] { --c: var(--ch4); --c-dim: var(--ch4-dim); }\n  .slot[data-ch=\"5\"] { --c: var(--ch5); --c-dim: var(--ch5-dim); }\n  .slot[data-ch=\"6\"] { --c: var(--ch6); --c-dim: var(--ch6-dim); }\n\n  .slot-inner {\n    flex: 1;\n    display: grid;\n    gap: 10px;\n    padding: 10px;\n    min-width: 0; min-height: 0;\n  }\n\n  /* Shape variants — applied per layout to switch side/stacked/compact */\n  .slot[data-shape=\"large\"] .slot-inner   { grid-template-columns: var(--inner-col, 260px) 1fr; grid-template-rows: 44px 1fr; grid-template-areas: \"meter tabs\" \"meter chart\"; }\n  .slot[data-shape=\"medium\"] .slot-inner  { grid-template-columns: 1fr;       grid-template-rows: 44px minmax(0,1fr) auto; grid-template-areas: \"tabs\" \"chart\" \"meter\"; }\n  .slot[data-shape=\"compact\"] .slot-inner { grid-template-columns: 1fr;       grid-template-rows: 40px auto minmax(0,1fr);   grid-template-areas: \"tabs\" \"meter\" \"chart\"; padding: 8px; gap: 8px; }\n ption>\n      <optgroup label=\"Tablets\">\n        <option value=\"ipad-mini\">iPad mini — 1133 × 744<\u002Foption>\n        <option value=\"ipad-air\">iPad 10.9\" / Air — 1180 × 820<\u002Foption>\n        <option value=\"ipad-11\">iPad 11\" Pro — 1194 × 834<\u002Foption>\n        <option value=\"ipad-12\">iPad Pro 12.9\" — 1366 × 1024<\u002Foption>\n        <option value=\"ipad-portrait\">iPad portrait — 820 × 1180<\u002Foption>\n        <option value=\"surface-pro\">Surface Pro — 1368 × 912<\u002Foption>\n      <\u002Foptgroup>\n      <optgroup label=\"Desktop\">\n        <option value=\"laptop-13\">Laptop 13\" — 1280 × 800<\u002Foption>\n        <option value=\"laptop-15\">Laptop 14\"/15\" — 1440 × 900<\u002Foption>\n        <option value=\"desktop-hd\">Desktop HD — 1920 × 1080<\u002Foption>\n        <option value=\"desktop-qhd\">Desktop QHD — 2560 × 1440<\u002Foption>\n      <\u002Foptgroup>\n    <\u002Fselect>\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Scale to fit<\u002Flabel>\n    <label class=\"tw-toggle\" style=\"display:inline-flex;align-items:center;gap:8px;cursor:pointer;\">\n      <input type=\"checkbox\" id=\"tw-viewport-scale\" checked=\"\">\n      <span style=\"font-size:11px;color:var(--fg-3);\">Fit container to window<\u002Fspan>\n    <\u002Flabel>\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Channels<\u002Flabel>\n    <select id=\"tw-channels\">\n      <option value=\"1\">1 channel<\u002Foption>\n      <option value=\"2\">2 channels<\u002Foption>\n      <option value=\"3\">3 channels<\u002Foption>\n      <option value=\"4\">4 channels<\u002Foption>\n      <option value=\"5\">5 channels<\u002Foption>\n      <option value=\"6\">6 channels<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Trace speed<\u002Flabel>\n    <input type=\"range\" id=\"tw-speed\" min=\"0\" max=\"3\" step=\"0.1\" value=\"1\">\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Noise<\u002Flabel>\n    <input type=\"range\" id=\"tw-noise\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.4\">\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Duration<\u002Flabel>\n    <input type=\"range\" id=\"tw-duration\" min=\"80\" max=\"800\" step=\"20\" value=\"280\">\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Easing<\u002Flabel>\n    <select id=\"tw-easing\">\n      <option value=\"smooth\" selected=\"\">Smooth out<\u002Foption>\n      <option value=\"gentle\">Gentle<\u002Foption>\n      <option value=\"snappy\">Snappy<\u002Foption>\n      <option value=\"spring\">Spring<\u002Foption>\n      <option value=\"linear\">Linear<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n  <div class=\"tw-row\">\n    <label>Waveform<\u002Flabel>\n    <select id=\"tw-wave\">\n      <option value=\"sine\" selected=\"\">Sine<\u002Foption>\n      <option value=\"square\">Square<\u002Foption>\n      <option value=\"tri\">Triangle<\u002Foption>\n      <option value=\"noisy\">Noisy mix<\u002Foption>\n    <\u002Fselect>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script id=\"state-defaults\">\n  // Tweak defaults live here so host can rewrite them\n  window.__TWEAKS = /*EDITMODE-BEGIN*/{\n    \"channels\": 2,\n    \"speed\": 1.8,\n    \"noise\": 0.5,\n    \"grid\": 0,\n    \"wave\": \"noisy\",\n    \"transition\": \"scale-fade\",\n    \"duration\": 800,\n    \"easing\": \"smooth\",\n    \"active\": [\n      1,\n      2\n    ],\n    \"scrubberOn\": true\n  }/*EDITMODE-END*/;\n<\u002Fscript>\n\n<script>\n(() => {\n  'use strict';\n\n  // ── Channel definitions — Keithley 2450 SMU configurations ─────────────\n  // Each channel represents one 2450 SMU. \"source\" = what the instrument sources\n  // (V or I), \"measure\" = what it measures. Values reflect the manual's applications:\n  // low-resistance (5-1), leakage current (6-1), I-V sweeps (7-1, 9-1), battery (8-1).\n  const CHANNELS = [\n    // Low-resistance measurement (source current, measure voltage → Ω, 4-wire)\n    { id: 1, label: 'CH 1', name: 'SMU-1', type: 'SMU ons per layout (1..6) — persisted across toggles\n  // We reset when the active count changes so each layout starts even.\n  state.colFractions = { 1: [1], 2: [1,1], 3: [1,1,1], 4: [1,1,1,1], 5: null, 6: null };\n  state.lastCount = state.active.size;\n  // Intra-slot split: meter column width in px for shapes with an internal meter|chart split.\n  // Defaults match the CSS baseline (large: 260, wide-split: 220).\n  state.innerSplits = { large: 260, 'wide-split': 220 };\n\n  function applyColFractions(forceReset = false) {\n    const n = state.active.size;\n    // Only reset to equal fractions when the channel COUNT changes (or explicit reset requested)\n    // — this preserves user-dragged column widths across redraws/resizes.\n    const countChanged = state.lastCount !== n;\n    if (n <= 4 && (countChanged || forceReset || !state.colFractions[n])) {\n      state.colFractions[n] = Array(n).fill(1);\n    }\n    state.lastCount = n;\n    const fr = state.colFractions[n];\n    if (fr && n <= 4) {\n      for (let i = 0; i < 6; i++) {\n        grid.style.setProperty('--c' + (i+1), (fr[i] || 1) + 'fr');\n      }\n    } else {\n      for (let i = 0; i < 6; i++) grid.style.removeProperty('--c' + (i+1));\n      // Clear any inline grid-template-columns override from a previous 5/6 resize\n      grid.style.gridTemplateColumns = '';\n    }\n  }\n\n  // Drag-grip icon (matches /Sign-In/components/IconDragHorizontal from figma)\n  const GRIP_SVG = `<svg viewBox=\"0 0 8 14\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M 7 2.1 C 6.802 2.1 6.609 2.038 6.444 1.923 C 6.28 1.808 6.152 1.644 6.076 1.452 C 6 1.26 5.981 1.049 6.019 0.845 C 6.058 0.641 6.153 0.454 6.293 0.308 C 6.433 0.161 6.611 0.061 6.805 0.02 C 6.999 -0.02 7.2 0 7.383 0.08 C 7.565 0.159 7.722 0.294 7.831 0.467 C 7.941 0.639 8 0.842 8 1.05 C 8 1.328 7.895 1.596 7.707 1.792 C 7.52 1.989 7.265 2.1 7 2.1 Z M 8 7 C 8 6.792 7.941 6.589 7.831 6.417 C 7.722 6.244 7.565 6.109 7.383 6.03 C 7.2 5.95 6.999 5.93 6.805 5.9  = gs.gridTemplateColumns.split(' ').map(parseFloat).filter(v => !isNaN(v));\n    const rowPx = gs.gridTemplateRows.split(' ').map(parseFloat).filter(v => !isNaN(v));\n    const gap = parseFloat(gs.columnGap) || parseFloat(gs.gap) || 0;\n    const rowGap = parseFloat(gs.rowGap) || parseFloat(gs.gap) || 0;\n    const padL = parseFloat(gs.paddingLeft) || 0;\n    const padT = parseFloat(gs.paddingTop) || 0;\n\n    // Compute column boundary x positions (relative to grid) — one per gap\n    const colBoundaries = [];\n    let x = padL;\n    for (let i = 0; i < colPx.length - 1; i++) {\n      x += colPx[i];\n      colBoundaries.push(x + gap / 2); // center of gap\n      x += gap;\n    }\n\n    // Compute row band y ranges\n    const rowBands = [];\n    let y = padT;\n    for (let i = 0; i < rowPx.length; i++) {\n      rowBands.push({ top: y, bottom: y + rowPx[i] });\n      y += rowPx[i] + rowGap;\n    }\n\n    // For each slot, figure out its grid-column span so we know which column boundaries are INSIDE its span (skip)\n    // vs at its edges (candidate for resize)\n    const slots = [...grid.querySelectorAll('.slot')];\n    const slotsByRow = new Map(); // rowIndex -> [{slot, colStart, colEnd}]\n    slots.forEach(slot => {\n      const cs = getComputedStyle(slot);\n      // gridRowStart / gridColumnStart give resolved line numbers (1-based) or 'auto'\n      let colStart = parseInt(cs.gridColumnStart, 10);\n      let colEnd   = parseInt(cs.gridColumnEnd, 10);\n      let rowStart = parseInt(cs.gridRowStart, 10);\n      let rowEnd   = parseInt(cs.gridRowEnd, 10);\n      // Fallback: for simple layouts CSS may leave these as 'auto'; infer from position in source order\n      if (isNaN(colStart)) {\n        const pos = parseInt(slot.dataset.pos, 10) || 0;\n        colStart = (pos % colPx.length) + 1;\n        colEnd = colStart + 1;\n        rowStart = Math.floor(pos / colPx.length) + 1;\n        rowEnd = rowStart + 1;\n      }\n      for (let r = rowStart; r < rowEnd; r++) { 11.9 15.68 11.826 15.805 11.695 C 15.93 11.564 16 11.386 16 11.2 C 16 11.014 15.93 10.836 15.805 10.705 C 15.68 10.574 15.51 10.5 15.333 10.5 Z M 4.667 8.4 C 4.49 8.4 4.32 8.474 4.195 8.605 C 4.07 8.736 4 8.914 4 9.1 L 4 10.5 L 0.667 10.5 C 0.49 10.5 0.32 10.574 0.195 10.705 C 0.07 10.836 0 11.014 0 11.2 C 0 11.386 0.07 11.564 0.195 11.695 C 0.32 11.826 0.49 11.9 0.667 11.9 L 4 11.9 L 4 13.3 C 4 13.486 4.07 13.664 4.195 13.795 C 4.32 13.926 4.49 14 4.667 14 C 4.843 14 5.013 13.926 5.138 13.795 C 5.263 13.664 5.333 13.486 5.333 13.3 L 5.333 9.1 C 5.333 8.914 5.263 8.736 5.138 8.605 C 5.013 8.474 4.843 8.4 4.667 8.4 Z\" fill-rule=\"nonzero\"/><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    `;\n\n    // meter block — 2450 SMU readouts\n    // primary = measured quantity (what we 'sense')\n    // secondary = source setpoint OR derived quantity (e.g. Ω calculated)\n    const chInputs = (mode) => {\n      // mode: 'full' | 'grid' | 'grid2'\n      if (mode === 'full') {\n        return `\n          <div class=\"inputs\" style=\"margin-top:6px\">\n            <div class=\"tek-input\" data-kp=\"source\"><span class=\"input-label\">Source ${ch.source}<\u002Fspan><span class=\"input-value\">${ch.srcValue} ${ch.srcUnit}<\u002Fspan><span class=\"caret\">▾<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"srcRange\"><span class=\"input-label\">Range<\u002Fspan><span class=\"input-value\">${ch.srcRange}<\u002Fspan><span class=\"caret\">▾<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"ilimit\"><span class=\"input-label\">${ch.source==='V'?'I Limit':'V Limit'}<\u002Fspan><span class=\"input-value\">${ch.ilimit}<\u002Fspan><span class=\"caret\">▾<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"sense\"><span class=\"input-label\">Sense<\u002Fspan><span class=\"input-value\">${ch.sense}<\u002Fspan><span class=\"caret\">▾<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"nplc\"><span class=\"input-label\">NPLC<\u002Fspan><span class=\"input-value\">${ch.nplc}<\u002Fspan><span class=\"caret\">▾<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        `;\n      }\n      if (mode === 'grid') {\n        return `\n          <div class=\"inputs-grid\" style=\"margin-top:4px\">\n            <div class=\"tek-input\" data-kp=\"source\"><span class=\"input-label\">Src<\u002Fspan><span class=\"input-value\">${ch.srcValue} ${ch.srcUnit}<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"srcRange\"><span class=\"input-label\">Rng<\u002Fspan><span class=\"input-value\">${ch.srcRange}<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"ilimit\"><span class=\"input-label\">${ch.source==='V'?'Ilim':'Vlim'}<\u002Fspan><span class=\"input-value\">${ch.ilimit}<\u002Fspan><\u002Fdiv>\n            <div class=\"tek-input\" data-kp=\"sense\"><span class=\"input-label\">Sns<\u002Fspan><span class=\"input-value\">${ch.sense === '4-Wire' ? '4-W' : '2-W'}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        `;\n      }\n      return `\n        <div class=\"inputs-grid\" style=\"margin-top:4px\">\n          <div class=\"tek-input\" data-kp=\"source\"><span class=\"input-label\">Src<\u002Fspan><span class=\"input-value\">${ch.srcValue}<\u002Fspan><\u002Fdiv>\n          <div class=\"tek-input\" data-kp=\"ilimit\"><span class=\"input-label\">Lim<\u002Fspan><span class=\"input-value\">${ch.ilimit}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      `;\n    };\n\n    const meterHtml = `\n      <div class=\"meter\">\n        ${shape === 'large' ? `<div class=\"tabs-badge meter-badge\"><span class=\"tabs-badge-dot\"><\u002Fspan><span>${ch.label}<\u002Fspan><span class=\"tabs-badge-suffix\">SMU<\u002Fspan><\u002Fdiv>` : ''}\n        <div class=\"readout-row\">\n          <span class=\"readout-primary\" id=\"p-${ch.id}\">${ch.primary}<\u002Fspan>\n          <span class=\"readout-unit\">${ch.pUnit}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"readout-row\">\n          <span class=\"readout-secondary\" id=\"s-${ch.id}\">${ch.secondary}<\u002Fspan>\n          <span class=\"readout-unit\">${ch.sUnit}<\u002Fspan>\n        <\u002Fdiv>\n        ${shape === 'large'\n          ? `\n            <div class=\"meter-row\"><span class=\"label\">Pk-Pk<\u002Fspan><span id=\"pp-${ch.id}\">—<\u002Fspan><\u002Fdiv>\n            <div class=\"meter-row\"><span class=\"label\">Mean<\u002Fspan><span id=\"mean-${ch.id}\">—<\u002Fspan><\u002Fdiv>\n            <div class=\"meter-row\"><span class=\"label\">Term<\u002Fspan><span>${ch.term}<\u002Fspan><\u002Fdiv>\n            ${chInputs('full')}\n          `\n          : shape === 'wide-split' || shape === 'medium'\n          ? chInputs('grid')\n          : chInputs('grid2')\n        }\n      <\u002Fdiv>\n    `;\n\n    const chartBody = hasChart ? buildChartBody(ch, tab) : '';\n\n    el.innerHTML = `<div class=\"slot-inner\">${tabsHtml}${meterHtml}${chartBody}<\u002Fdiv>`;\n\n    // tab clicks — surgical update so tabs feel instant and don't run layout FLIP.\n    el.querySelectorAll('.tab').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        e.stopPropagation();\n        const newTab = btn.dataset.tab;\n        if (state.tabBy[ch.id] === newTab) return;\n        state.tabBy[ch.id] = newTab;\n        updateSlotTab(el, ch, newTab);\n      });\n    });\n    // Graph settings button\n    el.querySelectorAll('[data-action=\"graph-settings\"]').forEach(btn => {\n      btn.addEventListener('click', (e) => {\n        e.stopPropagation();\n        openGraphSettings(ch);\n      });\n    });\n    // Channel setting tek-inputs → keypad / picker modals\n    el.querySelectorAll('.tek-input').forEach(i => {\n      i.addEventListener('click', e => {\n        e.stopPropagation();\n        const kind = i.dataset.kp;\n        if (!kind) return;\n        openChannelSetting(ch, kind);\n      });\n    });\n    el.addEventListener('click', () => {\n      state.focused = ch.id;\n      el.parentNode.querySelectorAll('.slot').forEach(s => s.classList.remove('focused'));\n      el.classList.add('focused');\n    });\n\n    return el;\n  }\n\n  function buildChartBody(ch, tab) {\n    if (tab === 'data') {\n      const rows = [];\n      for (let i = 0; i < 8; i++) {\n        const t = (i * 200).toFixed(0);\n        const v = (Math.sin(i*0.7 + ch.phase) * ch.amp).toFixed(4);\n        const pct = 40 + Math.sin(i*0.7 + ch.phase) * 35;\n        rows.push(`<div class=\"dv-row\"><span>t+${t} ms<\u002Fspan><div class=\"dv-bar\"><i style=\"width:${Math.max(5,pct)}%\"><\u002Fi><\u002Fdiv><span>${v} ${ch.pUnit}<\u002Fspan><\u002Fdiv>`);\n      }\n      return `<div class=\"tab-body dataview\" data-tab-body=\"data\">\n        <div class=\"dv-row dv-head\"><span>Rel<\u002Fspan><span>Reading<\u002Fspan><span>Value<\u002Fspan><\u002Fdiv>\n        ${rows.join('')}\n      <\u002Fdiv>`;\n    }\n    // chart (default) view\n    const liveBadge = '';\n    // Overlay: show source/measure summary in manual-style terse syntax\n    // e.g. \"Source 20.0 V · Measure I · 2-Wire · NPLC 1.0\"\n    const srcTxt = `Src ${ch.srcValue}${ch.srcUnit}`;\n    const measTxt = `Meas ${ch.measure}`;\n    const senseTxt = ch.sense === '4-Wire' ? '4-W' : '2-W';\n    return `\n      <div class=\"tab-body chart\" data-tab-body=\"${tab}\">\n        <svg viewBox=\"0 0 400 200\" preserveAspectRatio=\"none\">\n          <g class=\"gridg\" id=\"gridg-${ch.id}\"><\u002Fg>\n          <line class=\"axis\" x1=\"0\" y1=\"100\" x2=\"400\" y2=\"100\"/>\n          <line class=\"axis\" x1=\"200\" y1=\"0\" x2=\"200\" y2=\"200\"/>\n          <line class=\"cursor-v\" x1=\"80\" y1=\"0\" x2=\"80\" y2=\"200\"/>\n          <line class=\"cursor-v\" x1=\"320\" y1=\"0\" x2=\"320\" y2=\"200\"/>\n          <path class=\"trace-fill\" id=\"fill-${ch.id}\" d=\"\"/>\n          <path class=\"trace\" id=\"trace-${ch.id}\" d=\"\"/>\n        <\u002Fsvg>\n        <div class=\"chart-overlay\">\n          ${liveBadge}\n          <span>${srcTxt}<\u002Fspan>\n          <span>${measTxt}<\u002Fspan>\n          <span>${senseTxt}<\u002Fspan>\n          <span>NPLC ${ch.nplc}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n  }\n\n  // Surgical tab switch: replace just the chart-body area + update tab button aria-selected.\n  // Avoids a full render (no layout FLIP, no reset of other slots' charts).\n  function updateSlotTab(slotEl, ch, newTab) {\n    // Update aria-selected on tab buttons\n    slotEl.querySelectorAll('.tab').forEach(btn => {\n      btn.setAttribute('aria-selected', btn.dataset.tab === newTab ? 'true' : 'false');\n    });\n    // Swap tab body\n    const oldBody = slotEl.querySelector('[data-tab-body]');\n    if (!oldBody) return;\n    const wrap = document.createElement('div');\n    wrap.innerHTML = buildChartBody(ch, newTab).trim();\n    const newBody = wrap.firstElementChild;\n    if (!newBody) return;\n    oldBody.replaceWith(newBody);\n  }\n\n  // ── Channel toggle ─────────────────────────────────────────\n  function toggleChannel(id) {\n    // Snapshot current slot rects + HTML before re-render (for FLIP + exit ghosts)\n    const snap = {};\n    grid.querySelectorAll('.slot').forEach(s => {\n      snap[s.dataset.ch] = {\n        rect: s.getBoundingClientRect(),\n        html: s.outerHTML\n      };\n    });\n\n    if (state.active.has(id)) {\n      state.active.delete(id);\n    } else {\n      if (state.active.size < 6) state.active.add(id);\n    }\n    if (!state.active.has(state.focused)) {\n      state.focused = [...state.active][0] || 1;\n    }\n    const twCh = document.getElementById('tw-channels');\n    if (twCh) twCh.value = String(state.active.size);\n    persistTweaks();\n    renderWithTransition(snap);\n  }\n\n  // ── Modal ──────────────────────────────────────────────────\n  const modal = document.getElementById('modal');\n  const modalChips = document.getElementById('modal-chips');\n  function renderModalChips() {\n    modalChips.innerHTML = '';\n    for (let i = 1; i <= 6; i++) {\n      const b = document.createElement('button');\n      b.className = 'chip';\n      const ch = CHANNELS[i-1];\n      b.setAttribute('aria-pressed', state.active.has(ch.id));\n      b.textContent = ch.label + ' · ' + ch.type;\n      b.addEventListener('click', () => { toggleChannel(ch.id); renderModalChips(); });\n      modalChips.appendChild(b);\n    }\n  }\n  function openModal() {\n    renderModalChips();\n    modal.style.display = 'grid';\n  }\n  document.getElementById('modal-close').addEventListener('click', () => modal.style.display = 'none');\n  document.getElementById('modal-apply').addEventListener('click', () => {\n    modal.style.display = 'none';\n    persistTweaks();\n    render();\n  });\n\n  // ── Graph settings modal ────────────────────────────────────\n  // Per-channel display/trace settings (not measurement).\n  // Defaults matching 2450 Graph screen: Y scale linear, autoscale on, trace line.\n  state.graphBy = state.graphBy || {};\n  for (const c of CHANNELS) {\n    state.graphBy[c.id] = state.graphBy[c.id] || {\n      yScale: 'lin',      // lin | log\n      yAuto: true,\n      yMin: '-1.0',\n      yMax: '+1.0',\n      xMethod: 'all',     // all | window\n      trace: 'line',      // line | dot | both\n      gridOn: true,\n      cursors: false\n    };\n  }\n  const gsModal = document.getElementById('gs-modal');\n  const gsBody  = document.getElementById('gs-body');\n  const gsTitle = document.getElementById('gs-title');\n  const gsSub   = document.getElementById('gs-subtitle');\n  function openGraphSettings(ch) {\n    const g = state.graphBy[ch.id];\n    gsTitle.textContent = 'Graph Settings — ' + ch.label;\n    gsSub.textContent = 'DISPLAY ONLY · DOES NOT AFFECT MEASUREMENT';\n    gsBody.innerHTML = `\n      <div class=\"gs-section\">\n        <h3>Y Axis<\u002Fh3>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Scale<\u002Fspan><span class=\"gs-desc\">Linear or log₁₀<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\">\n            <div class=\"seg\" data-gs-key=\"yScale\">\n              <button data-v=\"lin\" aria-pressed=\"${g.yScale==='lin'}\">Linear<\u002Fbutton>\n              <button data-v=\"log\" aria-pressed=\"${g.yScale==='log'}\">Log<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Autoscale<\u002Fspan><span class=\"gs-desc\">Fit visible data<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\"><button class=\"tg\" data-gs-toggle=\"yAuto\" aria-pressed=\"${g.yAuto}\"><\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Y Min<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\"><div class=\"stepper\"><input type=\"text\" data-gs-input=\"yMin\" value=\"${g.yMin}\" ${g.yAuto?'disabled':''}/><span class=\"sp-unit\">${ch.pUnit}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Y Max<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\"><div class=\"stepper\"><input type=\"text\" data-gs-input=\"yMax\" value=\"${g.yMax}\" ${g.yAuto?'disabled':''}/><span class=\"sp-unit\">${ch.pUnit}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gs-section\">\n        <h3>X Axis<\u002Fh3>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">X method<\u002Fspan><span class=\"gs-desc\">Show all readings or window<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\">\n            <div class=\"seg\" data-gs-key=\"xMethod\">\n              <button data-v=\"all\" aria-pressed=\"${g.xMethod==='all'}\">All<\u002Fbutton>\n              <button data-v=\"window\" aria-pressed=\"${g.xMethod==='window'}\">Window<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"gs-section\">\n        <h3>Trace<\u002Fh3>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Style<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\">\n            <div class=\"seg\" data-gs-key=\"trace\">\n              <button data-v=\"line\" aria-pressed=\"${g.trace==='line'}\">Line<\u002Fbutton>\n              <button data-v=\"dot\" aria-pressed=\"${g.trace==='dot'}\">Dot<\u002Fbutton>\n              <button data-v=\"both\" aria-pressed=\"${g.trace==='both'}\">Both<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Gridlines<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\"><button class=\"tg\" data-gs-toggle=\"gridOn\" aria-pressed=\"${g.gridOn}\"><\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"gs-row\">\n          <div class=\"gs-label-col\"><span class=\"gs-label\">Cursors<\u002Fspan><span class=\"gs-desc\">Measure between points<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-control\"><button class=\"tg\" data-gs-toggle=\"cursors\" aria-pressed=\"${g.cursors}\"><\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n    // Wire up controls\n    gsBody.querySelectorAll('[data-gs-key]').forEach(seg => {\n      const key = seg.dataset.gsKey;\n      seg.querySelectorAll('button').forEach(b => {\n        b.addEventListener('click', () => {\n          g[key] = b.dataset.v;\n          seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));\n        });\n      });\n    });\n    gsBody.querySelectorAll('[data-gs-toggle]').forEach(t => {\n      const key = t.dataset.gsToggle;\n      t.addEventListener('click', () => {\n        g[key] = !g[key];\n        t.setAttribute('aria-pressed', g[key]);\n        if (key === 'yAuto') {\n          gsBody.querySelectorAll('[data-gs-input]').forEach(inp => { inp.disabled = g.yAuto; });\n        }\n      });\n    });\n    gsBody.querySelectorAll('[data-gs-input]').forEach(inp => {\n      inp.addEventListener('change', () => { g[inp.dataset.gsInput] = inp.value; });\n    });\n    gsModal.style.display = 'grid';\n  }\n  gsModal.querySelectorAll('[data-gs-close]').forEach(el => el.addEventListener('click', () => gsModal.style.display = 'none'));\n\n  // ── Channel setting entry point ────────────────────────────\n  function openChannelSetting(ch, kind) {\n    if (kind === 'source')   return openKeypad(ch, kind);\n    if (kind === 'ilimit')   return openKeypad(ch, kind);\n    if (kind === 'nplc')     return openKeypad(ch, kind);\n    if (kind === 'srcRange') return openPicker(ch, kind);\n    if (kind === 'sense')    return openPicker(ch, kind);\n  }\n\n  // ── Picker modal (discrete choices) ────────────────────────\n  const pkModal = document.getElementById('pk-modal');\n  const pkTitle = document.getElementById('pk-title');\n  const pkSub   = document.getElementById('pk-subtitle');\n  const pkBody  = document.getElementById('pk-body');\n  function openPicker(ch, kind) {\n    let title, options, current, apply;\n    if (kind === 'srcRange') {\n      title = 'Source Range';\n      pkSub.textContent = ch.label + ' · SOURCE ' + ch.source;\n      const vRanges = ['20 mV','200 mV','2 V','20 V','200 V'];\n      const iRanges = ['10 nA','100 nA','1 µA','10 µA','100 µA','1 mA','10 mA','100 mA','1 A'];\n      options = ch.source === 'V' ? ['Auto', ...vRanges] : ['Auto', ...iRanges];\n      current = ch.srcRange;\n      apply = (v) => { ch.srcRange = v; render(); };\n    } else if (kind === 'sense') {\n      title = 'Sense Mode';\n      pkSub.textContent = ch.label + ' · 4-WIRE REMOVES LEAD RESISTANCE';\n      options = ['2-Wire', '4-Wire'];\n      current = ch.sense;\n      apply = (v) => { ch.sense = v; render(); };\n    }\n    pkTitle.textContent = title;\n    pkBody.innerHTML = options.map(o => `\n      <div class=\"gs-row\" data-pk-opt=\"${o}\" style=\"cursor:pointer\">\n        <span class=\"gs-label\">${o}<\u002Fspan>\n        <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:${o===current?'var(--tek-blue)':'var(--fg-4)'}\">${o===current?'✓ SELECTED':''}<\u002Fspan>\n      <\u002Fdiv>\n    `).join('');\n    pkBody.querySelectorAll('[data-pk-opt]').forEach(r => {\n      r.addEventListener('click', () => {\n        apply(r.dataset.pkOpt);\n        pkModal.style.display = 'none';\n      });\n    });\n    pkModal.style.display = 'grid';\n  }\n  pkModal.querySelectorAll('[data-pk-close]').forEach(el => el.addEventListener('click', () => pkModal.style.display = 'none'));\n\n  // ── Keypad modal ───────────────────────────────────────────\n  const kpModal = document.getElementById('kp-modal');\n  const kpTitle = document.getElementById('kp-title');\n  const kpSub   = document.getElementById('kp-subtitle');\n  const kpValue = document.getElementById('kp-value');\n  const kpUnitEl= document.getElementById('kp-unit');\n  const kpRangeEl=document.getElementById('kp-range-val');\n  const kpUnits = document.getElementById('kp-units');\n  const kpHint  = document.getElementById('kp-hint');\n  let kpState = null;\n  function openKeypad(ch, kind) {\n    if (kind === 'source') {\n      const isV = ch.source === 'V';\n      kpState = {\n        ch, kind,\n        title: 'Source ' + (isV?'Voltage':'Current'),\n        sub: ch.label + ' · SOURCE ' + ch.source,\n        value: ch.srcValue,\n        unitOptions: isV ? [{u:'mV',s:1e-3},{u:'V',s:1},{u:'kV',s:1e3}] : [{u:'nA',s:1e-9},{u:'µA',s:1e-6},{u:'mA',s:1e-3},{u:'A',s:1}],\n        unit: ch.srcUnit,\n        rangeText: isV ? 'Max ±210 V' : 'Max ±1.05 A',\n        apply: (v, u) => { ch.srcValue = v; ch.srcUnit = u; render(); }\n      };\n    } else if (kind === 'ilimit') {\n      const isI = ch.source === 'V';\n      kpState = {\n        ch, kind,\n        title: (isI?'Current':'Voltage') + ' Limit',\n        sub: ch.label + ' · COMPLIANCE · PROTECTS DUT',\n        value: ch.ilimit.replace(/[^\\d.\\-+]/g,''),\n        unitOptions: isI ? [{u:'nA',s:1e-9},{u:'µA',s:1e-6},{u:'mA',s:1e-3},{u:'A',s:1}] : [{u:'mV',s:1e-3},{u:'V',s:1}],\n        unit: ch.ilimit.replace(/[\\d.\\-+\\s]/g,'').trim() || (isI?'mA':'V'),\n        rangeText: isI ? 'Max 1.05 A' : 'Max 210 V',\n        apply: (v, u) => { ch.ilimit = v + ' ' + u; render(); }\n      };\n    } else if (kind === 'nplc') {\n      kpState = {\n        ch, kind,\n        title: 'Integration (NPLC)',\n        sub: ch.label + ' · POWER-LINE CYCLES · 0.01 – 10',\n        value: String(ch.nplc),\n        unitOptions: [{u:'PLC',s:1}],\n        unit: 'PLC',\n        rangeText: '0.01 = fast, 10 = low-noise',\n        apply: (v, u) => { ch.nplc = v; render(); }\n      };\n    }\n    renderKeypad();\n    kpModal.style.display = 'grid';\n  }\n  function renderKeypad() {\n    if (!kpState) return;\n    kpTitle.textContent = kpState.title;\n    kpSub.textContent = kpState.sub;\n    kpValue.textContent = kpState.value || '0';\n    kpUnitEl.textContent = kpState.unit;\n    kpRangeEl.textContent = kpState.rangeText;\n    kpUnits.innerHTML = kpState.unitOptions.map(o => `\n      <button class=\"kp-unit-btn\" data-kp-u=\"${o.u}\" aria-pressed=\"${o.u===kpState.unit}\">${o.u}<\u002Fbutton>\n    `).join('');\n    kpUnits.querySelectorAll('[data-kp-u]').forEach(b => {\n      b.addEventListener('click', () => {\n        kpState.unit = b.dataset.kpU;\n        renderKeypad();\n      });\n    });\n    validateKp();\n  }\n  function validateKp() {\n    const n = parseFloat(kpState.value);\n    kpValue.classList.remove('invalid');\n    kpHint.classList.remove('warn');\n    kpHint.innerHTML = '&nbsp;';\n    if (kpState.value === '' || kpState.value === '-' || kpState.value === '+') return;\n    if (isNaN(n)) { kpValue.classList.add('invalid'); kpHint.classList.add('warn'); kpHint.textContent = 'Invalid number'; return; }\n    // Over-range check (rough, per source function)\n    const ch = kpState.ch;\n    if (kpState.kind === 'source' && ch.source === 'V') {\n      const scale = kpState.unit === 'mV' ? 1e-3 : kpState.unit === 'kV' ? 1e3 : 1;\n      if (Math.abs(n*scale) > 210) { kpValue.classList.add('invalid'); kpHint.classList.add('warn'); kpHint.textContent = '▲ Over range — max ±210 V'; }\n    }\n    if (kpState.kind === 'nplc') {\n      if (n < 0.01 || n > 10) { kpValue.classList.add('invalid'); kpHint.classList.add('warn'); kpHint.textContent = '▲ NPLC must be 0.01–10'; }\n    }\n  }\n  function kpKey(k) {\n    if (!kpState) return;\n    let v = kpState.value;\n    if (k === 'clear') v = '';\n    else if (k === 'back') v = v.slice(0, -1);\n    else if (k === 'neg') v = v.startsWith('-') ? v.slice(1) : ('-' + v.replace(/^\\+/,''));\n    else if (k === '.') { if (!v.includes('.')) v += (v ? '' : '0') + '.'; }\n    else if (k === 'exp') { if (!v.toLowerCase().includes('e') && v) v += 'e'; }\n    else if (k === 'enter') { kpApply(); return; }\n    else v += k;\n    kpState.value = v;\n    kpValue.textContent = v || '0';\n    validateKp();\n  }\n  function kpApply() {\n    if (!kpState) return;\n    if (kpValue.classList.contains('invalid')) return;\n    const v = kpState.value || '0';\n    kpState.apply(v, kpState.unit);\n    kpModal.style.display = 'none';\n    kpState = null;\n  }\n  document.querySelectorAll('[data-kp-k]').forEach(b => {\n    b.addEventListener('click', () => kpKey(b.dataset.kpK));\n  });\n  document.querySelectorAll('[data-kp-close]').forEach(el => el.addEventListener('click', () => { kpModal.style.display = 'none'; kpState = null; }));\n  document.getElementById('kp-apply').addEventListener('click', kpApply);\n  // Close modals on backdrop click\n  [gsModal, pkModal, kpModal].forEach(m => {\n    m.addEventListener('click', (e) => { if (e.target === m) m.style.display = 'none'; });\n  });\n  // Esc closes any open modal\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'Escape') {\n      if (gsModal.style.display !== 'none') gsModal.style.display = 'none';\n      if (pkModal.style.display !== 'none') pkModal.style.display = 'none';\n      if (kpModal.style.display !== 'none') { kpModal.style.display = 'none'; kpState = null; }\n    }\n  });\n\n  // ── Animation loop ─────────────────────────────────────────\n  function waveValue(ch, t, x) {\n    const base = state.wave;\n    const f = ch.freq / 50; // visible cycles\n    const phase = ch.phase + t * state.speed;\n    const u = x * f * Math.PI * 2 + phase;\n    let v;\n    if (base === 'square') v = Math.sign(Math.sin(u));\n    else if (base === 'tri') v = Math.asin(Math.sin(u)) * 2/Math.PI;\n    else if (base === 'noisy') v = Math.sin(u) * 0.7 + Math.sin(u*3.7 + ch.phase) * 0.25;\n    else v = Math.sin(u);\n    v *= ch.amp;\n    v += (Math.random() - 0.5) * state.noise * 0.2;\n    return v;\n  }\n\n  function drawTrace(ch) {\n    const trace = document.getElementById('trace-' + ch.id);\n    const fill  = document.getElementById('fill-' + ch.id);\n    if (!trace) return;\n    const W = 400, H = 200, N = 220;\n    const t = (performance.now() - state.t0) / 1000;\n    let d = '', df = '';\n    for (let i = 0; i <= N; i++) {\n      const x = i / N;\n      const xp = x * W;\n      // Chart horizontal range follows the scrubber zoom window when it's on.\n      // When off, full 4× sweep (default view). Otherwise sample only within window.\n      const xSc = state.scrubberOn\n        ? (state.scWinStart + x * state.scWinWidth) * 4\n        : x;\n      const v = waveValue(ch, t, xSc);\n      const yp = H/2 - v * (H/2 - 12);\n      d += (i === 0 ? 'M' : 'L') + xp.toFixed(1) + ' ' + yp.toFixed(1) + ' ';\n    }\n    df = d + ` L ${W} ${H} L 0 ${H} Z`;\n    trace.setAttribute('d', d);\n    fill.setAttribute('d', df);\n\n    // also compute stats + live readout drift\n    const base = parseFloat(ch.primary.replace(/[^\\d.\\-+]/g,'')) || 0;\n    const drift = Math.sin(t * 0.8 + ch.phase) * 0.002 * Math.abs(base);\n    const pEl = document.getElementById('p-' + ch.id);\n    if (pEl) {\n      const sign = base >= 0 ? '+' : '';\n      pEl.textContent = sign + (base + drift).toFixed(3);\n    }\n    const pp = document.getElementById('pp-' + ch.id);\n    if (pp) pp.textContent = (ch.amp * 2).toFixed(3) + ' V';\n    const mean = document.getElementById('mean-' + ch.id);\n    if (mean) mean.textContent = (drift).toFixed(4) + ' V';\n  }\n\n  function drawGrid(ch) {\n    const g = document.getElementById('gridg-' + ch.id);\n    if (!g || g.dataset.density == String(state.grid)) return;\n    g.innerHTML = '';\n    g.dataset.density = state.grid;\n    const n = state.grid;\n    if (n === 0) return;\n    for (let i = 1; i < n; i++) {\n      const x = (400 / n) * i;\n      const y = (200 / n) * i;\n      g.insertAdjacentHTML('beforeend', `<line class=\"grid-line\" x1=\"${x}\" y1=\"0\" x2=\"${x}\" y2=\"200\"/>`);\n      g.insertAdjacentHTML('beforeend', `<line class=\"grid-line\" x1=\"0\" y1=\"${y}\" x2=\"400\" y2=\"${y}\"/>`);\n    }\n  }\n\n  // ── Scrubber ───────────────────────────────────────────────\n  // Overview pane above the channel grid; shows every active channel's trace\n  // on a shared time axis, with a draggable zoom-window overlay and playhead.\n  state.scrubberOn = state.scrubberOn || false;\n  state.scWinStart = state.scWinStart != null ? state.scWinStart : 0.20;\n  state.scWinWidth = state.scWinWidth != null ? state.scWinWidth : 0.25;\n  state.scFullSeconds = 10;\n  const SC_CH_COLORS = { 1:'#fff53b', 2:'#20cfd3', 3:'#ea2d56', 4:'#7ac323', 5:'#fb8b28', 6:'#8a38f5' };\n\n  const scEls = {\n    get workspace(){ return document.getElementById('workspace'); },\n    get viz()     { return document.getElementById('sc-viz'); },\n    get svg()     { return document.getElementById('sc-svg'); },\n    get tracesG() { return document.getElementById('sc-tracesg'); },\n    get gridG()   { return document.getElementById('sc-gridg'); },\n    get win()     { return document.getElementById('sc-window'); },\n    get play()    { return document.getElementById('sc-playhead'); },\n    get ticks()   { return document.getElementById('sc-ticks'); },\n    get chips()   { return document.getElementById('sc-chips'); },\n    get winRange(){ return document.getElementById('sc-winrange'); },\n    get fullRange(){return document.getElementById('sc-fullrange'); },\n    get railBtn() { return document.getElementById('rail-scrubber'); }\n  };\n\n  function clampScrub(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }\n\n  function toggleScrubber(on) {\n    state.scrubberOn = on == null ? !state.scrubberOn : !!on;\n    scEls.workspace.classList.toggle('has-scrubber', state.scrubberOn);\n    scEls.railBtn.setAttribute('aria-pressed', state.scrubberOn);\n    persistTweaks();\n    if (state.scrubberOn) {\n      renderScrubberChrome();\n      drawScrubberGrid();\n      drawScrubber();\n    }\n  }\n\n  function renderScrubberChrome() {\n    // Scrubber chips reflect the scrubber's OWN active set (state.scActive),\n    // independent from state.active (the main canvas). Click a chip to toggle.\n    scEls.chips.innerHTML = CHANNELS.map(ch => {\n      const c = SC_CH_COLORS[ch.id];\n      const on = state.scActive.has(ch.id);\n      const dim = on ? '' : 'opacity:0.35';\n      return `<button type=\"button\" class=\"ch-pill sc-chip\" data-ch=\"${ch.id}\" aria-pressed=\"${on}\" style=\"${dim}\"><span class=\"sw\" style=\"background:${c};box-shadow:0 0 4px ${c}\"><\u002Fspan>${ch.label}<\u002Fbutton>`;\n    }).join(' ');\n    // Wire chip toggles (scrubber-only)\n    scEls.chips.querySelectorAll('.sc-chip').forEach(btn => {\n      btn.addEventListener('click', () => {\n        const id = parseInt(btn.dataset.ch, 10);\n        if (state.scActive.has(id)) state.scActive.delete(id);\n        else state.scActive.add(id);\n        renderScrubberChrome();\n        drawScrubber();\n      });\n    });\n    const full = state.scFullSeconds;\n    const parts = [];\n    for (let i = 0; i <= 5; i++) {\n      const t = (full * i / 5).toFixed(1);\n      parts.push(`<span>${t}s<\u002Fspan>`);\n    }\n    scEls.ticks.innerHTML = parts.join('');\n    updateScrubberRangeText();\n    positionWindow();\n  }\n\n  function updateScrubberRangeText() {\n    const full = state.scFullSeconds;\n    const w0 = state.scWinStart * full;\n    const w1 = (state.scWinStart + state.scWinWidth) * full;\n    scEls.winRange.textContent = `${w0.toFixed(1)} – ${w1.toFixed(1)} s`;\n    scEls.fullRange.textContent = `${full.toFixed(1)} s`;\n  }\n\n  function positionWindow() {\n    const viz = scEls.viz;\n    if (!viz) return;\n    const w = viz.clientWidth;\n    const start = state.scWinStart * w;\n    const width = state.scWinWidth * w;\n    scEls.win.style.left  = start + 'px';\n    scEls.win.style.width = width + 'px';\n    scEls.play.style.left = (start + width) + 'px';\n    // Dim overlays outside the zoom window\n    const dimL = document.getElementById('sc-dim-left');\n    const dimR = document.getElementById('sc-dim-right');\n    if (dimL) dimL.style.width = start + 'px';\n    if (dimR) dimR.style.width = Math.max(0, w - start - width) + 'px';\n  }\n\n  function drawScrubber() {\n    const g = scEls.tracesG;\n    if (!g) return;\n    // Draw only scrubber-active channels (independent from state.active).\n    const W = 1000, H = 100, N = 400;\n    const t = (performance.now() - state.t0) / 1000;\n    let html = '';\n    for (const ch of CHANNELS) {\n      if (!state.scActive.has(ch.id)) continue;\n      const c = SC_CH_COLORS[ch.id];\n      let d = '';\n      for (let i = 0; i <= N; i++) {\n        const x = i / N;\n        const v = waveValue(ch, t, x * 4);\n        const xp = x * W;\n        const yp = H/2 - v * (H/2 - 6);\n        d += (i === 0 ? 'M' : 'L') + xp.toFixed(1) + ' ' + yp.toFixed(1) + ' ';\n      }\n      html += `<path class=\"sc-trace\" stroke=\"${c}\" stroke-opacity=\"0.9\" d=\"${d}\"/>`;\n    }\n    g.innerHTML = html;\n  }\n\n  function drawScrubberGrid() {\n    const g = scEls.gridG;\n    if (!g) return;\n    g.innerHTML = '';\n    for (let i = 1; i < 10; i++) {\n      const x = 100 * i;\n      g.insertAdjacentHTML('beforeend',\n        `<line class=\"sc-grid\" x1=\"${x}\" y1=\"0\" x2=\"${x}\" y2=\"100\"/>`);\n    }\n    g.insertAdjacentHTML('beforeend',\n      `<line class=\"sc-grid\" x1=\"0\" y1=\"33\" x2=\"1000\" y2=\"33\"/>`);\n    g.insertAdjacentHTML('beforeend',\n      `<line class=\"sc-grid\" x1=\"0\" y1=\"66\" x2=\"1000\" y2=\"66\"/>`);\n  }\n\n  function initScrubberDrag() {\n    const win = scEls.win;\n    const viz = scEls.viz;\n    let mode = null;\n    let startX = 0, startW0 = 0, startW1 = 0;\n    function onDown(e) {\n      const rect = win.getBoundingClientRect();\n      const x = e.clientX;\n      startX = x;\n      startW0 = state.scWinStart;\n      startW1 = state.scWinStart + state.scWinWidth;\n      if (x - rect.left < 8) mode = 'left';\n      else if (rect.right - x < 8) mode = 'right';\n      else mode = 'move';\n      e.preventDefault();\n      e.stopPropagation();\n      document.addEventListener('pointermove', onMove);\n      document.addEventListener('pointerup', onUp, { once: true });\n    }\n    function onMove(e) {\n      const vr = viz.getBoundingClientRect();\n      const dx = (e.clientX - startX) / vr.width;\n      let s = startW0, w = state.scWinWidth;\n      if (mode === 'move') {\n        s = clampScrub(startW0 + dx, 0, 1 - w);\n      } else if (mode === 'left') {\n        const newS = clampScrub(startW0 + dx, 0, startW1 - 0.03);\n        s = newS;\n        w = startW1 - newS;\n      } else if (mode === 'right') {\n        const newE = clampScrub(startW1 + dx, startW0 + 0.03, 1);\n        s = startW0;\n        w = newE - startW0;\n      }\n      state.scWinStart = s;\n      state.scWinWidth = w;\n      positionWindow();\n      updateScrubberRangeText();\n    }\n    function onUp() {\n      mode = null;\n      document.removeEventListener('pointermove', onMove);\n      persistTweaks();\n    }\n    win.addEventListener('pointerdown', onDown);\n    // Click in empty viz → recenter window\n    viz.addEventListener('pointerdown', (e) => {\n      if (e.target.closest('.sc-window')) return;\n      const vr = viz.getBoundingClientRect();\n      const x = (e.clientX - vr.left) / vr.width;\n      state.scWinStart = clampScrub(x - state.scWinWidth/2, 0, 1 - state.scWinWidth);\n      positionWindow();\n      updateScrubberRangeText();\n      persistTweaks();\n    });\n  }\n\n  scEls.railBtn.addEventListener('click', () => toggleScrubber());\n  scEls.railBtn.setAttribute('aria-pressed', state.scrubberOn);\n  window.addEventListener('resize', () => { if (state.scrubberOn) positionWindow(); });\n  initScrubberDrag();\n  if (state.scrubberOn) {\n    scEls.workspace.classList.add('has-scrubber');\n    renderScrubberChrome();\n    drawScrubberGrid();\n  }\n  // Re-render chips when channel set changes — wrap render()\n  {\n    const _origRender = render;\n    render = function(...args) {\n      _origRender.apply(this, args);\n      if (state.scrubberOn) renderScrubberChrome();\n    };\n  }\n\n  function tick() {\n    if (state.running) {\n      for (const ch of CHANNELS) {\n        if (!state.active.has(ch.id)) continue;\n        drawGrid(ch);\n        drawTrace(ch);\n      }\n      if (state.scrubberOn) drawScrubber();\n    }\n\n    // clock\n    const t = (performance.now() - state.t0) / 1000;\n    const h = String(Math.floor(t / 3600)).padStart(2, '0');\n    const m = String(Math.floor((t % 3600) / 60)).padStart(2, '0');\n    const s = String(Math.floor(t % 60)).padStart(2, '0');\n    const clock = document.getElementById('sb-clock');\n    if (clock) clock.textContent = `${h}:${m}:${s}`;\n    requestAnimationFrame(tick);\n  }\n  requestAnimationFrame(tick);\n\n  // ── Controls ───────────────────────────────────────────────\n  const runBtn = document.getElementById('run-btn');\n  runBtn.addEventListener('click', () => {\n    state.running = !state.running;\n    runBtn.setAttribute('aria-pressed', state.running);\n    document.getElementById('run-dot').classList.toggle('paused', !state.running);\n    document.getElementById('run-label').textContent = state.running ? 'Running' : 'Paused';\n    // Mirror state to the rail run toggle\n    const railRun = document.getElementById('rail-run');\n    if (railRun) {\n      railRun.setAttribute('aria-pressed', state.running);\n      railRun.title = state.running ? 'Running — click to pause' : 'Paused — click to run';\n    }\n  });\n  // Rail run button — forward click to the hidden run-btn\n  const railRunEl = document.getElementById('rail-run');\n  if (railRunEl) railRunEl.addEventListener('click', () => runBtn.click());\n  // Rail tweaks button — forward to tweaks toggle, mirror pressed state\n  const railTweaksEl = document.getElementById('rail-tweaks');\n  if (railTweaksEl) {\n    railTweaksEl.addEventListener('click', () => {\n      document.getElementById('tweaks-btn').click();\n      railTweaksEl.setAttribute('aria-pressed', document.getElementById('tweaks').classList.contains('open'));\n    });\n  }\n  document.getElementById('single-btn').addEventListener('click', () => {\n    state.running = false;\n    runBtn.setAttribute('aria-pressed', false);\n    document.getElementById('run-dot').classList.add('paused');\n    document.getElementById('run-label').textContent = 'Paused';\n  });\n\n  // Tweaks panel\n  const tweaks = document.getElementById('tweaks');\n  document.getElementById('tweaks-btn').addEventListener('click', () => tweaks.classList.toggle('open'));\n  document.getElementById('tweaks-close').addEventListener('click', () => tweaks.classList.remove('open'));\n\n  const twCh = document.getElementById('tw-channels');\n  twCh.value = String(state.active.size);\n  twCh.addEventListener('change', () => {\n    const n = parseInt(twCh.value, 10);\n    const snap = {};\n    grid.querySelectorAll('.slot').forEach(s => {\n      snap[s.dataset.ch] = { rect: s.getBoundingClientRect(), html: s.outerHTML };\n    });\n    state.active = new Set(Array.from({length: n}, (_,i) => i+1));\n    if (!state.active.has(state.focused)) state.focused = [...state.active][0] || 1;\n    persistTweaks();\n    renderWithTransition(snap);\n  });\n  const twSp = document.getElementById('tw-speed');\n  twSp.value = state.speed;\n  twSp.addEventListener('input', () => { state.speed = parseFloat(twSp.value); persistTweaks(); });\n  const twNo = document.getElementById('tw-noise');\n  twNo.value = state.noise;\n  twNo.addEventListener('input', () => { state.noise = parseFloat(twNo.value); persistTweaks(); });\n  const twGrid = null;\n  const twDur = document.getElementById('tw-duration');\n  twDur.value = String(state.duration);\n  twDur.addEventListener('input', () => { state.duration = parseInt(twDur.value, 10); persistTweaks(); });\n\n  const twEase = document.getElementById('tw-easing');\n  twEase.value = state.easing;\n  twEase.addEventListener('change', () => { state.easing = twEase.value; persistTweaks(); });\n\n  const twWave = document.getElementById('tw-wave');\n  twWave.value = state.wave;\n  twWave.addEventListener('change', () => { state.wave = twWave.value; persistTweaks(); });\n\n  // Viewport dropdown + scale-to-fit toggle\n  const twVp = document.getElementById('tw-viewport');\n  const twVpScale = document.getElementById('tw-viewport-scale');\n  twVp.value = state.viewportId;\n  twVpScale.checked = state.scaleToFit;\n  // Disable scale toggle when \"Fit window\" is selected (no fixed size to scale)\n  function syncVpControls() {\n    twVpScale.disabled = (state.viewportId === 'fit');\n    twVpScale.parentElement.style.opacity = twVpScale.disabled ? 0.45 : 1;\n  }\n  syncVpControls();\n  twVp.addEventListener('change', () => {\n    state.viewportId = twVp.value;\n    try { localStorage.setItem('tekbench.viewport', state.viewportId); } catch(e){}\n    syncVpControls();\n    scale();\n    // Re-flow dependent layout (resizers, inner splits)\n    requestAnimationFrame(() => {\n      applyColFractions(true);\n      injectResizers(state.active.size);\n      injectInnerResizers();\n    });\n  });\n  twVpScale.addEventListener('change', () => {\n    state.scaleToFit = twVpScale.checked;\n    try { localStorage.setItem('tekbench.viewportScale', state.scaleToFit ? '1' : '0'); } catch(e){}\n    scale();\n  });\n\n  // ── Edit mode + persistence ───────────────────────────────\n  function persistTweaks() {\n    const activeArr = [...state.active].sort((a,b)=>a-b);\n    const edits = {\n      channels: state.active.size,\n      active: activeArr,\n      speed: state.speed,\n      noise: state.noise,\n      grid: state.grid,\n      wave: state.wave,\n      transition: state.transition,\n      duration: state.duration,\n      easing: state.easing,\n      scrubberOn: state.scrubberOn\n    };\n    try {\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');\n    } catch(e){}\n    try { localStorage.setItem('tekbench', JSON.stringify(edits)); } catch(e){}\n  }\n  // Rehydrate from localStorage (in case the host is unchanged)\n  try {\n    const saved = JSON.parse(localStorage.getItem('tekbench') || 'null');\n    if (saved) {\n      if (Array.isArray(saved.active) && saved.active.length) {\n        state.active = new Set(saved.active);\n      } else if (saved.channels) {\n        state.active = new Set(Array.from({length: saved.channels}, (_,i) => i+1));\n      }\n      if (!state.active.has(state.focused)) state.focused = [...state.active][0] || 1;\n      state.speed = saved.speed ?? state.speed;\n      state.noise = saved.noise ?? state.noise;\n      state.grid = saved.grid ?? state.grid;\n      state.wave = saved.wave ?? state.wave;\n      state.transition = saved.transition ?? state.transition;\n      state.duration = saved.duration ?? state.duration;\n      state.easing = saved.easing ?? state.easing;\n      if (saved.scrubberOn) {\n        state.scrubberOn = true;\n        scEls.workspace.classList.add('has-scrubber');\n        scEls.railBtn.setAttribute('aria-pressed', true);\n        renderScrubberChrome();\n        drawScrubberGrid();\n      }\n      twCh.value = String(state.active.size);\n      twSp.value = state.speed;\n      twNo.value = state.noise;\n      twTr.value = state.transition;\n      twDur.value = String(state.duration);\n      twEase.value = state.easing;\n      twWave.value = state.wave;\n    }\n  } catch(e){}\n\n  // Edit mode availability\n  window.addEventListener('message', (e) => {\n    const d = e.data || {};\n    if (d.type === '__activate_edit_mode') tweaks.classList.add('open');\n    if (d.type === '__deactivate_edit_mode') tweaks.classList.remove('open');\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e){}\n\n  // Keyboard shortcuts: 1-6 to set layout\n  window.addEventListener('keydown', (e) => {\n    if (e.target.matches('input, select, textarea')) return;\n    const n = parseInt(e.key, 10);\n    if (n >= 1 && n <= 6) {\n      toggleChannel(n);\n    } else if (e.key === ' ') {\n      e.preventDefault();\n      runBtn.click();\n    }\n  });\n\n  // Initial render\n  render();\n\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
