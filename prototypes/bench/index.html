<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">

<!-- iPad standalone PWA wiring -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tek Bench">
<meta name="theme-color" content="#181818">

<link rel="apple-touch-icon" href="../../img/IconLogo.svg">
<link rel="icon" href="../../img/IconLogo.svg">
<link rel="manifest" href="./manifest.webmanifest">

<title>Tek Bench</title>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #181818; color: #e6e6e6;
    overflow: hidden;
    -webkit-user-select: none;
  }
  #frame {
    position: absolute; top: 0; left: 0;
    width: 1440px; height: 900px;
    border: 0; background: #181818;
    transform-origin: 0 0;
    will-change: transform;
  }
</style>
</head>
<body>

<iframe id="frame" src="./prototype.html" title="Tek Bench prototype"></iframe>

<script>
  // Prototype renders at this fixed canvas size; wrapper scales to fit viewport.
  const DESIGN_W = 1440;
  const DESIGN_H = 900;

  const frame = document.getElementById('frame');

  function apply() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / DESIGN_W, vh / DESIGN_H);
    const tx = (vw - DESIGN_W * scale) / 2;
    const ty = (vh - DESIGN_H * scale) / 2;
    frame.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
  }

  apply();
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', () => setTimeout(apply, 200));
</script>

</body>
</html>
