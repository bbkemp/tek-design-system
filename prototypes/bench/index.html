<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">

<!-- iPad standalone PWA wiring -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tek Bench">
<meta name="theme-color" content="#181818">

<link rel="apple-touch-icon" href="../../img/IconLogo.svg">
<link rel="icon" href="../../img/IconLogo.svg">
<link rel="manifest" href="./manifest.webmanifest">

<title>Tek Bench</title>

<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #181818; color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Geist", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
  }

  .stage { position: fixed; inset: 0; overflow: hidden; }
  .frame-wrap {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0; will-change: transform;
  }
  iframe {
    border: 0; display: block; background: #181818;
    width: var(--vw, 100vw); height: var(--vh, 100vh);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame-wrap" id="wrap">
    <iframe id="frame" src="./prototype.html" title="Tek Bench prototype"></iframe>
  </div>
</div>

<script>
  const frame = document.getElementById('frame');
  const wrap = document.getElementById('wrap');

  function apply() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let w = vw, h = vh;
    try {
      const body = frame.contentDocument && frame.contentDocument.body;
      if (body) {
        const docEl = frame.contentDocument.documentElement;
        w = Math.max(body.scrollWidth, docEl.scrollWidth) || vw;
        h = Math.max(body.scrollHeight, docEl.scrollHeight) || vh;
      }
    } catch (_) {}

    const scale = Math.min(vw / w, vh / h, 1);
    const tx = (vw - w * scale) / 2;
    const ty = (vh - h * scale) / 2;

    wrap.style.setProperty('--vw', w + 'px');
    wrap.style.setProperty('--vh', h + 'px');
    wrap.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
  }

  frame.addEventListener('load', () => {
    apply();
    try {
      const body = frame.contentDocument && frame.contentDocument.body;
      if (body && 'ResizeObserver' in window) new ResizeObserver(apply).observe(body);
    } catch (_) {}
    // Bundler finishes asynchronously — re-apply a few times for safety.
    [250, 750, 1500, 3000].forEach(ms => setTimeout(apply, ms));
  });

  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', () => setTimeout(apply, 200));
</script>

</body>
</html>
