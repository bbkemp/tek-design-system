# publish-ui.yml
# Builds and publishes @tek/ui to GitHub Packages
# whenever component source files change.

name: Publish @tek/ui

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/src/**'
      - 'packages/ui/package.json'
      - 'packages/ui/rollup.config.js'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tek'

      - name: Install dependencies
        run: npm ci --workspace=packages/ui

      - name: Build
        run: npm run build --workspace=packages/ui

      - name: Bump patch version
        working-directory: packages/ui
        run: npm version patch --no-git-tag-version

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ui): bump version'
          file_pattern: 'packages/ui/package.json'

      - name: Publish to GitHub Packages
        working-directory: packages/ui
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
