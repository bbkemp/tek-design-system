name: Publish @bbkemp/tokens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/tokens/src/**'
      - 'packages/tokens/build.js'

concurrency:
  group: publish-tokens
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bbkemp'

      - name: Install dependencies
        run: npm install --workspace=packages/tokens

      - name: Build tokens
        run: npm run build --workspace=packages/tokens

      - name: Bump patch version
        working-directory: packages/tokens
        run: npm version patch --no-git-tag-version

      - name: Commit built files + version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(tokens): build + bump version [skip ci]'
          file_pattern: 'packages/tokens/package.json packages/tokens/dist/*'
          add_options: '-f'

      - name: Publish to GitHub Packages
        working-directory: packages/tokens
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
