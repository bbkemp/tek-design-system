name: Publish @bbkemp/ui

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/ui/src/**'
      - 'packages/ui/package.json'
      - 'packages/ui/rollup.config.js'
concurrency:
  group: publish-ui
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bbkemp'

      - name: Install dependencies
        run: npm install --workspace=packages/ui

      - name: Build
        run: npm run build --workspace=packages/ui

      - name: Bump patch version
        working-directory: packages/ui
        run: npm version patch --no-git-tag-version

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(ui): bump version'
          file_pattern: 'packages/ui/package.json'

      - name: Publish to GitHub Packages
        working-directory: packages/ui
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
