<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TekCloud — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ── Design Tokens ─────────────────────────────────────────────────────── */
:root {
  /* Primitives */
  --tek-colors-neutral-black:   #000000;
  --tek-colors-neutral-900:     #181818;
  --tek-colors-neutral-800:     #1E1E1E;
  --tek-colors-neutral-700:     #252525;
  --tek-colors-neutral-600:     #333333;
  --tek-colors-neutral-500:     #454545;
  --tek-colors-neutral-450:     #646464;
  --tek-colors-neutral-400:     #7B7B7B;
  --tek-colors-neutral-300:     #979797;
  --tek-colors-neutral-200:     #AFAFAF;
  --tek-colors-neutral-100:     #CCCCCC;
  --tek-colors-neutral-white:   #FFFFFF;
  --tek-colors-brand-tek-blue:  #33BAEA;
  --tek-colors-ui-error-red:    #E74848;
  --tek-colors-ui-success-green:#42B54C;
  --tek-colors-ui-warning-yellow:#E0B732;
  --tek-colors-ui-shadow:       rgba(0,0,0,0.2);

  /* Spacing */
  --tek-spacing-s00: 0px;
  --tek-spacing-s01: 1px;
  --tek-spacing-s02: 2px;
  --tek-spacing-s03: 4px;
  --tek-spacing-s04: 6px;
  --tek-spacing-s05: 8px;
  --tek-spacing-s06: 10px;
  --tek-spacing-s07: 12px;
  --tek-spacing-s08: 14px;
  --tek-spacing-s09: 16px;
  --tek-spacing-s10: 20px;
  --tek-spacing-s11: 24px;
  --tek-spacing-s12: 28px;
  --tek-spacing-s13: 32px;
  --tek-spacing-s14: 36px;
  --tek-spacing-s15: 40px;
  --tek-spacing-s16: 44px;
  --tek-spacing-s17: 48px;
  --tek-spacing-s18: 56px;
  --tek-spacing-s19: 64px;

  /* Border */
  --tek-borders-radius-none: 0px;
  --tek-borders-radius-02:   3px;
  --tek-borders-radius-03:   5px;
  --tek-borders-radius-05:   11px;
  --tek-borders-radius-full: 9999px;
  --tek-borders-width-01:    0.5px;
  --tek-borders-width-02:    1px;
  --tek-borders-width-04:    2px;

  /* Semantic */
  --color-selector-background-default:   var(--tek-colors-neutral-700);
  --color-selector-background-unchecked: var(--tek-colors-neutral-500);
  --color-selector-background-checked:   var(--tek-colors-neutral-100);
  --color-selector-border-unchecked:     var(--tek-colors-neutral-400);
  --color-selector-border-checked:       var(--tek-colors-neutral-300);
  --color-selector-border-error:         var(--tek-colors-ui-error-red);
  --color-selector-label-unchecked:      var(--tek-colors-neutral-100);
  --color-selector-label-checked:        var(--tek-colors-neutral-white);
  --color-input-background-default:      var(--tek-colors-neutral-700);
  --color-input-border-default:          var(--tek-colors-neutral-400);
  --color-input-border-focus:            var(--tek-colors-neutral-white);
  --color-input-border-filled:           var(--tek-colors-neutral-200);
  --color-input-border-disabled:         var(--tek-colors-neutral-500);
  --color-input-border-error:            var(--tek-colors-ui-error-red);
  --color-input-text-default:            var(--tek-colors-neutral-300);
  --color-input-text-focus:              var(--tek-colors-neutral-white);
  --color-input-text-filled:             var(--tek-colors-neutral-100);
  --color-input-label-default:           var(--tek-colors-neutral-100);
  --color-button-background-default:     var(--tek-colors-neutral-800);
  --color-button-background-hover:       var(--tek-colors-neutral-black);
  --color-button-border-default:         var(--tek-colors-brand-tek-blue);
  --color-button-text-default:           var(--tek-colors-neutral-100);
  --color-button-text-hover:             var(--tek-colors-neutral-white);
  --color-modal-background-default:      var(--tek-colors-neutral-900);
  --color-modal-border-default:          var(--tek-colors-neutral-400);
  --color-footer-background-default:     var(--tek-colors-neutral-700);
  --color-footer-text-default:           var(--tek-colors-neutral-100);
}

/* ── Reset ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Page ──────────────────────────────────────────────────────────────── */
html, body {
  height: 100%;
  font-family: 'Archivo', 'SF Compact', -apple-system, sans-serif;
  background: var(--tek-colors-neutral-900);
  color: var(--tek-colors-neutral-white);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.page {
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: relative;
}

/* ── Background gradient (matches Figma abstract fluid art) ────────────── */
.bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 30%, rgba(120, 80, 140, 0.55) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 70%, rgba(40, 50, 110, 0.7) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 60% 20%, rgba(180, 100, 80, 0.4) 0%, transparent 55%),
    radial-gradient(ellipse 70% 40% at 10% 80%, rgba(30, 30, 60, 0.9) 0%, transparent 50%),
    linear-gradient(135deg, #1a1020 0%, #0e0e2a 40%, #1a0e18 100%);
  z-index: 0;
}

/* Animated shimmer overlay */
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 40% 30% at 70% 40%, rgba(51, 186, 234, 0.06) 0%, transparent 60%);
  animation: shimmer 8s ease-in-out infinite alternate;
}

@keyframes shimmer {
  0%   { opacity: 0.4; transform: scale(1) translate(0,0); }
  100% { opacity: 1;   transform: scale(1.05) translate(2%, 1%); }
}

/* ── Logo ──────────────────────────────────────────────────────────────── */
.logo {
  position: absolute;
  top: 61px;
  left: 45px;
  display: flex;
  align-items: center;
  gap: var(--tek-spacing-s09);
  z-index: 2;
  text-decoration: none;
}

.logo-mark {
  width: 149px;
  height: 128px;
  flex-shrink: 0;
}

.logo-mark svg {
  width: 100%;
  height: 100%;
}

.logo-text {
  font-family: 'Archivo', sans-serif;
  font-size: 31px;
  font-weight: 669;
  line-height: 24px;
  color: var(--tek-colors-neutral-900);
  white-space: nowrap;
  font-stretch: expanded;
  letter-spacing: -0.5px;
}

/* ── Main content ──────────────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
}

/* ── Modal ─────────────────────────────────────────────────────────────── */
.modal {
  width: 320px;
  background: var(--color-modal-background-default);
  border: var(--tek-borders-width-02) solid var(--color-modal-border-default);
  border-radius: var(--tek-borders-radius-03);
  padding: var(--tek-spacing-s11);
  box-shadow: 0 2px 6px var(--tek-colors-ui-shadow);
  display: flex;
  flex-direction: column;
  gap: var(--tek-spacing-s09);
  animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-title {
  font-family: 'Archivo', sans-serif;
  font-size: 24px;
  font-weight: 600;
  line-height: 24px;
  color: var(--tek-colors-neutral-white);
  margin-bottom: var(--tek-spacing-s02);
}

/* ── Form field ────────────────────────────────────────────────────────── */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--tek-spacing-s02);
}

.field-label {
  font-size: 12px;
  font-weight: 457;
  line-height: 12px;
  color: var(--color-input-label-default);
  font-family: 'SF Compact', -apple-system, sans-serif;
}

.field-input {
  background: var(--color-input-background-default);
  border: var(--tek-borders-width-02) solid var(--color-input-border-default);
  border-radius: var(--tek-borders-radius-02);
  color: var(--color-input-text-default);
  font-family: 'SF Compact', -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 457;
  line-height: 15px;
  padding: var(--tek-spacing-s05) var(--tek-spacing-s07);
  width: 100%;
  outline: none;
  transition: border-color 0.15s, color 0.15s;
  -webkit-appearance: none;
}

.field-input::placeholder {
  color: var(--color-input-text-default);
}

.field-input:focus {
  border-color: var(--color-input-border-focus);
  color: var(--color-input-text-focus);
}

.field-input:not(:placeholder-shown) {
  border-color: var(--color-input-border-filled);
  color: var(--color-input-text-filled);
}

/* ── Checkbox row ──────────────────────────────────────────────────────── */
.checkbox-row {
  display: flex;
  align-items: center;
  gap: var(--tek-spacing-s05);
  cursor: pointer;
  user-select: none;
}

.checkbox-input {
  display: none;
}

.checkbox-box {
  width: 16px;
  height: 16px;
  background: var(--color-selector-background-default);
  border: var(--tek-borders-width-02) solid var(--color-selector-border-unchecked);
  border-radius: var(--tek-borders-radius-02);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}

.checkbox-input:checked + .checkbox-box {
  background: var(--color-selector-background-checked);
  border-color: var(--color-selector-border-checked);
}

.checkbox-input:checked + .checkbox-box::after {
  content: '';
  width: 9px;
  height: 6px;
  border-left: 1.5px solid var(--tek-colors-neutral-900);
  border-bottom: 1.5px solid var(--tek-colors-neutral-900);
  transform: rotate(-45deg) translateY(-1px);
}

.checkbox-label {
  font-family: 'SF Compact', -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 457;
  line-height: 12px;
  color: var(--color-selector-label-unchecked);
  transition: color 0.15s;
}

.checkbox-input:checked ~ .checkbox-label {
  color: var(--color-selector-label-checked);
}

/* ── Button ────────────────────────────────────────────────────────────── */
.btn-primary {
  width: 100%;
  background: var(--color-button-background-default);
  border: var(--tek-borders-width-02) solid var(--color-button-border-default);
  border-radius: var(--tek-borders-radius-full);
  color: var(--color-button-text-default);
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  font-weight: 578;
  line-height: 18px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: var(--tek-spacing-s07) var(--tek-spacing-s09);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn-primary:hover {
  background: var(--color-button-background-hover);
  color: var(--color-button-text-hover);
}

/* ── Footer ────────────────────────────────────────────────────────────── */
.footer {
  background: var(--color-footer-background-default);
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 var(--tek-spacing-s09);
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}

.footer-text {
  font-family: 'SF Compact', -apple-system, sans-serif;
  font-size: 12px;
  font-weight: 457;
  line-height: 12px;
  color: var(--color-footer-text-default);
}
</style>
</head>
<body>

<div class="page">
  <div class="bg"></div>

  <!-- Logo -->
  <a class="logo" href="#">
    <!-- Tek T logomark -->
    <div class="logo-mark">
      <svg viewBox="0 0 149 128" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- T crossbar -->
        <rect x="0" y="0" width="149" height="28" fill="#181818"/>
        <!-- T stem -->
        <rect x="60" y="28" width="29" height="100" fill="#181818"/>
        <!-- K upper diagonal -->
        <polygon points="89,28 149,0 149,28 118,56" fill="#181818"/>
        <!-- K lower diagonal -->
        <polygon points="89,56 118,56 149,28 149,56 118,84 89,84" fill="#181818"/>
        <!-- K lower leg -->
        <polygon points="89,84 118,84 149,56 149,84 118,112 89,112" fill="#181818"/>
        <!-- Bottom strip -->
        <rect x="0" y="100" width="89" height="28" fill="#181818"/>
      </svg>
    </div>
    <span class="logo-text">TekCloud</span>
  </a>

  <!-- Main -->
  <main class="main">
    <div class="modal">
      <h1 class="modal-title">Sign In</h1>

      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input class="field-input" id="username" type="text" placeholder="Enter message here" autocomplete="username" />
      </div>

      <div class="field">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" id="password" type="password" placeholder="Enter message here" autocomplete="current-password" />
      </div>

      <label class="checkbox-row">
        <input class="checkbox-input" type="checkbox" id="stay-signed-in" />
        <span class="checkbox-box"></span>
        <span class="checkbox-label">Stay signed in</span>
      </label>

      <button class="btn-primary" type="submit">Sign In</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-text">©2026 Tektronix. All Rights Reserved.</span>
  </footer>
</div>

<script>
  // Checkbox label color binding
  document.querySelectorAll('.checkbox-row').forEach(row => {
    const input = row.querySelector('.checkbox-input');
    const label = row.querySelector('.checkbox-label');
    input.addEventListener('change', () => {
      label.style.color = input.checked
        ? 'var(--color-selector-label-checked)'
        : 'var(--color-selector-label-unchecked)';
    });
  });
</script>
</body>
</html>
