<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TekCloud — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,100..900&display=swap" rel="stylesheet">
<style>

/* ── TEK TOKENS ─────────────────────────────────────────── */
:root {
  /* primitives */
  --tek-primitive-color-neutral-grey-100: #cccccc;
  --tek-primitive-color-neutral-grey-200: #afafaf;
  --tek-primitive-color-neutral-grey-300: #979797;
  --tek-primitive-color-neutral-grey-400: #7b7b7b;
  --tek-primitive-color-neutral-grey-500: #454545;
  --tek-primitive-color-neutral-grey-700: #252525;
  --tek-primitive-color-neutral-grey-800: #1e1e1e;
  --tek-primitive-color-neutral-grey-900: #181818;
  --tek-primitive-color-core-tek-blue:    #33baea;
  --tek-primitive-color-core-white:       #ffffff;
  --tek-primitive-color-core-black:       #000000;
  --tek-primitive-color-ui-alert-red:     #e74848;
  --tek-primitive-color-ui-alert-amber:   #e0b732;
  --tek-primitive-color-ui-shadow:        rgba(0,0,0,0.2);

  /* semantic */
  --tek-color-selector-background-default:   #252525;
  --tek-color-selector-background-unchecked: #454545;
  --tek-color-selector-background-checked:   #cccccc;
  --tek-color-selector-border-unchecked:     #7b7b7b;
  --tek-color-selector-border-checked:       #979797;
  --tek-color-selector-border-error:         #e74848;
  --tek-color-selector-label-unchecked:      #cccccc;
  --tek-color-selector-label-checked:        #ffffff;
  --tek-color-selector-label-error:          #ffffff;
  --tek-color-input-background-default:      #252525;
  --tek-color-input-border-default:          #7b7b7b;
  --tek-color-input-border-focus:            #ffffff;
  --tek-color-input-border-filled:           #afafaf;
  --tek-color-input-border-disabled:         #454545;
  --tek-color-input-border-error:            #e74848;
  --tek-color-input-text-default:            #979797;
  --tek-color-input-text-focus:              #ffffff;
  --tek-color-input-text-filled:             #cccccc;
  --tek-color-input-text-disabled:           #454545;
  --tek-color-input-text-error:              #ffffff;
  --tek-color-input-label-default:           #cccccc;
  --tek-color-button-background-default:     #1e1e1e;
  --tek-color-button-background-hover:       #000000;
  --tek-color-button-background-inactive:    #181818;
  --tek-color-button-border-default:         #33baea;
  --tek-color-button-border-hover:           #33baea;
  --tek-color-button-border-inactive:        #454545;
  --tek-color-button-text-default:           #cccccc;
  --tek-color-button-text-hover:             #ffffff;
  --tek-color-button-text-inactive:          #454545;
  --tek-color-modal-background-default:      #181818;
  --tek-color-modal-border-default:          #7b7b7b;
  --tek-color-modal-text-default:            #ffffff;
  --tek-color-footer-background-default:     #252525;
  --tek-color-footer-text-default:           #cccccc;
  --tek-color-text-link-default:             #33baea;
  --tek-color-icons-default:                 #ffffff;
}

/* ── RESET ──────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button { background: none; border: none; cursor: pointer; font: inherit; }

/* ── PAGE
   Figma: bg neutral/800 (#1e1e1e), flex-col, items-center,
          full size — replaced with gradient background from screenshot
───────────────────────────────────────────────────────────── */
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-color: var(--tek-primitive-color-neutral-grey-800);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(80,60,140,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(180,100,80,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(30,50,120,0.4) 0%, transparent 50%);
  font-family: 'SF Compact', system-ui, sans-serif;
}

/* ── LOGO — top left, absolute
   Figma: left 45px, top 61px
   Union (149×128px) + Logo Lockup (154×24px, gap 8px, items-end)
─────────────────────────────────────────────────────────── */
.logo {
  position: absolute;
  top: 61px;
  left: 45px;
  display: flex;
  align-items: flex-end;
  gap: 0;
}

.logo-mark {
  width: 149.328px;
  height: 128px;
  flex-shrink: 0;
}

.logo-mark img {
  display: block;
  width: 100%;
  height: 100%;
}

.logo-lockup {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 0;
  flex-shrink: 0;
}

/* Figma: Archivo SemiBold 31px, wdth 110, lh 24, neutral/900 */
.logo-name {
  font-family: 'Archivo', sans-serif;
  font-size: 31px;
  font-weight: 669;
  font-variation-settings: 'wdth' 110;
  line-height: 24px;
  color: var(--tek-primitive-color-neutral-grey-900);
  white-space: nowrap;
}

/* ── WRAP — flex-1, centers modal
   Figma: flex-col, gap 0 (--2rem resolves to 0px), items-center, justify-center
───────────────────────────────────────────────────────────── */
.wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 1px;
  padding: 0;
}

/* ── MODAL
   Figma: bg modal/background/default, border 0.25px modal/border/default,
          flex-col, gap 14px, items-start, overflow-clip,
          p 32px, radius 05 (11px), shadow 0px 2px 6px 0 rgba(0,0,0,0.2),
          w 320px (--20rem)
─────────────────────────────────────────────────────────── */
.modal {
  background: var(--tek-color-modal-background-default);
  border: 0.25px solid var(--tek-color-modal-border-default);
  border-radius: 11px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: flex-start;
  overflow: hidden;
  padding: 32px;
  width: 320px;
  box-shadow: 0px 2px 6px 0px var(--tek-primitive-color-ui-shadow);
  flex-shrink: 0;
}

/* ── MODAL HEADER
   Figma: Archivo SemiBold 24px, wdth 106, lh 24, modal/text/default
─────────────────────────────────────────────────────────── */
.modal-header {
  font-family: 'Archivo', sans-serif;
  font-size: 24px;
  font-weight: 600;
  font-variation-settings: 'wdth' 106;
  line-height: 24px;
  letter-spacing: 0;
  color: var(--tek-color-modal-text-default);
  width: 100%;
}

/* ── INPUT BLOCKS
   Figma: flex-col, gap 10px, items-start, p 0, w 256px
─────────────────────────────────────────────────────────── */
.input-blocks {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-start;
  padding: 0;
  width: 256px;
}

/* ── FORM (label + input)
   Figma: flex-col, gap 6px, items-start, pb 12px, pt 0, px 0, w 258px
─────────────────────────────────────────────────────────── */
.form-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  padding-bottom: 12px;
  padding-top: 0;
  padding-left: 0;
  padding-right: 0;
  width: 258px;
  flex-shrink: 0;
}

/* ── LABEL
   Figma: flex-col, gap 2px, items-start, p 0, w 258px
   Text: SF Compact Regular 12px, lh 12px, input/label/default
─────────────────────────────────────────────────────────── */
.form-label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  align-items: flex-start;
  padding: 0;
  width: 100%;
  flex-shrink: 0;
}

.form-label span {
  font-family: 'SF Compact', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 400;
  font-style: normal;
  line-height: 12px;
  color: var(--tek-color-input-label-default);
}

/* ── INPUT
   Figma: bg input/background/default, border 0.5px input/border/default,
          flex, gap 4px, items-start, pl 10px, pr 4px, py 8px,
          radius 03 (5px), w 258px
   Text: SF Compact Regular 12px, lh 15px, input/text/default
─────────────────────────────────────────────────────────── */
.input-wrap {
  background: var(--tek-color-input-background-default);
  border: 0.5px solid var(--tek-color-input-border-default);
  display: flex;
  gap: 4px;
  align-items: flex-start;
  padding: 8px 4px 8px 10px;
  border-radius: 5px;
  width: 100%;
  flex-shrink: 0;
  transition: border-color 0.1s;
}

.input-wrap:focus-within {
  border-color: var(--tek-color-input-border-focus);
}

.input-wrap input {
  flex: 1 0 0;
  background: transparent;
  border: none;
  outline: none;
  font-family: 'SF Compact', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 400;
  font-style: normal;
  line-height: 15px;
  color: var(--tek-color-input-text-default);
  min-height: 1px;
  min-width: 1px;
  padding: 0;
}

.input-wrap input:focus {
  color: var(--tek-color-input-text-focus);
}

.input-wrap input::placeholder {
  color: var(--tek-color-input-text-default);
}

/* ── SELECTOR (stay signed in)
   Figma: flex, gap 0, items-center, p 0, w full
   Inner: flex, flex-1, gap 8px, items-center
─────────────────────────────────────────────────────────── */
.selector-row {
  display: flex;
  gap: 0;
  align-items: center;
  padding: 0;
  width: 100%;
  cursor: pointer;
}

.selector-inner {
  display: flex;
  flex: 1 0 0;
  gap: 8px;
  align-items: center;
  min-height: 1px;
  min-width: 1px;
  padding: 0;
}

/* ── CHECKBOX
   Figma: relative, size 16px
   Box: absolute inset-0, bg selector/background/default,
        border 0.5px selector/border/unchecked, radius 02 (3px)
─────────────────────────────────────────────────────────── */
.checkbox {
  position: relative;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
}

.checkbox-box {
  position: absolute;
  inset: 0;
  background: var(--tek-color-selector-background-default);
  border: 0.5px solid var(--tek-color-selector-border-unchecked);
  border-radius: 3px;
}

.checkbox.checked .checkbox-box {
  border-color: var(--tek-color-selector-border-checked);
}

.checkbox-icon {
  position: absolute;
  inset: 0;
  overflow: hidden;
  display: none;
}

.checkbox.checked .checkbox-icon { display: block; }

.checkbox-mark {
  position: absolute;
  left: 15.63%;
  right: 15.62%;
  height: 9.001px;
  top: 50%;
  transform: translateY(-50%);
}

.checkbox-mark svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* ── SELECTOR LABEL
   Figma: flex, gap 0, items-center, p 0, cursor-pointer
   Text: SF Compact Regular 12px, lh 12px, selector/label/unchecked
─────────────────────────────────────────────────────────── */
.selector-label {
  display: flex;
  flex: 1 0 0;
  gap: 0;
  align-items: center;
  min-height: 1px;
  min-width: 1px;
  padding: 0;
  cursor: pointer;
}

.selector-label span {
  flex: 1 0 0;
  font-family: 'SF Compact', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 400;
  font-style: normal;
  line-height: 12px;
  color: var(--tek-color-selector-label-unchecked);
  text-align: left;
}

.selector-row.checked .selector-label span {
  color: var(--tek-color-selector-label-checked);
}

/* ── ACTION BLOCKS
   Figma: flex-col, items-start, w full
─────────────────────────────────────────────────────────── */
.action-blocks {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  flex-shrink: 0;
}

/* ── BUTTON (Primary Default)
   Figma: bg button/background/default, border 1px button/border/default,
          flex, gap 0, items-center, justify-center,
          px 24px, py 12px, radius full, w full
   Text: Archivo Medium 16px, wdth 106, lh 18, ls 2 (0.32px),
         button/text/default
─────────────────────────────────────────────────────────── */
.btn-primary {
  display: flex;
  gap: 0;
  align-items: center;
  justify-content: center;
  padding: 12px 24px;
  background: var(--tek-color-button-background-default);
  border: 1px solid var(--tek-color-button-border-default);
  border-radius: 9999px;
  width: 100%;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  outline: none;
}

.btn-primary:hover {
  background: var(--tek-color-button-background-hover);
  border-color: var(--tek-color-button-border-hover);
}

.btn-primary:hover .btn-label { color: var(--tek-color-button-text-hover); }

.btn-primary:focus-visible {
  box-shadow: 0 0 0 2px var(--tek-color-button-border-default);
}

.btn-label {
  font-family: 'Archivo', sans-serif;
  font-size: 16px;
  font-weight: 578;
  font-variation-settings: 'wdth' 106;
  line-height: 18px;
  letter-spacing: 0.32px;
  color: var(--tek-color-button-text-default);
  text-align: center;
  white-space: nowrap;
  transition: color 0.15s;
}

/* ── FOOTER
   Figma: bg footer/background/default, flex, gap 0, h 36px,
          items-center, px 16px, py 12px, w full
   Text: SF Compact Regular 12px, lh 12px, footer/text/default, text-right
─────────────────────────────────────────────────────────── */
.footer {
  display: flex;
  gap: 0;
  height: 36px;
  align-items: center;
  padding: 12px 16px;
  width: 100%;
  background: var(--tek-color-footer-background-default);
  flex-shrink: 0;
}

.footer-content {
  display: flex;
  flex: 1 0 0;
  gap: 0;
  align-items: center;
  justify-content: center;
  min-height: 1px;
  min-width: 1px;
  padding: 0;
}

.footer-text {
  flex: 1 0 0;
  font-family: 'SF Compact', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 400;
  font-style: normal;
  line-height: 12px;
  color: var(--tek-color-footer-text-default);
  text-align: right;
  min-height: 1px;
  min-width: 1px;
}

</style>
</head>
<body>

  <!-- LOGO — absolute top left -->
  <div class="logo">
    <div class="logo-mark">
      <img src="https://www.figma.com/api/mcp/asset/6089de43-4998-4dea-9eb4-b460171bf8a0" alt="Tek logo mark">
    </div>
    <div class="logo-lockup">
      <span class="logo-name">TekCloud</span>
    </div>
  </div>

  <!-- WRAP — centers modal -->
  <div class="wrap">
    <div class="modal">

      <!-- HEADER -->
      <div class="modal-header">Sign In</div>

      <!-- INPUT BLOCKS -->
      <div class="input-blocks">

        <!-- Email field -->
        <div class="form-field">
          <div class="form-label"><span>Placeholder</span></div>
          <div class="input-wrap">
            <input type="email" placeholder="Enter message here" autocomplete="email">
          </div>
        </div>

        <!-- Password field -->
        <div class="form-field">
          <div class="form-label"><span>Placeholder</span></div>
          <div class="input-wrap">
            <input type="password" placeholder="Enter message here" autocomplete="current-password">
          </div>
        </div>

        <!-- Stay signed in -->
        <div class="selector-row" id="stay-signed-in" onclick="toggleStaySignedIn()">
          <div class="selector-inner">
            <div class="checkbox" id="stay-checkbox">
              <div class="checkbox-box"></div>
              <div class="checkbox-icon">
                <div class="checkbox-mark">
                  <svg viewBox="0 0 11 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 4L4 7.5L10 1" stroke="var(--tek-color-icons-default)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </div>
              </div>
            </div>
            <div class="selector-label"><span>Stay signed in</span></div>
          </div>
        </div>

      </div><!-- /input-blocks -->

      <!-- ACTION BLOCKS -->
      <div class="action-blocks">
        <button class="btn-primary" type="submit">
          <span class="btn-label">Sign In</span>
        </button>
      </div>

    </div><!-- /modal -->
  </div><!-- /wrap -->

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-text">©2026 Tektronix. All Rights Reserved.</div>
    </div>
  </footer>

<script>
function toggleStaySignedIn() {
  const row = document.getElementById('stay-signed-in');
  const cb  = document.getElementById('stay-checkbox');
  const isChecked = cb.classList.contains('checked');
  cb.classList.toggle('checked', !isChecked);
  row.classList.toggle('checked', !isChecked);
}
</script>

</body>
</html>
