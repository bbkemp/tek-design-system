<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TekCloud — Sign In</title>

<!-- Fonts — Geist (body/UI) + Archivo (headings/buttons) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Archivo:wdth,wght@75..125,100..900&display=swap" rel="stylesheet">

<!--
  @bbkemp/tokens — complete build (primitives + dark/light semantic)
  In production: @import '@bbkemp/tokens/css/complete'
  Requires: npm run build --workspace=packages/tokens
-->
<link rel="stylesheet" href="./packages/tokens/dist/tek.complete.css">

<!--
  @bbkemp/ui — Web Components
  In production: import '@bbkemp/ui'
  Requires: npm run build --workspace=packages/ui
-->
<script type="module" src="./packages/ui/dist/tek-ui.js?v=2"></script>

<!-- AutoAnimate — ambient DOM transitions (light DOM only) -->
<script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@latest/index.umd.js"></script>

<style>
/* ============================================================
   PAGE-LEVEL STYLES ONLY
   All design tokens come from tek.complete.css above.
   This block is layout and page-specific only — no hardcoded
   colors, fonts, or sizes that belong in the token system.
============================================================ */

/* box-sizing safe to apply globally — does NOT affect shadow DOM :host padding */
*, *::before, *::after { box-sizing: border-box; }
/* margin/padding reset scoped to standard HTML elements only.
   Custom elements (tek-*) define their own padding via :host in shadow DOM.
   Putting padding:0 in * kills those styles because light DOM always beats :host. */
body, h1, h2, h3, h4, h5, h6, p, ul, ol, li,
blockquote, figure, figcaption, dl, dt, dd, pre { margin: 0; padding: 0; }

html, body {
  height: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: var(--tek-fonts-family-geist);
  color: var(--tek-primitive-color-neutral-100);
  background-color: var(--tek-primitive-color-neutral-800);
  position: relative;
  overflow-x: hidden;
}

.bg-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none;
}

.bg-gradient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(80,60,140,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(180,100,80,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(30,50,120,0.4)  0%, transparent 50%),
    var(--tek-primitive-color-neutral-800);
}

.page-wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-height: 100vh; width: 100%;
  container-type: inline-size;
  container-name: page;
}

.wrap {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: var(--tek-spacing-s17, 48px);
  padding: var(--tek-spacing-s17, 48px) var(--tek-spacing-s13, 32px) var(--tek-spacing-s11, 24px);
  width: 100%; min-height: 1px;
}

.logo-header {
  display: flex; flex-direction: column;
  align-items: center;
  width: 100%; flex-shrink: 0;
}

.logo-lockup { display: flex; align-items: center; gap: var(--tek-spacing-s06, 10px); }
.logo-icon   { height: 60px; width: auto; display: block; }
.logo-type   { height: 26px; width: auto; display: block; }

tek-modal { flex-shrink: 0; }

.form-field-label {
  font-family: var(--tek-fonts-family-geist);
  font-size: var(--tek-fonts-text-size-md);
  line-height: var(--tek-fonts-text-line-height-md);
  letter-spacing: 0.01em;
  font-weight: 400;
  color: var(--tek-color-input-label-default);
}

.form-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}

@container page (min-width: 640px) {
  .wrap { padding: var(--tek-spacing-s17, 48px) var(--tek-spacing-s19, 64px) var(--tek-spacing-s11, 24px); }
  .logo-icon { height: 90px; }
  .logo-type { height: 38px; }
}
@container page (min-width: 1280px) {
  .wrap {
    position: relative;
    align-items: center;
    justify-content: center;
    padding: var(--tek-spacing-s19, 64px);
  }
  .logo-header {
    position: absolute;
    top: 0;
    left: 0;
    align-items: flex-start;
  }
  tek-modal {
    --tek-modal-heading-size: var(--tek-fonts-heading-size-lg, 32px);
    --tek-modal-heading-line-height: var(--tek-fonts-heading-line-height-lg, 40px);
  }
}
</style>
</head>
<body>

<div class="bg-gradient" aria-hidden="true"></div>
<video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
  <source src="./img/bg-mov.mp4" type="video/mp4">
</video>

<div class="page-wrap">

  <div class="wrap">

    <header class="logo-header">
      <div class="logo-lockup" role="img" aria-label="TekCloud">
        <img class="logo-icon" src="./img/IconLogo.svg" alt="">
        <img class="logo-type" src="./img/TypeLogo.svg" alt="TekCloud">
      </div>
    </header>

    <tek-modal>

      <span slot="header">Sign In</span>

      <div id="signin-input-blocks" slot="input-blocks"
           style="display:flex;flex-direction:column;gap:var(--tek-spacing-s09,16px);width:100%;">

        <div style="display:flex;flex-direction:column;gap:var(--tek-spacing-s04,6px);">
          <div class="form-field-label">Email</div>
          <tek-input placeholder="Enter email" type="email"
                     autocomplete="email" style="display:block;width:100%"></tek-input>
        </div>

        <div style="display:flex;flex-direction:column;gap:var(--tek-spacing-s04,6px);">
          <div class="form-label-row">
            <span class="form-field-label">Password</span>
            <tek-text-link href="#">Forgot password?</tek-text-link>
          </div>
          <tek-input placeholder="Enter password" type="password"
                     autocomplete="current-password" style="display:block;width:100%"></tek-input>
        </div>

        <tek-selector type="checkbox" label="Stay signed in" style="width:100%"></tek-selector>

      </div>

      <div id="signin-action-blocks" slot="action-blocks"
           style="width:100%;display:flex;flex-direction:column;gap:var(--tek-spacing-s06,10px);">
        <tek-button style="width:100%;display:block">Sign In</tek-button>
      </div>

    </tek-modal>

  </div>

  <tek-footer>
    <div slot="left" style="display:flex;align-items:center;gap:4px;">
      <span style="font-size:16px;line-height:1;">🌚</span>
      <tek-toggle id="theme-toggle"></tek-toggle>
      <span style="font-size:16px;line-height:1;">🌝</span>
    </div>
    ©2026 Tektronix. All Rights Reserved.
  </tek-footer>

</div>

<script type="module">
/* Theme toggle */
document.getElementById('theme-toggle').addEventListener('tek-change', e => {
  document.documentElement.setAttribute('data-theme', e.detail.checked ? 'light' : 'dark');
});

/* AutoAnimate */
if (typeof autoAnimate !== 'undefined') {
  autoAnimate(document.querySelector('.wrap'));
  autoAnimate(document.getElementById('signin-input-blocks'));
  autoAnimate(document.getElementById('signin-action-blocks'));
}
</script>

</body>
</html>
