/* ============================================================

:root {
  /* ── Type scale — primitives/fonts.json ────────────────── */
  --tek-fonts-family-geist:   'Geist', system-ui, sans-serif;
  --tek-fonts-family-archivo: 'Archivo', sans-serif;

  --tek-fonts-text-size-lg:        14px;
  --tek-fonts-text-size-xl:        16px;
  --tek-fonts-text-line-height-xs: 12px;
  --tek-fonts-text-line-height-sm: 12px;
  --tek-fonts-text-line-height-md: 16px;
  --tek-fonts-text-line-height-lg: 20px;
  --tek-fonts-text-line-height-xl: 24px;

  --tek-fonts-heading-size-xs:        16px;
  --tek-fonts-heading-size-md:        24px;
  --tek-fonts-heading-line-height-xs: 24px;
  --tek-fonts-heading-line-height-md: 32px;

  /* ── Color primitives — primitives/color.json ────────────── */
  --tek-primitive-color-neutral-100:   #cccccc;
  --tek-primitive-color-neutral-200:   #afafaf;
  --tek-primitive-color-neutral-300:   #979797;
  --tek-primitive-color-neutral-400:   #7b7b7b;
  --tek-primitive-color-neutral-450:   #646464;
  --tek-primitive-color-neutral-500:   #454545;
  --tek-primitive-color-neutral-600:   #333333;
  --tek-primitive-color-neutral-700:   #252525;
  --tek-primitive-color-neutral-800:   #1e1e1e;
  --tek-primitive-color-neutral-900:   #181818;
  --tek-primitive-color-neutral-black: #000000;
  --tek-primitive-color-neutral-white: #ffffff;
  --tek-primitive-color-brand-tek-blue:#33baea;
  --tek-primitive-color-ui-error:      #e74848;
  --tek-primitive-color-ui-warning:    #e0b732;
  --tek-primitive-color-ui-success:    #42b54c;
  --tek-primitive-color-ui-shadow:     #00000033;
  --tek-primitive-color-backdrop-dark: #181818cc;
  --tek-primitive-color-backdrop-light:#cccccccc;

  /* ── Semantic — DARK MODE defaults (semantic/tokens.json) ───── */

  --tek-color-modal-border-default:     #7b7b7b;

  --tek-color-modal-shadow-default:     #00000033;

  --tek-color-input-background-default: #252525;
  --tek-color-input-border-default:     #7b7b7b;
  --tek-color-input-border-focus:       #ffffff;
  --tek-color-input-border-filled:      #afafaf;
  --tek-color-input-border-disabled:    #454545;
  --tek-color-input-border-error:       #e74848;
  --tek-color-input-text-default:       #979797;
  --tek-color-input-text-focus:         #ffffff;
  --tek-color-input-text-filled:        #cccccc;
  --tek-color-input-text-disabled:      #454545;
  --tek-color-input-text-error:         #ffffff;
  --tek-color-input-label-default:      #cccccc;
  --tek-color-input-character-count-default: #cccccc;
  --tek-color-input-character-count-focus:   #ffffff;
  --tek-color-input-character-count-filled:  #afafaf;
  --tek-color-input-character-count-error:   #e74848;

  --tek-color-selector-background-unchecked: #454545;
  --tek-color-selector-background-checked:   #cccccc;
  --tek-color-selector-border-unchecked:     #7b7b7b;
  --tek-color-selector-border-checked:       #979797;
  --tek-color-selector-border-error:         #e74848;
  --tek-color-selector-label-unchecked:      #cccccc;
  --tek-color-selector-label-checked:        #ffffff;
  --tek-color-selector-label-error:          #ffffff;

  --tek-color-button-background-default:  #1e1e1e;
  --tek-color-button-background-hover:    #000000;
  --tek-color-button-background-inactive: #181818;
  --tek-color-button-border-default:      #33baea;
  --tek-color-button-border-inactive:     #454545;
  --tek-color-button-text-default:        #cccccc;
  --tek-color-button-text-hover:          #ffffff;
  --tek-color-button-text-inactive:       #454545;

  --tek-color-footer-background-default:  #252525;
  --tek-color-footer-text-default:        #cccccc;
  --tek-color-text-link-default:          #33baea;
  --tek-color-icons-default:              #ffffff;

  --tek-container-xs:  384px;
  --tek-container-sm:  640px;
  --tek-container-xl: 1280px;
}

/* ============================================================
   LIGHT MODE — resolved from semantic/tokens.light.json
   Auto-exported by Token Push. Source of truth is Figma.
============================================================ */
[data-theme="light"] {
  --tek-color-modal-background-default: #cccccccc;
  --tek-color-modal-border-default:     #333333;
  --tek-color-modal-text-default:       #000000;

  --tek-color-input-background-default: #ffffff;
  --tek-color-input-border-default:     #333333;
  --tek-color-input-border-focus:       #000000;
  --tek-color-input-border-filled:      #1e1e1e;
  --tek-color-input-border-disabled:    #646464;
  --tek-color-input-text-default:       #252525;
  --tek-color-input-text-focus:         #000000;
  --tek-color-input-text-filled:        #181818;
  --tek-color-input-text-disabled:      #646464;
  --tek-color-input-text-error:         #000000;
  --tek-color-input-label-default:      #181818;

  --tek-color-selector-background-default:   #ffffff;
  --tek-color-selector-background-unchecked: #646464;
  --tek-color-selector-background-checked:   #181818;
  --tek-color-selector-border-unchecked:     #333333;
  --tek-color-selector-border-checked:       #252525;
  --tek-color-selector-label-unchecked:      #000000;
  --tek-color-selector-label-checked:        #000000;
  --tek-color-selector-label-error:          #000000;

  --tek-color-button-background-default:  #ffffff;
  --tek-color-button-background-hover:    #33baea;
  --tek-color-button-background-inactive: #afafaf;
  --tek-color-button-border-inactive:     #646464;
  --tek-color-button-text-default:        #000000;
  --tek-color-button-text-hover:          #000000;
  --tek-color-button-text-inactive:       #646464;

  --tek-color-footer-background-default:  #afafaf;
  --tek-color-footer-text-default:        #181818;
  --tek-color-icons-default:              #000000;
}

/* ============================================================
   RESET
   !important on :host padding defeats the * { padding:0 } bleed
   into shadow DOM :host. Intentional — do not remove.
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: var(--tek-fonts-family-geist);
  color: var(--tek-primitive-color-neutral-100);
  background-color: var(--tek-primitive-color-neutral-800);
  position: relative;
  overflow-x: hidden;
}

.bg-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none;
}

.bg-gradient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(80,60,140,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(180,100,80,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(30,50,120,0.4)  0%, transparent 50%),
    var(--tek-primitive-color-neutral-800);
}

.page-wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-height: 100vh; width: 100%;
  container-type: inline-size;
  container-name: page;
}

.wrap {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 48px;
  padding: 48px 32px 24px;
  width: 100%; min-height: 1px;
}

.logo-header {
  display: flex; flex-direction: column;
  align-items: center;
  width: 100%; flex-shrink: 0;
}

.logo-lockup { display: flex; align-items: center; gap: 10px; }
.logo-icon   { height: 90px; width: auto; display: block; }
.logo-type   { height: 38px; width: auto; display: block; }

.form-field-label {
  font-family: var(--tek-fonts-family-geist);
  font-size: var(--tek-fonts-text-size-md);
  line-height: var(--tek-fonts-text-line-height-md);
  letter-spacing: 0.01em;
  font-weight: 400;
  color: var(--tek-color-input-label-default);
  margin-bottom: 2px;
}

.form-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 2px;
}

@container page (min-width: 640px) {
  .wrap { padding: 48px 64px 24px; gap: 48px; }
}
@container page (min-width: 1280px) {
  .wrap        { padding: 64px 64px 32px; gap: 64px; }
  .logo-header { align-items: flex-start; }
  .logo-icon   { height: 128px; }
  .logo-type   { height: 52px; }
}
</style>
</head>
<body>

<div class="bg-gradient" aria-hidden="true"></div>
<video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
  <source src="./img/bg-mov.mp4" type="video/mp4">
</video>

<div class="page-wrap">

  <div class="wrap">

    <header class="logo-header">
      <div class="logo-lockup" role="img" aria-label="TekCloud">
        <img class="logo-icon" src="./img/IconLogo.svg" alt="">
        <img class="logo-type" src="./img/TypeLogo.svg" alt="TekCloud">
      </div>
    </header>

    <tek-modal>

      <span slot="header">Sign In</span>

      <div id="signin-input-blocks" slot="input-blocks"
           style="display:flex;flex-direction:column;gap:10px;width:100%;">

        <div style="display:flex;flex-direction:column;gap:6px;padding-bottom:12px;">
          <div class="form-field-label">Email</div>
          <tek-input placeholder="Enter message here" type="email"
                     autocomplete="email" style="display:block"></tek-input>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;padding-bottom:12px;">
          <div class="form-label-row">
            <span class="form-field-label" style="margin-bottom:0">Password</span>
            <tek-text-link href="#">Forgot password?</tek-text-link>
          </div>
          <tek-input placeholder="Enter message here" type="password"
                     autocomplete="current-password" style="display:block"></tek-input>
        </div>

        <tek-selector type="checkbox" label="Stay signed in"></tek-selector>

      </div>

      <div id="signin-action-blocks" slot="action-blocks"
           style="width:100%;display:flex;flex-direction:column;gap:10px;">
        <tek-button style="width:100%;display:block">Sign In</tek-button>
      </div>

    </tek-modal>

  </div>

  <tek-footer>
    <div slot="left" style="display:flex;align-items:center;gap:4px;">
      <span style="font-size:16px;line-height:1;">🌚</span>
      <tek-toggle id="theme-toggle"></tek-toggle>
      <span style="font-size:16px;line-height:1;">🌝</span>
    </div>
    ©2026 Tektronix. All Rights Reserved.
  </tek-footer>

</div>

<!-- ============================================================
  @bbkemp/ui — Web Components — in production: import '@bbkemp/ui'

  Shadow DOM notes:
  - !important on :host padding defeats Chrome's * {padding:0} bleed.
  - tek-input: _render() for structural changes, _applyStyle() for state.
    Focus/blur never call setAttribute('state') to avoid re-render loops.
  - tek-selector-label: display:inline-flex so it aligns correctly
    as a flex child inside tek-selector's shadow DOM.
============================================================ -->
<script>
const SDR = `*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }`;

customElements.define('tek-checkbox', class extends HTMLElement {
  static get observedAttributes() { return ['checked','error','disabled']; }
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this.addEventListener('click', () => {
      if (this.hasAttribute('disabled')) return;
      this.hasAttribute('checked') ? this.removeAttribute('checked') : this.setAttribute('checked','');
      this.dispatchEvent(new CustomEvent('tek-change',{bubbles:true,composed:true,detail:{checked:this.hasAttribute('checked')}}));
    });
    this._render();
  }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const checked=this.hasAttribute('checked'), error=this.hasAttribute('error'), disabled=this.hasAttribute('disabled');
    const bc = error ? 'var(--tek-color-selector-border-error,#e74848)'
               : checked ? 'var(--tek-color-selector-border-checked,#979797)'
               : 'var(--tek-color-selector-border-unchecked,#7b7b7b)';
    this._s.innerHTML = `<style>${SDR}:host{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?'0.4':'1'};}
.box{width:16px;height:16px;border-radius:3px;background:var(--tek-color-selector-background-default,#252525);border:0.5px solid ${bc};display:flex;align-items:center;justify-content:center;}</style>
<div class="box">${checked?`<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="var(--tek-color-icons-default,#fff)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}</div>`;
  }
});

customElements.define('tek-radio', class extends HTMLElement {
  static get observedAttributes() { return ['checked','error','disabled']; }
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this.addEventListener('click', () => {
      if (this.hasAttribute('disabled') || this.hasAttribute('checked')) return;
      const n = this.getAttribute('name');
      if (n) document.querySelectorAll(`tek-radio[name="${n}"]`).forEach(r => r.removeAttribute('checked'));
      this.setAttribute('checked','');
      this.dispatchEvent(new CustomEvent('tek-change',{bubbles:true,composed:true,detail:{checked:true}}));
    });
    this._render();
  }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const checked=this.hasAttribute('checked'), error=this.hasAttribute('error'), disabled=this.hasAttribute('disabled');
    const bc = error ? 'var(--tek-color-selector-border-error,#e74848)'
               : checked ? 'var(--tek-color-selector-border-checked,#979797)'
               : 'var(--tek-color-selector-border-unchecked,#7b7b7b)';
    this._s.innerHTML = `<style>${SDR}:host{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?'0.4':'1'};}
.ring{width:16px;height:16px;border-radius:50%;background:var(--tek-color-selector-background-default,#252525);border:0.5px solid ${bc};display:flex;align-items:center;justify-content:center;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tek-color-selector-background-checked,#cccccc);}</style>
<div class="ring">${checked?'<div class="dot"></div>':''}</div>`;
  }
});

customElements.define('tek-toggle', class extends HTMLElement {
  static get observedAttributes() { return ['checked','error','disabled']; }
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this.addEventListener('click', () => {
      if (this.hasAttribute('disabled')) return;
      this.hasAttribute('checked') ? this.removeAttribute('checked') : this.setAttribute('checked','');
      this.dispatchEvent(new CustomEvent('tek-change',{bubbles:true,composed:true,detail:{checked:this.hasAttribute('checked')}}));
    });
    this._render();
  }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const checked=this.hasAttribute('checked'), error=this.hasAttribute('error'), disabled=this.hasAttribute('disabled');
    const tbc = error ? 'var(--tek-color-selector-border-error,#e74848)'
                : checked ? 'var(--tek-color-selector-border-checked,#979797)'
                : 'var(--tek-color-selector-border-unchecked,#7b7b7b)';
    const thumbBg = checked ? 'var(--tek-color-selector-background-checked,#cccccc)'
                            : 'var(--tek-color-selector-background-unchecked,#454545)';
    const thumbBorder = (error||!checked) ? `0.5px solid ${error?'var(--tek-color-selector-border-error,#e74848)':'var(--tek-color-selector-border-unchecked,#7b7b7b)'}` : 'none';
    this._s.innerHTML = `<style>${SDR}:host{display:inline-flex;align-items:center;cursor:${disabled?'not-allowed':'pointer'};opacity:${disabled?'0.4':'1'};}
.track{width:28px;height:14px;border-radius:9999px;background:var(--tek-color-selector-background-default,#252525);border:0.5px solid ${tbc};position:relative;}
.thumb{position:absolute;top:0;left:${checked?'14px':'0px'};width:14px;height:14px;border-radius:50%;background:${thumbBg};border:${thumbBorder};transition:left 0.15s,background 0.15s;}</style>
<div class="track"><div class="thumb"></div></div>`;
  }
});

customElements.define('tek-selector-label', class extends HTMLElement {
  static get observedAttributes() { return ['checked','error']; }
  connectedCallback() { this._s = this.attachShadow({mode:'open'}); this._render(); }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const checked=this.hasAttribute('checked'), error=this.hasAttribute('error');
    const color = error ? 'var(--tek-color-selector-label-error,#ffffff)'
                 : checked ? 'var(--tek-color-selector-label-checked,#ffffff)'
                 : 'var(--tek-color-selector-label-unchecked,#cccccc)';
    /* display:inline-flex so this aligns correctly as a flex child in tek-selector */
    this._s.innerHTML = `<style>${SDR}:host{display:inline-flex;align-items:center;}span{font-family:var(--tek-fonts-family-geist,'Geist',system-ui,sans-serif);font-size:var(--tek-fonts-text-size-sm,12px);line-height:var(--tek-fonts-text-line-height-sm,12px);letter-spacing:0.01em;font-weight:400;color:${color};transition:color 0.15s;}</style><span><slot></slot></span>`;
  }
});

customElements.define('tek-selector', class extends HTMLElement {
  static get observedAttributes() { return ['type','label','checked','error','disabled','name']; }
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this._render();
    this._s.addEventListener('click', (e) => {
      if (this.hasAttribute('disabled')) return;
      const ctrl = this._s.querySelector('tek-checkbox,tek-radio,tek-toggle');
      if (ctrl && e.composedPath().includes(ctrl)) return;
      ctrl?.click();
    });
  }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const type=this.getAttribute('type')||'checkbox', label=this.getAttribute('label')||'';
    const checked=this.hasAttribute('checked')?'checked':'', error=this.hasAttribute('error')?'error':'';
    const disabled=this.hasAttribute('disabled')?'disabled':'', name=this.getAttribute('name')?`name="${this.getAttribute('name')}"`:'';
    this._s.innerHTML = `<style>${SDR}:host{display:inline-flex;align-items:center;gap:8px;cursor:${disabled?'not-allowed':'pointer'};user-select:none;}</style>
<tek-${type} ${checked} ${error} ${disabled} ${name}></tek-${type}>
<tek-selector-label ${checked} ${error}>${label}</tek-selector-label>`;
    const ctrl=this._s.querySelector(`tek-${type}`), lbl=this._s.querySelector('tek-selector-label');
    ctrl?.addEventListener('tek-change', (e) => {
      e.detail.checked ? lbl.setAttribute('checked','') : lbl.removeAttribute('checked');
      this.dispatchEvent(new CustomEvent('tek-change',{bubbles:true,composed:true,detail:e.detail}));
    });
  }
});

/* tek-input: _render()/_applyStyle() split preserves focus+value on state change.
   cursor:not-allowed on :host when disabled so it shows outside the input bounds too. */
customElements.define('tek-input', class extends HTMLElement {
  static get observedAttributes() { return ['state','height','placeholder','value','type']; }
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this._st = this.getAttribute('state') || 'default';
    this._render();
    this._s.addEventListener('focus', () => {
      if (this._st === 'default') { this._st = 'focus'; this._applyStyle(); }
    }, true);
    this._s.addEventListener('blur', () => {
      if (this._st !== 'error' && this._st !== 'disabled') {
        const el = this._s.querySelector('input,textarea');
        this._st = el?.value ? 'filled' : 'default';
        this._applyStyle();
      }
    }, true);
    this._s.addEventListener('input', () => {
      const el = this._s.querySelector('input,textarea');
      this.dispatchEvent(new CustomEvent('tek-input',{bubbles:true,composed:true,detail:{value:el?.value||''}}));
    });
  }
  attributeChangedCallback(name, _, val) {
    if (!this._s) return;
    if (name === 'state') { this._st = val || 'default'; this._applyStyle(); }
    else this._render();
  }
  _bc(s){return ({default:'var(--tek-color-input-border-default,#7b7b7b)',focus:'var(--tek-color-input-border-focus,#fff)',filled:'var(--tek-color-input-border-filled,#afafaf)',disabled:'var(--tek-color-input-border-disabled,#454545)',error:'var(--tek-color-input-border-error,#e74848)'})[s]||'var(--tek-color-input-border-default,#7b7b7b)';}
  _tc(s){return ({default:'var(--tek-color-input-text-default,#979797)',focus:'var(--tek-color-input-text-focus,#fff)',filled:'var(--tek-color-input-text-filled,#cccccc)',disabled:'var(--tek-color-input-text-disabled,#454545)',error:'var(--tek-color-input-text-error,#fff)'})[s]||'var(--tek-color-input-text-default,#979797)';}
  _css(s){return `${SDR}:host{display:block;cursor:${s==='disabled'?'not-allowed':'text'};}input,textarea{display:block;width:100%;background:var(--tek-color-input-background-default,#252525);border:0.5px solid ${this._bc(s)};border-radius:5px;padding:8px 4px 8px 10px !important;font-family:var(--tek-fonts-family-geist,'Geist',system-ui,sans-serif);font-size:var(--tek-fonts-text-size-lg,14px);line-height:var(--tek-fonts-text-line-height-lg,20px);letter-spacing:0.01em;color:${this._tc(s)};outline:none;resize:vertical;pointer-events:${s==='disabled'?'none':'auto'};}input::placeholder,textarea::placeholder{color:${this._tc(s)};opacity:0.7;}`;}
  _applyStyle(){const sEl=this._s.querySelector('style');if(sEl)sEl.textContent=this._css(this._st||'default');}
  _render(){
    const s=this._st||'default', h=this.getAttribute('height')||'single';
    const ph=this.getAttribute('placeholder')||'', val=this.getAttribute('value')||'', type=this.getAttribute('type')||'text';
    const rows=h==='double'?2:h==='triple'?3:1;
    const ac=type==='password'?'current-password':type==='email'?'email':'username';
    const field=h!=='single'?`<textarea rows="${rows}" placeholder="${ph}">${val}</textarea>`:`<input type="${type}" placeholder="${ph}" value="${val}" autocomplete="${ac}">`;
    this._s.innerHTML=`<style>${this._css(s)}</style>${field}`;
  }
});

customElements.define('tek-text-link', class extends HTMLElement {
  static get observedAttributes() { return ['href','target']; }
  connectedCallback() { this._s = this.attachShadow({mode:'open'}); this._render(); }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const href=this.getAttribute('href')||'#', target=this.getAttribute('target')||'';
    this._s.innerHTML = `<style>${SDR}:host{display:inline;}a{font-family:var(--tek-fonts-family-geist,'Geist',system-ui,sans-serif);font-size:var(--tek-fonts-text-size-xs,10px);line-height:var(--tek-fonts-text-line-height-xs,12px);letter-spacing:0.01em;color:var(--tek-color-text-link-default,#33baea);text-decoration:none;}a:hover{text-decoration:underline;text-underline-offset:2px;}</style>
<a href="${href}"${target?` target="${target}"`:''} ><slot></slot></a>`;
  }
});

customElements.define('tek-button', class extends HTMLElement {
  static get observedAttributes() { return ['variant','inactive','disabled']; }
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this.setAttribute('role','button');
    this.addEventListener('click', () => {
      if (this.hasAttribute('inactive')||this.hasAttribute('disabled')) return;
      this.dispatchEvent(new CustomEvent('tek-click',{bubbles:true,composed:true}));
    });
    this._render();
  }
  attributeChangedCallback() { if (this._s) this._render(); }
  _render() {
    const inactive=this.hasAttribute('inactive')||this.hasAttribute('disabled');
    const bg=inactive?'var(--tek-color-button-background-inactive,#181818)':'var(--tek-color-button-background-default,#1e1e1e)';
    const border=inactive?'var(--tek-color-button-border-inactive,#454545)':'var(--tek-color-button-border-default,#33baea)';
    const color=inactive?'var(--tek-color-button-text-inactive,#454545)':'var(--tek-color-button-text-default,#cccccc)';
    this._s.innerHTML = `<style>${SDR}:host{display:inline-block;}button{background:${bg};border:1px solid ${border};border-radius:9999px;padding:10px 24px !important;font-family:var(--tek-fonts-family-archivo,'Archivo',sans-serif);font-size:var(--tek-fonts-heading-size-xs,16px);line-height:var(--tek-fonts-heading-line-height-xs,24px);font-weight:600;font-variation-settings:'wdth' 120;letter-spacing:0.01em;color:${color};cursor:${inactive?'not-allowed':'pointer'};transition:all 0.15s;white-space:nowrap;width:100%;}
button:not(:disabled):hover{background:var(--tek-color-button-background-hover,#000);color:var(--tek-color-button-text-hover,#fff);}
button:focus-visible{outline:2px solid var(--tek-color-button-border-default,#33baea);outline-offset:2px;}</style>
<button ${inactive?'disabled':''}><slot></slot></button>`;
  }
});

customElements.define('tek-modal', class extends HTMLElement {
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this._s.innerHTML = `<style>${SDR}:host{display:flex;flex-direction:column;gap:14px;background:var(--tek-color-modal-background-default,#181818cc);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0.25px solid var(--tek-color-modal-border-default,#7b7b7b);border-radius:11px;padding:32px !important;width:100%;max-width:360px;box-shadow:0px 2px 6px 0px var(--tek-color-modal-shadow-default,#00000033);}
.hd{font-family:var(--tek-fonts-family-archivo,'Archivo',sans-serif);font-size:var(--tek-fonts-heading-size-md,24px);line-height:var(--tek-fonts-heading-line-height-md,32px);font-weight:600;font-variation-settings:'wdth' 120;letter-spacing:0.01em;color:var(--tek-color-modal-text-default,#fff);}
.in,.ac{display:flex;flex-direction:column;gap:10px;width:100%;}</style>
<div class="hd"><slot name="header"></slot></div>
<div class="in"><slot name="input-blocks"></slot></div>
<div class="ac"><slot name="action-blocks"></slot></div>`;
  }
});

customElements.define('tek-footer', class extends HTMLElement {
  connectedCallback() {
    this._s = this.attachShadow({mode:'open'});
    this._s.innerHTML = `<style>${SDR}:host{display:flex;align-items:center;width:100%;height:36px;padding:12px 16px !important;background:var(--tek-color-footer-background-default,#252525);gap:8px;}
.left{display:flex;align-items:center;gap:4px;flex-shrink:0;}
.right{flex:1 0 0;font-family:var(--tek-fonts-family-geist,'Geist',system-ui,sans-serif);font-size:var(--tek-fonts-text-size-md,13px);line-height:var(--tek-fonts-text-line-height-md,16px);letter-spacing:0.01em;color:var(--tek-color-footer-text-default,#cccccc);text-align:right;}</style>
<div class="left"><slot name="left"></slot></div>
<div class="right"><slot></slot></div>`;
  }
});

/* theme toggle — unchecked = dark 🌚, checked = light 🌝 */
document.getElementById('theme-toggle').addEventListener('tek-change', e => {
  document.documentElement.setAttribute('data-theme', e.detail.checked ? 'light' : 'dark');
});

/* AutoAnimate */
if (typeof autoAnimate !== 'undefined') {
  autoAnimate(document.querySelector('.wrap'));
  autoAnimate(document.getElementById('signin-input-blocks'));
  autoAnimate(document.getElementById('signin-action-blocks'));
}
</script>

</body>
</html>
