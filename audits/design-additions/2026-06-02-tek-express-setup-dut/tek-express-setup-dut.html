<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TekExpress · Setup › DUT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&family=Archivo:wdth,wght@75..125,100..900&display=swap" rel="stylesheet">

<!-- DS-v2 tokens (primitives + dark/light semantic) -->
<link rel="stylesheet" href="ds/tek.complete.css">

<style>
/* ════════════════════════════════════════════════════════════════════════
   New semantic tokens proposed for the TekExpress redesign.
   Documented in tek-express-redesign-additions.md. Each binds to an existing
   primitive (or a proposed primitive) and carries a hex fallback. Light/dark
   parity confirmed — UI-state colours are constant primitives.
════════════════════════════════════════════════════════════════════════ */
:root {
  /* surface the UI-state primitives as semantic aliases (the DS only ships
     these as primitives today — see audit) */
  --tek-color-success: var(--tek-colors-ui-success-green, #42b54c);
  --tek-color-warning: var(--tek-colors-ui-warning-yellow, #e0b732);
  --tek-color-error:   var(--tek-colors-ui-error-red, #e74848);

  /* pressed/active shades — proposed new primitives */
  --tek-colors-brand-tek-blue-pressed: #1ea3d4;
  --tek-colors-ui-success-green-pressed: #379a40;

  /* single-shadow alias (matches DS modal shadow) */
  --shadow-modal: 0px 2px 6px 0px rgba(0,0,0,0.2);

  /* container-breakpoint tokens (proposed) — see additions audit.
     @container queries can't read custom props in the condition, so the px
     below are duplicated literally in the @container rules and kept in sync
     with these names. */
  --tek-container-breakpoint-sm: 640px;
  --tek-container-breakpoint-md: 900px;
  --tek-container-breakpoint-lg: 1200px;

  /* chrome surface — app shell sits one step above canvas (light parity below) */
  --app-chrome-bg: var(--tek-colors-neutral-900, #181818);
}
[data-theme="light"] { --app-chrome-bg: var(--tek-colors-neutral-white, #ffffff); }

/* Safe reset per DS guide — box-sizing only + scoped element reset.
   Never `* { padding:0 }` — it zeroes tek-* host padding through the shadow boundary. */
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, p, fieldset, legend, ul, figure { margin: 0; padding: 0; }

/* themed scrollbars — follow the app's dark/light mode */
* { scrollbar-width: thin; }
[data-theme="dark"] * { scrollbar-color: var(--tek-colors-neutral-500, #5a5a5a) transparent; }
[data-theme="light"] * { scrollbar-color: var(--tek-colors-neutral-300, #979797) transparent; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: var(--tek-borders-radius-full, 9999px); border: 3px solid transparent; background-clip: padding-box; }
[data-theme="dark"] ::-webkit-scrollbar-thumb { background-color: var(--tek-colors-neutral-500, #5a5a5a); }
[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background-color: var(--tek-colors-neutral-400, #6f6f6f); }
[data-theme="light"] ::-webkit-scrollbar-thumb { background-color: var(--tek-colors-neutral-300, #979797); }
[data-theme="light"] ::-webkit-scrollbar-thumb:hover { background-color: var(--tek-colors-neutral-450, #5e5e5e); }
::-webkit-scrollbar-corner { background: transparent; }

html, body { height: 100%; }
body {
  background: var(--tek-colors-neutral-900, #181818);
  color: var(--tek-colors-neutral-100, #cccccc);
  font-family: var(--tek-fonts-family-geist, system-ui, sans-serif);
  font-size: var(--tek-fonts-text-size-lg, 14px);
  line-height: var(--tek-fonts-text-line-height-lg, 20px);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; align-items: flex-start; justify-content: center;
  padding: var(--tek-spacing-s11, 24px);
}
[data-theme="light"] body { background: var(--tek-colors-neutral-200, #b3b3b3); }

/* ── Window frame — the real TekExpress content area: 875 × 773 ──────────────
   Resizable so the live @container breakpoints can still be demonstrated by
   dragging the bottom-right handle. */
.frame {
  width: 875px; height: 773px;
  max-width: 100%;
  resize: both; overflow: hidden;
  display: flex; flex-direction: column;
  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);
  border-radius: var(--tek-borders-radius-05, 11px);
  box-shadow: var(--shadow-modal);
  background: var(--tek-color-canvas-background-default, #1e1e1e);
}
.frame.maximized { position: fixed; inset: 0; width: auto !important; height: auto !important; max-width: none; border-radius: 0; border: none; resize: none; z-index: 100; }
.frame.minimized { display: none; }

/* ── Windows 11-style window chrome (host-OS; not a DS component). The bar is
   INVERTED from the app theme: light bar over a dark app, dark bar over a light app. */
.titlebar { display: flex; align-items: stretch; height: 32px; flex-shrink: 0; border-bottom: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); user-select: none; -webkit-user-select: none; }
.tb-drag { display: flex; align-items: center; gap: var(--tek-spacing-s05, 8px); flex: 1 1 auto; padding-left: var(--tek-spacing-s06, 10px); min-width: 0; }
.tb-icon { width: 15px; height: 13px; display: inline-flex; flex-shrink: 0; }
.tb-title { font-family: var(--tek-fonts-family-geist, sans-serif); font-size: var(--tek-fonts-text-size-sm, 12px); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-caption { display: flex; align-items: stretch; flex-shrink: 0; }
.cap { width: 46px; align-self: stretch; border: none; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: background .12s, color .12s; }
.cap svg { display: block; }
.cap.close:hover { background: #c42b1c; color: #fff; }
.cap:focus-visible { box-shadow: inset 0 0 0 2px var(--tek-color-text-link-default, #33baea); }

/* dark app → LIGHT bar */
[data-theme="dark"] .titlebar { background: var(--tek-colors-neutral-100, #cccccc); }
[data-theme="dark"] .tb-icon svg path { fill: var(--tek-colors-neutral-900, #181818); }
[data-theme="dark"] .tb-title { color: var(--tek-colors-neutral-700, #252525); }
[data-theme="dark"] .cap { color: var(--tek-colors-neutral-800, #1e1e1e); }
[data-theme="dark"] .cap:hover { background: color-mix(in srgb, var(--tek-colors-neutral-black, #000) 8%, transparent); }

/* light app → DARK bar */
[data-theme="light"] .titlebar { background: var(--tek-colors-neutral-900, #181818); }
[data-theme="light"] .tb-icon svg path { fill: var(--tek-colors-neutral-white, #ffffff); }
[data-theme="light"] .tb-title { color: var(--tek-colors-neutral-300, #979797); }
[data-theme="light"] .cap { color: var(--tek-colors-neutral-100, #cccccc); }
[data-theme="light"] .cap:hover { background: color-mix(in srgb, var(--tek-colors-neutral-white, #fff) 9%, transparent); }

/* minimized taskbar chip + closed card */
.taskchip { position: fixed; left: var(--tek-spacing-s11, 24px); bottom: var(--tek-spacing-s11, 24px); z-index: 120; display: none; align-items: center; gap: var(--tek-spacing-s05, 8px); padding: var(--tek-spacing-s05, 8px) var(--tek-spacing-s09, 16px); background: var(--app-chrome-bg); border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b); border-bottom: var(--tek-borders-width-04, 2px) solid var(--tek-color-text-link-default, #33baea); border-radius: var(--tek-borders-radius-03, 5px); box-shadow: var(--shadow-modal); cursor: pointer; color: var(--tek-color-input-text-filled, #cccccc); font-family: var(--tek-fonts-family-geist, sans-serif); font-size: var(--tek-fonts-text-size-md, 13px); }
.taskchip.open { display: inline-flex; }
.taskchip .tb-icon { width: 16px; height: 14px; }
.closed-card { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; }
.closed-card.open { display: flex; }
.app {
  display: flex; flex-direction: column;
  flex: 1 1 auto; min-height: 0; width: 100%;
  container-type: inline-size;     /* ← the responsiveness anchor */
  container-name: app;
  overflow: hidden;
}

/* ── Top navigation (chrome) ─────────────────────────────────────────────── */
.topnav {
  display: flex; align-items: center; gap: var(--tek-spacing-s09, 16px);
  height: 48px; flex-shrink: 0;
  padding: 0 var(--tek-spacing-s09, 16px);
  background: var(--app-chrome-bg);
  border-bottom: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);
}
.brand { display: inline-flex; align-items: center; gap: var(--tek-spacing-s05, 8px); flex-shrink: 0; }
.brand .mark {
  display: inline-flex; align-items: center; justify-content: center;
}
.brand .mark svg { height: 28px; width: auto; }
.brand .mark svg path { fill: var(--tek-color-icons-default, #ffffff); }
.brand .wordmark {
  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600;
  font-size: var(--tek-fonts-heading-size-xs, 16px); line-height: 1; letter-spacing: -0.02em;
  color: var(--tek-color-modal-text-default, #ffffff);
}
.brand-sep-removed { display: none; }
.brand .filename {
  margin-left: var(--tek-spacing-s05, 8px);
  font-family: var(--tek-fonts-family-geist, system-ui, sans-serif);
  font-size: var(--tek-fonts-text-size-sm, 12px); font-weight: 400; line-height: 1;
  color: var(--tek-color-selector-label-unchecked, #afafaf); white-space: nowrap;
}
.brand .filename .unsaved { color: var(--tek-color-text-link-default, #33baea); }
.nav-spacer { flex: 1 1 auto; }

/* ── Body: left side-nav + stage ──────────────────────────────────── */
.body { display: flex; flex: 1 1 auto; min-height: 0; min-width: 0; }
.sidenav {
  flex: 0 0 160px; display: flex; flex-direction: column;
  padding: 0;
  background: var(--app-chrome-bg);
  border-right: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);
  overflow-y: auto;
}
.sidenav-spacer { flex: 1 1 auto; min-height: var(--tek-spacing-s11, 24px); }
.sidenav-foot { display: flex; flex-direction: column; gap: var(--tek-spacing-s06, 10px); padding: 0 var(--tek-spacing-s07, 12px) var(--tek-spacing-s09, 16px); }
.sidenav-foot tek-button { display: block; width: 100%; }

.chrome-right { display: inline-flex; align-items: center; gap: var(--tek-spacing-s09, 16px); flex-shrink: 0; }
.theme-toggle { display: inline-flex; align-items: center; gap: var(--tek-spacing-s04, 6px); }
.theme-toggle span { font-size: 12px; line-height: 1; }
.statusbar .theme-toggle { transform: scale(0.85); transform-origin: right center; }

/* Options menu button */
.options { position: relative; }
.options-btn {
  display: inline-flex; align-items: center; gap: var(--tek-spacing-s04, 6px);
  padding: var(--tek-spacing-s03, 4px) var(--tek-spacing-s06, 10px) var(--tek-spacing-s03, 4px) var(--tek-spacing-s07, 12px);
  background: var(--tek-color-button-background-default, #1e1e1e);
  border: var(--tek-borders-width-02, 1px) solid var(--tek-color-button-border-default, #33baea);
  border-radius: var(--tek-borders-radius-full, 9999px);
  color: var(--tek-color-button-text-default, #cccccc);
  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 106; font-weight: 600;
  font-size: var(--tek-fonts-text-size-lg, 14px); letter-spacing: 0.02em;
  cursor: pointer; outline: none; transition: background .15s, color .15s, border-color .15s;
}
.options-btn:hover { background: var(--tek-color-button-background-hover, #000); color: var(--tek-color-button-text-hover, #fff); }
.options-btn:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-button-border-default, #33baea); }
.options-btn .chev { display: inline-flex; align-items: center; justify-content: center; margin-left: 0; }
.options-btn .chev svg { display: block; transition: transform .15s; transform-box: fill-box; transform-origin: center; }
.options-btn[aria-expanded="true"] .chev svg { transform: rotate(180deg); }
.options-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; min-width: 232px;
  background: var(--tek-color-input-background-default, #252525);
  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-filled, #afafaf);
  border-radius: var(--tek-borders-radius-05, 11px);
  box-shadow: var(--shadow-modal);
  padding: var(--tek-spacing-s03, 4px); display: none;
}
.options-menu.open { display: block; }
.options-menu button {
  display: flex; align-items: center; justify-content: space-between; gap: var(--tek-spacing-s09, 16px);
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: var(--tek-spacing-s05, 8px) var(--tek-spacing-s07, 12px);
  border-radius: var(--tek-borders-radius-02, 3px);
  font-family: var(--tek-fonts-family-geist, sans-serif);
  font-size: var(--tek-fonts-text-size-lg, 14px); line-height: var(--tek-fonts-text-line-height-lg, 20px);
  color: var(--tek-color-input-text-filled, #cccccc); outline: none;
}
.options-menu button:hover, .options-menu button:focus-visible { background: var(--tek-color-selector-background-unchecked, #454545); color: var(--tek-color-modal-text-default, #fff); }
.options-menu .sub { font-family: var(--tek-fonts-family-mono, monospace); font-size: var(--tek-fonts-text-size-sm, 12px); color: var(--tek-color-input-text-default, #979797); }
.options-menu .check { width: 14px; display: inline-flex; color: var(--tek-color-text-link-default, #33baea); }
.options-menu button[aria-checked="true"] .check::before { content: "\2713"; font-size: 13px; }
.options-menu hr { border: none; border-top: 0.5px solid var(--tek-color-input-border-default, #7b7b7b); margin: var(--tek-spacing-s03, 4px) 0; }

/* ── Stage / content ─────────────────────────────────────────────────────── */
.stage { flex: 1 1 auto; min-height: 0; min-width: 0; overflow-y: auto; padding: var(--tek-spacing-s09, 16px); display: flex; flex-direction: column; gap: var(--tek-spacing-s09, 16px); }
.title-row { display: flex; align-items: center; gap: var(--tek-spacing-s07, 12px); flex-wrap: wrap; }
.title {
  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600;
  font-size: var(--tek-fonts-heading-size-sm, 20px); line-height: var(--tek-fonts-heading-line-height-sm, 26px);
  letter-spacing: -0.02em; color: var(--tek-color-modal-text-default, #ffffff);
}
.title .unsaved { color: var(--tek-color-text-link-default, #33baea); }

/* work area: wizard rail + panel */
.work { display: grid; grid-template-columns: 164px 1fr; gap: var(--tek-spacing-s11, 24px); align-items: start; min-width: 0; }
.rail {
  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);
  border-radius: var(--tek-borders-radius-05, 11px);
  background: var(--app-chrome-bg);
  padding: var(--tek-spacing-s09, 16px);
}
.panel { min-width: 0; display: flex; flex-direction: column; gap: var(--tek-spacing-s09, 16px); }

/* section cards (acquisition + identity use the group-box card look directly) */
.card {
  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);
  border-radius: var(--tek-borders-radius-05, 11px);
  background: var(--app-chrome-bg);
  padding: var(--tek-spacing-s09, 16px);
}

/* generic 2-col field grid */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tek-spacing-s07, 12px) var(--tek-spacing-s11, 24px); align-items: start; }
.acq { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--tek-spacing-s11, 24px); align-items: center; }
.radio-stack { display: flex; flex-direction: column; gap: var(--tek-spacing-s06, 10px); }

.card-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tek-spacing-s07, 12px) var(--tek-spacing-s11, 24px); align-items: center; }

.section-heading {
  font-family: var(--tek-fonts-family-archivo, sans-serif); font-variation-settings: 'wdth' 120; font-weight: 600;
  font-size: var(--tek-fonts-heading-size-xs, 16px); line-height: var(--tek-fonts-heading-line-height-xs, 24px);
  letter-spacing: -0.02em; color: var(--tek-color-modal-text-default, #ffffff);
  margin-bottom: var(--tek-spacing-s07, 12px);
}
.subhead {
  font-family: var(--tek-fonts-family-geist, sans-serif); font-weight: 500;
  font-size: var(--tek-fonts-text-size-xl, 16px); line-height: var(--tek-fonts-text-line-height-xl, 24px);
  color: var(--tek-color-modal-text-default, #ffffff);
}
.hr { border: none; border-top: 0.5px solid var(--tek-color-input-border-default, #7b7b7b); margin: var(--tek-spacing-s09, 16px) 0; }
.hr-v { border: none; border-left: 0.5px solid var(--tek-color-input-border-default, #7b7b7b); align-self: stretch; margin: 0; }
.probe-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tek-spacing-s07, 12px) var(--tek-spacing-s11, 24px); align-items: end; }
.probe-row .subhead { grid-column: 1 / -1; }
.inline-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--tek-spacing-s09, 16px) var(--tek-spacing-s11, 24px); align-items: end; }

/* DUT ID field with inline edit affordance */
.dutid { display: flex; align-items: center; gap: var(--tek-spacing-s05, 8px); }
.dutid tek-input { flex: 1 1 auto; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 30px; height: 30px; cursor: pointer;
  background: var(--tek-color-input-background-default, #252525);
  border: var(--tek-borders-width-01, 0.5px) solid var(--tek-color-input-border-default, #7b7b7b);
  border-radius: var(--tek-borders-radius-03, 5px);
  color: var(--tek-color-icons-default, #ffffff); outline: none; transition: border-color .1s, color .1s;
}
.icon-btn:hover { border-color: var(--tek-color-input-border-filled, #afafaf); }
.icon-btn:focus-visible { box-shadow: 0 0 0 2px var(--tek-color-text-link-default, #33baea); }
.icon-btn svg { display: block; }

/* button content (icon + label) inside slotted tek-button */
.bc { display: inline-flex; align-items: center; justify-content: center; gap: var(--tek-spacing-s05, 8px); }
.bc svg { display: block; }

/* tek-button host defaults to width:100% — make buttons size to content by default;
   only full-width where we explicitly opt in (.sidenav-foot run buttons). */
tek-button { width: auto; }
.sidenav-foot tek-button { width: 100%; }
/* dialog buttons: match the Start/Stop (secondary) size, never huge */
#dlgScrim tek-button { padding: var(--tek-spacing-s04, 6px) var(--tek-spacing-s08, 14px); }

/* solid + success button tones — token rebinding (proposed additions) */
/* solid + success button tones — token rebinding (proposed additions).
   Text + icons stay BLACK in every state; hover uses a more-vibrant shade. */
tek-button.btn-solid {
  --tek-color-button-background-default: var(--tek-colors-brand-tek-blue, #33baea);
  --tek-color-button-text-default: var(--tek-colors-neutral-900, #181818);
  --tek-color-button-background-hover: #4ccbf7;
  --tek-color-button-text-hover: var(--tek-colors-neutral-900, #181818);
  --tek-color-button-border-default: var(--tek-colors-brand-tek-blue, #33baea);
  --tek-color-button-border-hover: #4ccbf7;
}
tek-button.btn-success {
  --tek-color-button-background-default: var(--tek-color-success, #42b54c);
  --tek-color-button-text-default: var(--tek-colors-neutral-900, #181818);
  --tek-color-button-background-hover: #4fd35a;
  --tek-color-button-text-hover: var(--tek-colors-neutral-900, #181818);
  --tek-color-button-border-default: var(--tek-color-success, #42b54c);
  --tek-color-button-border-hover: #4fd35a;
}
tek-button.btn-danger {
  --tek-color-button-background-default: var(--tek-color-error, #e74848);
  --tek-color-button-text-default: var(--tek-colors-neutral-900, #181818);
  --tek-color-button-background-hover: #ff5a5a;
  --tek-color-button-text-hover: var(--tek-colors-neutral-900, #181818);
  --tek-color-button-border-default: var(--tek-color-error, #e74848);
  --tek-color-button-border-hover: #ff5a5a;
}
/* ghost run button — no border, no fill; icon + label only, centered to match Start/Stop */
tek-button.btn-ghost {
  --tek-color-button-background-default: transparent;
  --tek-color-button-background-hover: color-mix(in srgb, var(--tek-colors-neutral-white, #fff) 8%, transparent);
  --tek-color-button-background-inactive: transparent;
  --tek-color-button-border-default: transparent;
  --tek-color-button-border-hover: transparent;
  --tek-color-button-border-inactive: transparent;
}
/* run-control CTAs (side-nav foot): semibold label + leading Phosphor icon, centered */
.sidenav-foot .bc { display: flex; align-items: center; justify-content: center; line-height: 1; font-weight: 600; gap: var(--tek-spacing-s05, 8px); }
.sidenav-foot .bc svg { display: block; flex-shrink: 0; }

/* action cluster */
.actions {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--tek-spacing-s07, 12px);
  flex-wrap: wrap; padding-top: var(--tek-spacing-s02, 2px);
}
.actions .run-group { display: inline-flex; gap: var(--tek-spacing-s07, 12px); margin-right: auto; }
.actions tek-button { width: auto; }
/* Back/Next: vertically centered, tight caret-to-text and caret-to-border spacing */
.actions #backBtn .bc, .actions #nextBtn .bc { display: flex; align-items: center; justify-content: center; gap: 0; line-height: 1; }
.actions #backBtn .bc svg, .actions #nextBtn .bc svg { display: block; }
.actions #nextBtn { padding-right: var(--tek-spacing-s03, 4px); }
.actions #backBtn { padding-left: var(--tek-spacing-s03, 4px); }

/* running state: form becomes read-only */

<script>
/* Windows 10-style window chrome behaviour (host-OS chrome; not a DS component) */
(function () {
  "use strict";
  const $id = (id) => document.getElementById(id);
  const frame = $id("frame"), taskChip = $id("taskChip"), closedCard = $id("closedCard"), capMax = $id("capMax");
  if (!frame || !capMax) return;
  const maxIcon = `<svg width="11" height="11" viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"></rect></svg>`;
  const restoreIcon = `<svg width="11" height="11" viewBox="0 0 11 11"><rect x="1.5" y="3" width="6.5" height="6.5" rx="0.5" fill="none" stroke="currentColor" stroke-width="1"></rect><path d="M3.5 3V1.5h6.5V8h-1.5" fill="none" stroke="currentColor" stroke-width="1"></path></svg>`;
  function setMax(on) { frame.classList.toggle("maximized", on); capMax.innerHTML = on ? restoreIcon : maxIcon; capMax.title = on ? "Restore" : "Maximize"; capMax.setAttribute("aria-label", capMax.title); }
  capMax.addEventListener("click", () => setMax(!frame.classList.contains("maximized")));
  const drag = document.querySelector(".tb-drag"); if (drag) drag.addEventListener("dblclick", () => setMax(!frame.classList.contains("maximized")));
  const capMin = $id("capMin"); if (capMin) capMin.addEventListener("click", () => { frame.classList.add("minimized"); if (taskChip) taskChip.classList.add("open"); });
  const restore = () => { frame.classList.remove("minimized"); if (taskChip) taskChip.classList.remove("open"); };
  if (taskChip) { taskChip.addEventListener("click", restore); taskChip.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); restore(); } }); }
  const capClose = $id("capClose"); if (capClose) capClose.addEventListener("click", () => { frame.classList.add("minimized"); if (taskChip) taskChip.classList.remove("open"); if (closedCard) closedCard.classList.add("open"); });
  const reopen = $id("reopenBtn"); if (reopen) reopen.addEventListener("tek-click", () => { if (closedCard) closedCard.classList.remove("open"); frame.classList.remove("minimized"); });
})();
</script>
