<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TekCloud — Create Account</title>

<!-- Fonts — Geist (body/UI) + Archivo (headings/buttons) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Archivo:wdth,wght@75..125,100..900&display=swap" rel="stylesheet">

<!--
  @bbkemp/tokens — complete build (primitives + dark/light semantic)
  In production: @import '@bbkemp/tokens/css/complete'
  Requires: npm run build --workspace=packages/tokens
-->
<link rel="stylesheet" href="./packages/tokens/dist/tek.complete.css">

<!--
  @bbkemp/ui — Web Components
  In production: import '@bbkemp/ui'
  Requires: npm run build --workspace=packages/ui
-->
<script type="module" src="./packages/ui/dist/tek-ui.js"></script>

<!-- AutoAnimate — ambient DOM transitions (light DOM only) -->
<script src="https://cdn.jsdelivr.net/npm/@formkit/auto-animate@latest/index.umd.js"></script>

<style>
/* ============================================================
   PAGE-LEVEL STYLES — MOBILE-FIRST (Dev 5)
   Base styles target 320px. Everything enhances upward.
   All design tokens come from tek.complete.css above.
============================================================ */

/* Safe global reset — does NOT bleed into shadow DOM :host */
*, *::before, *::after { box-sizing: border-box; }
body, h1, h2, h3, h4, h5, h6, p, ul, ol, li,
blockquote, figure, figcaption, dl, dt, dd, pre { margin: 0; padding: 0; }

html, body {
  height: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  min-height: 100dvh; /* dynamic viewport height — respects mobile browser chrome */
  display: flex;
  flex-direction: column;
  font-family: var(--tek-fonts-family-geist);
  color: var(--tek-primitive-color-neutral-100);
  background-color: var(--tek-primitive-color-neutral-800);
  position: relative;
  overflow-x: hidden;
}

.bg-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none;
}

.bg-gradient {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(80,60,140,0.55) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(180,100,80,0.35) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(30,50,120,0.4)  0%, transparent 50%),
    var(--tek-primitive-color-neutral-800);
}

.page-wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  container-type: inline-size;
  container-name: page;
}

/* ---- MOBILE BASE (320px) ---- */
.wrap {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center;
  gap: var(--tek-spacing-s13, 32px); /* tighter gap on small screens */
  padding: var(--tek-spacing-s13, 32px) var(--tek-spacing-s09, 16px) var(--tek-spacing-s09, 16px);
  width: 100%; min-height: 1px;
}

.logo-header {
  display: flex; flex-direction: column;
  align-items: center;
  width: 100%; flex-shrink: 0;
}

.logo-lockup { display: flex; align-items: center; gap: var(--tek-spacing-s04, 6px); }

/* Mobile logo — 40px icon, scaled down for small screens */
.logo-icon { height: 40px; width: auto; display: block; }
.logo-type { height: 17px; width: auto; display: block; }

tek-modal { flex-shrink: 0; width: 100%; }

/* Field wrapper: label stacked above input */
.field {
  display: flex;
  flex-direction: column;
  gap: var(--tek-spacing-s04, 6px);
  width: 100%;
}

/* Name fields — STACKED on mobile by default */
.name-row {
  display: flex;
  flex-direction: column;
  gap: var(--tek-spacing-s09, 16px);
  width: 100%;
}

.name-row .field { width: 100%; }

/* Sign-in link row */
.signin-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--tek-spacing-s02, 4px);
  font-family: var(--tek-fonts-family-geist);
  font-size: var(--tek-fonts-text-size-xs);
  line-height: var(--tek-fonts-text-line-height-xs);
  color: var(--tek-color-input-helper-default);
  min-height: 44px; /* touch target */
}

/* Touch target — all interactive elements get at least 44px hit area */
tek-selector,
tek-checkbox,
tek-toggle {
  min-height: 44px;
}

/* ---- SMALL PHONE ENHANCEMENT (384px — Figma xs breakpoint) ---- */
@container page (min-width: 384px) {
  .wrap {
    padding: var(--tek-spacing-s15, 40px) var(--tek-spacing-s11, 24px) var(--tek-spacing-s09, 16px);
  }
  .logo-icon { height: 52px; }
  .logo-type { height: 22px; }
}

/* ---- TABLET (640px — Figma sm breakpoint) ---- */
@container page (min-width: 640px) {
  .wrap {
    gap: var(--tek-spacing-s17, 48px);
    padding: var(--tek-spacing-s17, 48px) var(--tek-spacing-s19, 64px) var(--tek-spacing-s11, 24px);
  }
  .logo-icon { height: 90px; }
  .logo-type { height: 38px; }

  /* Name fields go side-by-side at tablet+ */
  .name-row {
    flex-direction: row;
    gap: var(--tek-spacing-s05, 8px);
  }
  .name-row .field { flex: 1 1 0; min-width: 0; }
}

/* ---- DESKTOP (1280px — Figma xl breakpoint) ---- */
@container page (min-width: 1280px) {
  .wrap {
    position: relative;
    align-items: center;
    justify-content: center;
    padding: var(--tek-spacing-s19, 64px);
  }
  .logo-header {
    position: absolute;
    top: var(--tek-spacing-s19, 64px);
    left: var(--tek-spacing-s19, 64px);
    align-items: flex-start;
  }
  .logo-icon { height: 128px; }
  .logo-type { height: 52px; }
  tek-modal {
    --tek-modal-heading-size: var(--tek-fonts-heading-size-lg, 32px);
    --tek-modal-heading-line-height: var(--tek-fonts-heading-line-height-lg, 40px);
  }
}
</style>
</head>
<body>

<div class="bg-gradient" aria-hidden="true"></div>
<video class="bg-video" autoplay muted loop playsinline aria-hidden="true">
  <source src="./img/bg-mov.mp4" type="video/mp4">
</video>

<div class="page-wrap">

  <div class="wrap">

    <header class="logo-header">
      <div class="logo-lockup" role="img" aria-label="TekCloud">
        <img class="logo-icon" src="./img/IconLogo.svg" alt="">
        <img class="logo-type" src="./img/TypeLogo.svg" alt="TekCloud">
      </div>
    </header>

    <tek-modal>

      <span slot="header">Create Account</span>

      <div id="signup-input-blocks" slot="input-blocks"
           style="display:flex;flex-direction:column;gap:var(--tek-spacing-s09,16px);width:100%;">

        <!-- Name fields: stacked on mobile, side-by-side at 640px+ -->
        <div class="name-row">
          <div class="field">
            <tek-label>First name</tek-label>
            <tek-input placeholder="First" type="text"
                       inputmode="text" autocomplete="given-name"
                       style="display:block;width:100%"></tek-input>
          </div>
          <div class="field">
            <tek-label>Last name</tek-label>
            <tek-input placeholder="Last" type="text"
                       inputmode="text" autocomplete="family-name"
                       style="display:block;width:100%"></tek-input>
          </div>
        </div>

        <div class="field">
          <tek-label>Email</tek-label>
          <tek-input placeholder="you@example.com" type="email"
                     inputmode="email" autocomplete="email"
                     style="display:block;width:100%"></tek-input>
        </div>

        <div class="field">
          <tek-label helper-text="Must be at least 8 characters">Password</tek-label>
          <tek-input placeholder="Create a password" type="password"
                     autocomplete="new-password"
                     style="display:block;width:100%"></tek-input>
        </div>

        <div class="field">
          <tek-label>Confirm password</tek-label>
          <tek-input placeholder="Re-enter password" type="password"
                     autocomplete="new-password"
                     style="display:block;width:100%"></tek-input>
        </div>

        <tek-selector id="terms-selector" type="checkbox"
          label="I agree to the terms of service" style="width:100%"></tek-selector>

      </div>

      <div id="signup-action-blocks" slot="action-blocks"
           style="width:100%;display:flex;flex-direction:column;gap:var(--tek-spacing-s07,12px);">

        <tek-button id="create-btn" inactive style="width:100%;display:block">
          Create Account
        </tek-button>

        <div class="signin-row">
          <span>Already have an account?</span>
          <tek-text-link href="signin.html">Sign in</tek-text-link>
        </div>

      </div>

    </tek-modal>

  </div>

  <tek-footer>
    <div slot="left" style="display:flex;align-items:center;gap:4px;">
      <span style="font-size:16px;line-height:1;">🌚</span>
      <tek-toggle id="theme-toggle"></tek-toggle>
      <span style="font-size:16px;line-height:1;">🌝</span>
    </div>
    ©2026 Tektronix. All Rights Reserved.
  </tek-footer>

</div>

<script type="module">
/* Theme toggle */
document.getElementById('theme-toggle').addEventListener('tek-change', e => {
  document.documentElement.setAttribute('data-theme', e.detail.checked ? 'light' : 'dark');
});

/* Terms checkbox gates the Create Account button */
document.getElementById('terms-selector').addEventListener('tek-change', e => {
  const btn = document.getElementById('create-btn');
  e.detail.checked ? btn.removeAttribute('inactive') : btn.setAttribute('inactive', '');
});

/* AutoAnimate */
if (typeof autoAnimate !== 'undefined') {
  autoAnimate(document.querySelector('.wrap'));
  autoAnimate(document.getElementById('signup-input-blocks'));
  autoAnimate(document.getElementById('signup-action-blocks'));
}
</script>

</body>
</html>
